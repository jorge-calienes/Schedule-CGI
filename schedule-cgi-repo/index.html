  /* ── Rotation history timeline ── */
  .timeline-row{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin;}
  .timeline-stop{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;}
  .timeline-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
  .timeline-label{font-size:9px;font-weight:600;text-align:center;color:var(--md-sys-color-on-surface);white-space:nowrap;max-width:52px;overflow:hidden;text-overflow:ellipsis;}
  .timeline-period{font-size:8px;color:var(--md-sys-color-on-surface-variant);text-align:center;white-space:nowrap;}
  .timeline-arrow{font-size:10px;color:var(--md-sys-color-outline);align-self:flex-start;margin-top:4px;flex-shrink:0;padding:0 2px;}

  /* ── Call-out history ── */
  .callout-history-list{display:flex;flex-direction:column;gap:var(--md-space-1);}
  .callout-history-row{display:flex;align-items:baseline;gap:var(--md-space-3);padding:var(--md-space-2) var(--md-space-3);background:var(--md-sys-color-surface-container-low);border-radius:var(--md-sys-shape-corner-small);font-size:var(--md-sys-typescale-body-small-size);}
  .callout-date{font-weight:700;color:var(--md-sys-color-error);white-space:nowrap;}
  .callout-reason{color:var(--md-sys-color-on-surface-variant);flex:1;}



  /* ══ Time Off View ══════════════════════════════════════════════ */
  /* ── Time Off Split Layout ── */
  .timeoff-view{display:flex;flex-direction:column;height:100%;width:100%;flex:1;min-width:0;overflow:hidden;background:var(--md-sys-color-surface);}

  .timeoff-split{flex-direction:column;flex:1;min-width:0;}
  .timeoff-split-toolbar{
    background:var(--c-surface);
    border-bottom:1px solid var(--c-border);
    flex-shrink:0;
  }

  .to-add-btn{
    padding:5px 14px !important;
    font-size:13px !important;
    font-weight:600;
    border-radius:var(--r-pill) !important;
    flex-shrink:0;
  }

  .to-toolbar-row1{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px 6px;
  }
  .to-toolbar-row2{
    display:flex;gap:6px;
    padding:0 14px 8px;
  }
  .to-toolbar-title{
    font-size:15px;font-weight:700;
    color:var(--c-text);letter-spacing:-.02em;
  }
  .timeoff-split-title{display:flex;align-items:center;gap:var(--md-space-3);font-size:var(--md-sys-typescale-title-medium-size);font-weight:700;color:var(--md-sys-color-on-surface);}
  .timeoff-split-icon{font-size:20px;}
  .to-summary-pill{font-size:var(--md-sys-typescale-label-medium-size);font-weight:700;padding:4px 12px;border-radius:var(--md-sys-shape-corner-full);background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);}
  .to-summary-pill.warn{background:#FFF3E0;color:#E65100;}

  /* Split body: calendar | list */
  .timeoff-split-body{
    display:flex;
    flex:1;
    width:100%;
    overflow:hidden;
  }
  .timeoff-split-cal{
    flex:1 1 50%;
    min-width:0;
    border-right:1px solid var(--md-sys-color-outline-variant);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .timeoff-split-list{
    flex:1 1 50%;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--md-sys-color-surface-container-lowest);
  }
  .split-list-header{
    padding:var(--md-space-3) var(--md-space-4);
    font-size:var(--md-sys-typescale-label-large-size);
    font-weight:700;
    color:var(--md-sys-color-on-surface-variant);
    text-transform:uppercase;
    letter-spacing:.04em;
    border-bottom:1px solid var(--md-sys-color-outline-variant);
    background:var(--md-sys-color-surface-container-low);
    flex-shrink:0;
  }

  /* responsive: stack vertically on narrow screens */
  @media(max-width:900px){
    .timeoff-split-body{flex-direction:column;}
    .timeoff-split-cal{flex:0 0 auto;width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--c-border);max-height:42vh;min-height:260px;overflow-y:auto;}
    .timeoff-split-list{flex:1;min-width:0;}
  }

  /* keep old to-toolbar-right for any fallback */
  .to-toolbar-right{display:flex;align-items:center;gap:var(--md-space-3);}

  /* ── Calendar ── */
  .cal-grid-wrap{flex:1;overflow-y:auto;padding:var(--md-space-3) var(--md-space-4) var(--md-space-5);}
  .cal-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .cal-nav-btn{background:none;border:1px solid var(--c-border);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-text);line-height:1;flex-shrink:0;}
  .cal-nav-btn:hover{background:var(--md-sys-color-surface-container-high);}
  .cal-month-label{font-size:var(--md-sys-typescale-title-large-size);font-weight:700;flex:1;color:var(--md-sys-color-on-surface);}
  .cal-today-btn{background:none;border:1.5px solid var(--md-sys-color-primary);border-radius:var(--md-sys-shape-corner-full);padding:5px 16px;font-family:var(--sans);font-size:var(--md-sys-typescale-label-large-size);cursor:pointer;color:var(--md-sys-color-primary);font-weight:600;}
  .cal-today-btn:hover{background:var(--md-sys-color-primary-container);}
  .cal-legend{display:flex;gap:12px;margin-bottom:6px;}
  .cal-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--c-text-2);}
  .cal-legend-dot{width:8px;height:8px;border-radius:50%;background:#E65100;flex-shrink:0;}
  .cal-legend-dot.green{background:#2E7D32;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium);overflow:hidden;}
  .cal-dow{background:var(--md-sys-color-surface-container-low);padding:var(--md-space-2) 0;text-align:center;font-size:var(--md-sys-typescale-label-medium-size);font-weight:700;color:var(--md-sys-color-on-surface-variant);border-bottom:1px solid var(--md-sys-color-outline-variant);}
  .cal-cell{
    background:var(--md-sys-color-surface-container-lowest);
    border-right:1px solid var(--md-sys-color-outline-variant);
    border-bottom:1px solid var(--md-sys-color-outline-variant);
    padding:var(--md-space-2);
    min-height:110px;
    display:flex;flex-direction:column;gap:3px;
    transition:background .1s;
    vertical-align:top;
  }
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell:hover:not(.empty){background:var(--md-sys-color-surface-container-low);}
  .cal-cell.empty,.cal-cell.trailing{background:var(--md-sys-color-surface-container);opacity:.4;}
  .cal-cell.today{background:color-mix(in srgb,var(--md-sys-color-primary) 5%,white);}
  .cal-cell.past{opacity:.6;}
  .cal-cell.weekend{background:var(--md-sys-color-surface-container);}
  .cal-day-num{
    font-size:var(--md-sys-typescale-label-large-size);font-weight:600;
    color:var(--md-sys-color-on-surface-variant);
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;flex-shrink:0;margin-bottom:2px;
  }
  .cal-cell.today .cal-day-num{background:var(--md-sys-color-primary);color:#fff;}
  .cal-entries{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden;}
  .cal-pill{
    display:flex;align-items:center;gap:3px;
    padding:2px 5px;border-radius:4px;
    font-size:10.5px;line-height:1.3;
    cursor:default;
    overflow:hidden;
  }
  .cal-pill-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
  .cal-pill-name{font-weight:600;color:var(--md-sys-color-on-surface);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-pill-check{color:#2E7D32;font-size:9px;font-weight:700;flex-shrink:0;}
  .cal-pill-warn{color:#E65100;font-size:9px;font-weight:700;flex-shrink:0;}
  .cal-more{font-size:9px;color:var(--md-sys-color-primary);font-weight:700;padding:1px 5px;}

  /* ── List view ── */
  .to-list-wrap{flex:1;overflow-y:auto;padding:var(--md-space-3) var(--md-space-4) var(--md-space-5);}
  .to-section-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:var(--md-sys-typescale-label-large-size);font-weight:700;
    padding:var(--md-space-2) var(--md-space-4);
    border-radius:var(--md-sys-shape-corner-small);
    margin-bottom:var(--md-space-3);
  }
  .to-section-head.warn{background:#FFF3E0;color:#E65100;}
  .to-section-head.ok{background:#E8F5E9;color:#1B5E20;}

  .to-list-card{
    background:var(--md-sys-color-surface-container-lowest);
    border:1px solid var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-medium);
    margin-bottom:var(--md-space-3);
    overflow:hidden;
    transition:box-shadow .15s;
  }
  .to-list-card:hover{box-shadow:var(--md-sys-elevation-1);}
  .to-list-card.active{border-color:var(--md-sys-color-primary);}

  .to-card-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:var(--md-space-3) var(--md-space-4);
    border-bottom:1px solid var(--md-sys-color-outline-variant);
    flex-wrap:wrap;gap:var(--md-space-2);
  }
  .to-card-who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .to-list-name{font-weight:700;font-size:var(--md-sys-typescale-body-large-size);}
  .to-active-pill{font-size:10px;font-weight:700;color:var(--md-sys-color-primary);background:var(--md-sys-color-primary-container);padding:2px 8px;border-radius:var(--md-sys-shape-corner-full);}
  .to-card-meta{display:flex;align-items:center;gap:var(--md-space-2);flex-wrap:wrap;}
  .to-card-dates{font-size:var(--md-sys-typescale-body-small-size);font-weight:600;color:var(--md-sys-color-on-surface-variant);}
  .to-card-reason{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);background:var(--md-sys-color-surface-container-high);padding:2px 8px;border-radius:var(--md-sys-shape-corner-full);}

  .to-card-coverage{padding:var(--md-space-3) var(--md-space-4);}

  /* Best-fit suggestion cards */
  .to-suggestion-label{font-size:var(--md-sys-typescale-body-small-size);font-weight:600;color:var(--md-sys-color-on-surface-variant);margin-bottom:var(--md-space-2);}
  .to-suggestion-row{display:flex;align-items:stretch;gap:var(--md-space-2);flex-wrap:wrap;}
  .to-sug-card{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--md-sys-color-surface-container-low);
    border:1.5px solid var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-medium);
    padding:var(--md-space-2) var(--md-space-3);
    min-width:72px;
    cursor:pointer;
    font-family:var(--sans);
    transition:border-color .15s,background .15s;
  }
  .to-sug-card:hover{border-color:var(--md-sys-color-primary);background:var(--md-sys-color-primary-container);}
  .to-sug-name{font-weight:700;font-size:var(--md-sys-typescale-body-medium-size);color:var(--md-sys-color-on-surface);}
  .to-sug-exp{font-size:10px;font-weight:700;white-space:nowrap;}
  .to-sug-times{font-size:9px;color:var(--md-sys-color-on-surface-variant);}
  .to-sug-divider{width:1px;background:var(--md-sys-color-outline-variant);align-self:stretch;margin:0 var(--md-space-1);}
  .to-sug-more{
    padding:4px 8px;border:1.5px solid var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-small);
    font-family:var(--sans);font-size:var(--md-sys-typescale-body-small-size);
    color:var(--md-sys-color-on-surface-variant);
    background:var(--md-sys-color-surface-container-low);
    align-self:center;cursor:pointer;min-width:110px;
  }

  /* Coverage assigned badge */
  .to-cov-badge{display:flex;align-items:center;gap:var(--md-space-2);background:#E8F5E9;border-radius:var(--md-sys-shape-corner-small);padding:var(--md-space-2) var(--md-space-3);}
  .to-cov-icon{color:#2E7D32;font-size:16px;font-weight:700;flex-shrink:0;}
  .to-cov-name{font-weight:700;font-size:var(--md-sys-typescale-body-medium-size);color:#1B5E20;}
  .to-cov-label{font-size:var(--md-sys-typescale-body-small-size);color:#388E3C;}
  .to-no-area{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);font-style:italic;}

  /* Empty state */
  .to-empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;color:var(--c-text-2);}
  .to-empty-icon{font-size:36px;margin-bottom:10px;}
  .to-empty-msg{font-size:15px;font-weight:600;color:var(--c-text);margin-bottom:4px;}

  /* responsive */
  @media(max-width:599px){
    .timeoff-toolbar{padding:var(--md-space-2) var(--md-space-3);}
    .cal-grid-wrap,.to-list-wrap{padding:var(--md-space-3);}
    .cal-cell{min-height:72px;}
    .to-list-card{border-radius:var(--md-sys-shape-corner-small);}
    .to-sug-card{min-width:60px;}
  }


  /* ── Coverage planning dashboard ── */
  .to-toolbar{display:flex;gap:8px;align-items:center;padding:var(--md-space-3) 0 var(--md-space-3);position:sticky;top:0;background:var(--md-sys-color-surface);z-index:2;border-bottom:1px solid var(--md-sys-color-outline-variant);margin-bottom:var(--md-space-3);}
  .to-toolbar input[type="text"]{flex:1;padding:6px 12px;border:1.5px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-full);font-family:var(--sans);font-size:var(--md-sys-typescale-body-medium-size);}
  .to-past-toggle{display:flex;align-items:center;gap:4px;font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);white-space:nowrap;cursor:pointer;}

  .to-date-group{margin-bottom:var(--md-space-4);}
  .to-date-header{display:flex;align-items:center;justify-content:space-between;padding:var(--md-space-2) var(--md-space-3);background:var(--md-sys-color-surface-container-low);border-radius:var(--md-sys-shape-corner-small);margin-bottom:var(--md-space-2);}
  .to-date-header.today{background:var(--md-sys-color-primary-container);}
  .to-date-header.past{opacity:.6;}
  .to-date-label{font-weight:700;font-size:var(--md-sys-typescale-label-large-size);color:var(--md-sys-color-on-surface);}
  .to-date-header.today .to-date-label{color:var(--md-sys-color-on-primary-container);}
  .to-date-count{font-size:var(--md-sys-typescale-label-medium-size);color:var(--md-sys-color-on-surface-variant);font-weight:600;}

  .to-entry-card{background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium);padding:var(--md-space-3) var(--md-space-4);margin-bottom:var(--md-space-2);transition:border-color .15s;}
  .to-entry-card:hover{border-color:var(--md-sys-color-outline);}
  .to-entry-card.past{opacity:.65;}
  .to-entry-main{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--md-space-2);}
  .to-entry-person{display:flex;align-items:center;gap:var(--md-space-2);flex-wrap:wrap;}
  .to-entry-name{font-weight:700;font-size:var(--md-sys-typescale-body-large-size);}
  .to-entry-area{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--md-sys-shape-corner-full);white-space:nowrap;}
  .to-entry-area.unassigned{background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);border:1px solid var(--md-sys-color-outline-variant);}
  .to-entry-meta{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .to-entry-reason{color:var(--md-sys-color-on-surface-variant);}
  .to-entry-active{color:var(--md-sys-color-primary);font-weight:700;}

  .to-coverage-row{margin-bottom:var(--md-space-2);}
  .to-coverage-assigned{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--md-sys-color-secondary-container);border-radius:var(--md-sys-shape-corner-small);padding:var(--md-space-2) var(--md-space-3);}
  .to-coverage-label{font-size:var(--md-sys-typescale-label-medium-size);font-weight:700;color:var(--md-sys-color-on-secondary-container);text-transform:uppercase;letter-spacing:.04em;}
  .to-coverage-name{font-weight:700;font-size:var(--md-sys-typescale-body-medium-size);color:var(--md-sys-color-on-secondary-container);}
  .to-remove-cov{margin-left:auto;background:none;border:none;font-size:12px;cursor:pointer;color:var(--md-sys-color-on-secondary-container);opacity:.7;padding:2px 4px;}
  .to-remove-cov:hover{opacity:1;}

  .to-entry-actions{display:flex;gap:6px;justify-content:flex-end;}

  /* ── Time off ── */
  .time-off-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
  .time-off-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--md-sys-color-surface-container-low);border-radius:var(--md-sys-shape-corner-small);font-size:var(--md-sys-typescale-body-small-size);}
  .time-off-dates{font-weight:700;color:var(--md-sys-color-on-surface);white-space:nowrap;}
  .time-off-note{color:var(--md-sys-color-on-surface-variant);flex:1;}
  .to-row-edit,.to-row-del{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;color:var(--md-sys-color-on-surface-variant);}
  .to-row-del:hover{color:var(--md-sys-color-error);}
  /* ── Coverage banner on chip ── */
  .coverage-banner{display:flex;align-items:center;gap:6px;background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--md-sys-shape-corner-small);margin-bottom:4px;flex-wrap:wrap;}
  .coverage-return-hint{opacity:.8;font-weight:400;}
  .act-return-coverage{background:var(--md-sys-color-tertiary);color:#fff;border:none;border-radius:var(--md-sys-shape-corner-full);padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;}


  /* ═══ STAFF MODAL: TABS, SWITCHES, GRID ═══════════════════════════ */

  /* Staff modal tab bar */
  .sm-tab-bar{
    display:flex;
    background:var(--c-surface-2,#F5F5F7);
    border-bottom:1px solid var(--c-border,rgba(0,0,0,.09));
    padding:0 16px;
    gap:0;
    flex-shrink:0;
  }
  .sm-tab{
    flex:1;
    padding:12px 8px 11px;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--c-text-2,#6E6E73);
    cursor:pointer;
    transition:color .15s,border-color .15s;
    white-space:nowrap;
    letter-spacing:-.01em;
  }
  .sm-tab.active{
    color:var(--c-accent,#2F5FA8);
    border-bottom-color:var(--c-accent,#2F5FA8);
    font-weight:600;
  }

  /* Profile 2-col grid */
  .sm-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:340px){.sm-grid-2{grid-template-columns:1fr;}}

  /* Toggle switch group */
  .sw-group{
    display:flex;flex-direction:column;
    border:1px solid var(--c-border,rgba(0,0,0,.09));
    border-radius:var(--r-md,14px);
    overflow:hidden;
    margin-bottom:16px;
  }
  .sw-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;
    background:var(--c-surface,#fff);
    border-bottom:1px solid var(--c-border,rgba(0,0,0,.09));
    gap:12px;
  }
  .sw-row:last-child{border-bottom:none;}
  .sw-label-group{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .sw-label{font-size:15px;font-weight:500;color:var(--c-text,#1D1D1F);letter-spacing:-.01em;}
  .sw-sublabel{font-size:12px;color:var(--c-text-2,#6E6E73);}

  /* Switch track — !important to beat the unified input reset */
  .sw-track{
    display:inline-block !important;
    width:44px !important; min-width:44px !important;
    height:26px !important;
    flex-shrink:0 !important;
    background:#C7C7CC !important;
    border-radius:13px !important;
    border:none !important;
    padding:0 !important;
    box-shadow:none !important;
    position:relative;
    cursor:pointer;
    transition:background .22s ease;
    vertical-align:middle;
    outline:none;
  }
  .sw-track:focus-visible{box-shadow:0 0 0 3px rgba(47,95,168,.25) !important;}
  .sw-track.on{background:var(--c-accent,#2F5FA8) !important;}
  .sw-thumb{
    position:absolute;
    top:3px;left:3px;
    width:20px !important;height:20px !important;
    background:#FFFFFF;
    border-radius:50% !important;
    box-shadow:0 1px 4px rgba(0,0,0,.22);
    transition:transform .22s ease;
    display:block;
    pointer-events:none;
  }
  .sw-track.on .sw-thumb{transform:translateX(18px);}
  .sw-reveal{
    max-height:0;opacity:0;overflow:hidden;margin-top:0;
    transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .2s ease,margin-top .32s cubic-bezier(.4,0,.2,1);
  }
  .sw-reveal.open{max-height:600px;opacity:1;margin-top:12px;}

  /* Language cert chips */
  .lang-cert-grid{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:12px 0 4px;
  }
  .lang-cert-chip{
    display:inline-flex;align-items:center;gap:4px;
    padding:7px 14px;
    border:1.5px solid var(--c-border,rgba(0,0,0,.09));
    border-radius:var(--r-pill,999px);
    font-family:inherit;
    font-size:14px;font-weight:500;
    color:var(--c-text-2,#6E6E73);
    background:var(--c-surface,#fff);
    cursor:pointer;
    transition:border-color .15s var(--ease-out),color .15s var(--ease-out),background .15s var(--ease-out);
    user-select:none;
  }
  .lang-cert-chip:hover{border-color:var(--c-accent);color:var(--c-accent);}
  .lang-cert-chip.checked{
    background:var(--c-accent,#2F5FA8);
    border-color:var(--c-accent,#2F5FA8);
    color:#fff;font-weight:600;
  }

  /* ── View container (all non-board tabs) ── */
  .view-container{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }


  /* ── Nav drawer Rotate footer ── */
  .nav-rotate-footer{
    padding:10px 12px 14px;
  }
  .nav-rotate-btn{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 0;
    background:var(--c-accent);
    color:#fff;
    border:none;border-radius:12px;
    font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;letter-spacing:-.01em;
    transition:background .15s,transform .1s;
  }
  .nav-rotate-btn:active{transform:scale(.98);background:#254d8a;}

  /* ── Stats proficiency grid ── */
  .stats-prof-section-label{
    font-size:var(--md-sys-typescale-label-medium-size);
    font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--md-sys-color-on-surface-variant);
    margin:var(--md-space-4) 0 var(--md-space-2);
  }
  .stats-prof-grid{display:flex;flex-direction:column;gap:var(--md-space-2);}
  .stats-prof-card{
    background:var(--md-sys-color-surface-container-lowest);
    border:1px solid var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-medium);
    padding:var(--md-space-3) var(--md-space-4);
    transition:border-color .15s;
  }
  .stats-prof-card.current{border-color:var(--md-sys-color-primary);border-width:2px;}
  .stats-prof-card-header{display:flex;align-items:center;gap:var(--md-space-2);margin-bottom:var(--md-space-2);}
  .area-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .stats-prof-area-name{font-weight:700;font-size:var(--md-sys-typescale-body-large-size);flex:1;}
  .stats-prof-rating-row{display:flex;align-items:center;gap:var(--md-space-3);margin-bottom:var(--md-space-1);}
  .prof-stars{display:flex;gap:2px;align-items:center;}
  .prof-star{font-size:18px;line-height:1;}
  .prof-star.filled{color:#F9A825;}
  .prof-star.half{color:#F9A825;opacity:0.5;}
  .prof-star.empty{color:var(--md-sys-color-outline);}
  .prof-stars.unrated{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);font-style:italic;}
  .stats-prof-badge{
    font-size:10px;font-weight:700;
    color:#fff;padding:2px 9px;
    border-radius:var(--md-sys-shape-corner-full);
    font-family:var(--mono);
    white-space:nowrap;
  }
  .stats-prof-meta{
    font-size:var(--md-sys-typescale-body-small-size);
    color:var(--md-sys-color-on-surface-variant);
    line-height:1.4;
  }

  /* ── Stats tab ── */
  .stats-overall-bar-wrap{margin-bottom:var(--md-space-4);}
  .stats-overall-label{display:flex;justify-content:space-between;font-size:var(--md-sys-typescale-body-medium-size);font-weight:600;margin-bottom:6px;}
  .stats-overall-pct{color:var(--md-sys-color-primary);font-weight:700;}
  .stats-overall-track{height:10px;background:var(--md-sys-color-surface-container-highest);border-radius:5px;overflow:hidden;}
  .stats-overall-fill{height:100%;background:var(--md-sys-color-primary);border-radius:5px;}
  .stats-area-grid{display:flex;flex-direction:column;gap:var(--md-space-2);}
  .stats-area-card{background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-small);padding:var(--md-space-3);}
  .stats-area-card-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .stats-area-card-name{font-weight:600;font-size:var(--md-sys-typescale-body-medium-size);flex:1;}
  .stats-never-label{font-size:var(--md-sys-typescale-label-medium-size);text-transform:uppercase;letter-spacing:.04em;color:var(--md-sys-color-on-surface-variant);font-weight:700;margin:var(--md-space-3) 0 var(--md-space-2);}
  .stats-never-chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);background:var(--md-sys-color-surface-container-high);border-radius:var(--md-sys-shape-corner-full);padding:3px 10px;margin:3px;}

  /* ── Performance evaluations (Stats tab + team dashboard) ── */
  .eval-summary-grid{display:flex;gap:var(--md-space-4);flex-wrap:wrap;margin-bottom:var(--md-space-2);}
  .eval-summary-stat{display:flex;flex-direction:column;gap:2px;}
  .eval-summary-label{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);font-weight:600;}
  .eval-summary-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:var(--md-space-3);}
  .eval-rec-badge{font-size:11px;font-weight:700;color:#fff;padding:3px 10px;border-radius:var(--md-sys-shape-corner-full);white-space:nowrap;}
  .eval-rec-badge.small{font-size:9.5px;padding:2px 8px;}
  .eval-history-list{display:flex;flex-direction:column;gap:var(--md-space-2);}
  .eval-history-row{background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-small);padding:var(--md-space-3);}
  .eval-history-row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .eval-history-date{font-size:var(--md-sys-typescale-body-small-size);font-weight:600;color:var(--md-sys-color-on-surface-variant);}
  .eval-history-scores{font-family:var(--mono);font-size:var(--md-sys-typescale-body-small-size);margin-bottom:2px;}
  .eval-history-evaluator{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);}
  .eval-history-note{font-size:var(--md-sys-typescale-body-small-size);font-style:italic;margin-top:4px;padding-top:4px;border-top:1px dashed var(--md-sys-color-outline-variant);}

  /* ── Evaluation form (mockup screen 3) ── */
  .eval-form-grid{display:grid;grid-template-columns:1fr;gap:var(--md-space-5);}
  @media(min-width:600px){.eval-form-grid{grid-template-columns:1fr 1fr;}}
  .eval-person{display:flex;align-items:center;gap:12px;margin-bottom:var(--md-space-4);}
  .eval-person-av{width:44px;height:44px;border-radius:50%;background:#2F5FA8;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .eval-person-name{font-weight:700;font-size:16px;}
  .eval-person-sub{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);}
  .score-row{margin-bottom:var(--md-space-4);}
  .score-row label{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .score-hint{font-weight:400;color:var(--md-sys-color-on-surface-variant);font-size:12px;}
  .score-scale{display:flex;gap:6px;}
  .score-scale-btn{flex:1;padding:10px 0;border-radius:9px;border:1.5px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--md-sys-color-on-surface-variant);}
  .score-scale-btn.sel{background:#2F5FA8;border-color:#2F5FA8;color:#fff;}
  .rec-options{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .rec-opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1.5px solid var(--md-sys-color-outline-variant);border-radius:10px;cursor:pointer;}
  .rec-opt.sel{border-color:#2F5FA8;background:var(--md-sys-color-primary-container);}
  .rec-opt-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--md-sys-color-outline-variant);margin-top:1px;flex-shrink:0;background:var(--md-sys-color-surface);}
  .rec-opt.sel .rec-opt-dot{border-color:#2F5FA8;background:#2F5FA8;}
  .rec-opt-t{font-weight:700;font-size:13.5px;}
  .rec-opt-d{font-size:12px;color:var(--md-sys-color-on-surface-variant);}

  /* ── Evaluation trend chart (staff performance profile) ── */
  .trend-chart{height:110px;display:flex;align-items:flex-end;gap:7px;padding:16px 4px 0;}
  .trend-bar{flex:1;min-width:0;background:linear-gradient(to top,#2F5FA8,#6E97D6);border-radius:5px 5px 0 0;position:relative;}
  .trend-bar-v{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--md-sys-color-on-surface-variant);}
  .trend-labels{display:flex;gap:7px;margin-top:6px;margin-bottom:var(--md-space-4);}
  .trend-labels span{flex:1;text-align:center;font-size:10.5px;color:var(--md-sys-color-on-surface-variant);}

  /* ── Team dashboard ── */
  .team-dash-summary{display:flex;gap:var(--md-space-5);flex-wrap:wrap;margin-bottom:var(--md-space-4);padding-bottom:var(--md-space-4);border-bottom:1px solid var(--md-sys-color-outline-variant);}
  .team-dash-stat{display:flex;flex-direction:column;gap:2px;}
  .team-dash-stat-label{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);font-weight:600;}
  .team-dash-search{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--md-sys-color-outline);border-radius:var(--md-sys-shape-corner-small);font-family:inherit;font-size:14px;margin-bottom:var(--md-space-4);}
  .team-dash-filter-count{font-family:var(--mono);font-size:10.5px;opacity:.85;margin-left:auto;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);padding:1px 8px;border-radius:var(--md-sys-shape-corner-full);}
  .team-dash-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--md-space-4);max-height:56vh;overflow-y:auto;}
  .team-dash-col-head{display:flex;align-items:center;gap:8px;margin-bottom:var(--md-space-2);}
  .team-dash-col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .team-dash-col-head h3{font-size:13.5px;margin:0;}
  .team-dash-card{display:block;width:100%;text-align:left;background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-small);padding:var(--md-space-3);cursor:pointer;font-family:inherit;margin-bottom:var(--md-space-2);}
  .team-dash-card:hover{border-color:var(--md-sys-color-primary);}
  .team-dash-card-name{font-weight:700;font-size:13px;margin-bottom:4px;}
  .team-dash-card-scores{display:flex;gap:5px;flex-wrap:wrap;}
  .mini-score{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);}

  /* ---------- certifications & language badges ---------- */
  .chip-certs{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
  .cert-badge{
    font-size:9.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:var(--md-sys-shape-corner-full);
    white-space:nowrap;
    font-family:var(--mono);
  }
  .cert-counter{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;}
  .cert-lang{background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9;}

  /* ---------- supervisor tag on chip card ---------- */
  .chip-sup-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:9.5px;font-weight:700;letter-spacing:.01em;
    padding:2px 7px 2px 5px;border-radius:var(--md-sys-shape-corner-full);
    white-space:nowrap;font-family:var(--mono);
    background:var(--sup-bg,#EEE);color:var(--sup-fg,#555);
    border:1px solid var(--sup-border,#ccc);
    margin-top:2px;width:fit-content;
  }
  .chip-sup-dot{width:6px;height:6px;border-radius:50%;background:var(--sup-fg,#555);flex:none;}

  /* ---------- AGS / sub-contractor + roster flow column ---------- */
  .roster-flag-checkbox{
    appearance:none;-webkit-appearance:none;
    width:20px;height:20px;
    border:1.5px solid var(--c-border,#D1D5DB);
    border-radius:6px;
    background:var(--c-surface,#fff);
    cursor:pointer;position:relative;
    vertical-align:middle;
    transition:background .15s,border-color .15s,transform .1s;
    flex-shrink:0;
  }
  .roster-flag-checkbox:hover{border-color:var(--c-accent,#2F5FA8);transform:scale(1.05);}
  .roster-flag-checkbox:active{transform:scale(.94);}
  .roster-flag-checkbox::after{
    content:'';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;line-height:20px;text-align:center;
    opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;
  }
  .roster-flag-lead:checked{background:var(--c-accent,#2F5FA8);border-color:var(--c-accent,#2F5FA8);}
  .roster-flag-lead::after{content:'★';color:#fff;}
  .roster-flag-lead:checked::after{opacity:1;transform:scale(1);}
  .roster-flag-ags:checked{background:#FEF3C7;border-color:#B45309;}
  .roster-flag-ags::after{content:'🏷';font-size:11px;}
  .roster-flag-ags:checked::after{opacity:1;transform:scale(1);}

  /* ---------- supervisor form (avatar preview + card list) ---------- */
  .sup-form-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px;}
  .sup-avatar-preview{
    width:52px;height:52px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:18px;
    transition:background .15s;
  }
  .sup-list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .btn-link-view-org{
    background:none;border:none;color:var(--c-accent,#2F5FA8);font-size:12px;font-weight:600;
    cursor:pointer;padding:2px 4px;
  }
  .btn-link-view-org:hover{text-decoration:underline;}
  .sup-card-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;}
  .sup-card{
    display:flex;align-items:center;gap:10px;padding:9px 10px;
    border:1px solid var(--c-border,#E5E5EA);border-radius:10px;
    cursor:pointer;transition:background .12s,border-color .12s;
  }
  .sup-card:hover{background:var(--c-surface-2,#F8F8FB);}
  .sup-card.active{border-color:var(--c-accent,#2F5FA8);background:#EEF3FC;}
  .sup-card-avatar{
    width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sup-card-info{flex:1;min-width:0;}
  .sup-card-name{font-weight:700;font-size:13.5px;color:var(--c-text,#1D1D1F);}
  .sup-card-team{display:flex;align-items:center;gap:6px;margin-top:2px;}
  .sup-card-avatars{display:flex;}
  .sup-mini-avatar{
    width:18px;height:18px;border-radius:50%;background:#C7C7CC;color:#fff;font-size:8px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--c-surface,#fff);margin-left:-6px;
  }
  .sup-mini-avatar:first-child{margin-left:0;}
  .sup-mini-more{background:#9CA3AF;}
  .sup-card-count{font-size:11px;color:var(--c-text-2,#6E6E73);}
  .sup-card-chevron{color:var(--c-text-3,#B0B0B8);font-size:16px;}

  /* ---------- org diagram (pure-CSS tree) ---------- */
  .org-diagram-body{overflow-x:auto;overflow-y:auto;padding:24px 16px;}
  .org-tree-wrap{display:flex;justify-content:center;min-width:max-content;}
  .org-tree,.org-tree ul,.org-tree li{list-style:none;margin:0;padding:0;position:relative;}
  .org-tree{display:flex;justify-content:center;}
  .org-tree ul{display:flex;padding-top:24px;position:relative;}
  .org-tree li{float:none;text-align:center;padding:24px 14px 0 14px;position:relative;}
  .org-tree li::before,.org-tree li::after{
    content:'';position:absolute;top:0;right:50%;
    border-top:2px solid var(--c-border,#D7D7DC);width:50%;height:24px;
  }
  .org-tree li::after{right:auto;left:50%;border-left:2px solid var(--c-border,#D7D7DC);}
  .org-tree li:only-child::after,.org-tree li:only-child::before{display:none;}
  .org-tree li:only-child{padding-top:0;}
  .org-tree li:first-child::before,.org-tree li:last-child::after{border:0 none;}
  .org-tree li:last-child::before{border-right:2px solid var(--c-border,#D7D7DC);border-radius:0 6px 0 0;}
  .org-tree li:first-child::after{border-radius:6px 0 0 0;}
  .org-tree ul ul::before{
    content:'';position:absolute;top:0;left:50%;
    border-left:2px solid var(--c-border,#D7D7DC);width:0;height:24px;
  }
  .org-tree > li{padding-top:0;}
  .org-tree > li::before,.org-tree > li::after{display:none;}
  .org-root-box{
    display:inline-block;padding:10px 20px;border-radius:10px;
    background:var(--c-accent,#2F5FA8);color:#fff;font-weight:700;font-size:14px;
  }
  .org-sup-box{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 14px 8px 8px;border-radius:10px;
    background:var(--c-surface,#fff);border:1.5px solid var(--sv-color,#ccc);
    cursor:pointer;transition:box-shadow .15s,transform .1s;white-space:nowrap;
  }
  .org-sup-box:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateY(-1px);}
  .org-unassigned-box{border-style:dashed;cursor:default;}
  .org-unassigned-box:hover{box-shadow:none;transform:none;}
  .org-sup-avatar{
    width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .org-sup-name{font-weight:700;font-size:13px;color:var(--c-text,#1D1D1F);}
  .org-sup-count{
    font-size:11px;font-weight:700;color:var(--c-text-2,#6E6E73);
    background:var(--c-surface-2,#F5F5F7);padding:1px 7px;border-radius:99px;
  }
  .org-leaf{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 10px 5px 5px;border-radius:99px;
    background:var(--c-surface-2,#F5F5F7);border:1px solid var(--c-border,#E5E5EA);
    font-size:11.5px;white-space:nowrap;
  }
  .org-leaf.lead{border-color:var(--c-accent,#2F5FA8);background:#EAF1FC;}
  .org-leaf-avatar{
    width:20px;height:20px;border-radius:50%;background:#9CA3AF;color:#fff;
    font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .org-leaf-name{color:var(--c-text,#1D1D1F);}
  .org-ags-dot{
    font-size:8.5px;font-weight:700;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;
    padding:0 4px;border-radius:99px;margin-left:2px;
  }
  .roster-card-ags{
    display:inline-block;font-size:10px;font-weight:700;
    background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;
    padding:1px 6px;border-radius:99px;margin:1px;
  }
  .ags-badge-sm{
    display:inline-block;font-size:9.5px;font-weight:700;
    background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;

  .modal.modal-no-anim{animation:none !important;}

    from{opacity:0;transform:translateY(4px)}
    to{opacity:1;transform:translateY(0)}
  }
  .sm-tab-panel-anim{animation:sm-tab-slide .24s cubic-bezier(.22,.61,.36,1);}
  @keyframes sm-tab-slide{
    from{opacity:0;transform:translateX(calc(var(--tab-dir,1) * 18px));}
    to{opacity:1;transform:translateX(0);}
  }
  .stats-cert-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}

  /* language cert chips in staff editor */
  .lang-cert-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .lang-cert-chip{
    display:inline-flex;align-items:center;gap:4px;
    padding:6px 12px;
    border:1.5px solid var(--md-sys-color-outline);
    border-radius:var(--md-sys-shape-corner-full);
    font-size:var(--md-sys-typescale-label-large-size);
    font-weight:500;
    color:var(--md-sys-color-on-surface-variant);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    user-select:none;
  }
  .lang-cert-chip:hover{background:var(--md-sys-color-surface-container-high);}
  .lang-cert-chip.checked{
    background:var(--md-sys-color-primary-container);
    color:var(--md-sys-color-on-primary-container);
    border-color:var(--md-sys-color-primary);
    font-weight:700;
  }

  /* ---------- department reorder modal ---------- */
  .dept-order-row{
    display:flex;
    align-items:center;
    gap:var(--md-space-3);
    background:var(--md-sys-color-surface-container-lowest);
    border:1px solid var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-small);
    padding:var(--md-space-3);
    margin-bottom:var(--md-space-2);
    transition:box-shadow .15s, opacity .15s;
    cursor:default;
  }
  .dept-order-row.drag-over{box-shadow:0 0 0 2px var(--md-sys-color-primary);}
  .dept-order-row.dragging{opacity:0.4;}
  .dept-order-handle{
    font-size:18px;
    color:var(--md-sys-color-on-surface-variant);
    cursor:grab;
    user-select:none;
    flex-shrink:0;
    line-height:1;
  }
  .dept-order-handle:active{cursor:grabbing;}
  .dept-order-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .dept-order-name{font-weight:700;font-size:var(--md-sys-typescale-body-large-size);color:var(--md-sys-color-on-surface);}
  .dept-order-areas{font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .dept-order-swatch{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .dept-order-arrows{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .dept-arrow-btn{
    background:var(--md-sys-color-surface-container-high);
    border:none;
    border-radius:var(--md-sys-shape-corner-extra-small);
    width:28px;height:24px;
    font-size:12px;
    color:var(--md-sys-color-on-surface);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .dept-arrow-btn:hover:not(:disabled){background:var(--md-sys-color-surface-container-highest);}
  .dept-arrow-btn:disabled{opacity:.3;cursor:not-allowed;}

  /* ---------- fixed areas panel ---------- */
  .fixed-areas-panel{
    margin-top:var(--md-space-6);
    border-top:2px dashed var(--md-sys-color-outline-variant);
    padding-top:var(--md-space-4);
  }
  .fixed-panel-header{
    display:flex;
    align-items:center;
    gap:var(--md-space-3);
    margin-bottom:var(--md-space-4);
    flex-wrap:wrap;
  }
  .fixed-panel-icon{font-size:18px;}
  .fixed-panel-title{
    font-size:var(--md-sys-typescale-title-small-size);
    font-weight:700;
    color:var(--md-sys-color-on-surface-variant);
    letter-spacing:.01em;
  }
  .fixed-panel-subtitle{
    font-size:var(--md-sys-typescale-body-small-size);
    color:var(--md-sys-color-on-surface-variant);
    margin-left:var(--md-space-1);
  }
  .fixed-panel-cols{
    display:flex;
    gap:var(--md-space-4);
    flex-wrap:wrap;
    align-items:flex-start;
  }
  /* fixed area card: same structure as area-col but visually muted */
  .fixed-area-col{
    opacity:0.9;
    border:1.5px dashed var(--md-sys-color-outline);
    background:var(--md-sys-color-surface-container-lowest);
    box-shadow:none;
  }
  .fixed-area-col .area-head{
    background:var(--md-sys-color-surface-container);
  }
  .fixed-area-col .area-drop{
    background:var(--md-sys-color-surface-container-lowest);
  }
  .fixed-badge{
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--md-sys-color-on-surface-variant);
    background:var(--md-sys-color-surface-container-highest);
    padding:2px 6px;
    border-radius:var(--md-sys-shape-corner-full);
    font-family:var(--mono);
  }
  /* on mobile: fixed panel stacks vertically, cards go full width */
  @media(max-width:599px){
    .fixed-panel-cols{flex-direction:column;}
    .fixed-area-col{width:100%;}
  }

  /* scrollbars */
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--md-sys-color-outline);border-radius:4px;}
  .area-col ::-webkit-scrollbar-thumb{background:var(--md-sys-color-outline-variant);}

  /* ---------- mobile drawer (compact-only sidebar overlay) ---------- */
  .drawer-scrim{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:15;
  }
  .period-pill-warn{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);}

  /* ======================================================================
     RESPONSIVE LAYER — Material Design 3 window size classes
     compact:    0    - 599px   (phone)
     medium:     600  - 839px   (small tablet / phone landscape)
     expanded:   840  - 1199px  (large tablet / small desktop)  -- current default styles target this and up
     large/xl:   1200px+        (desktop / large monitor)
     ====================================================================== */

  /* ---- LARGE / EXTRA-LARGE (1200px+): a bit more breathing room ---- */
  @media (min-width:1200px){
    .board-wrap{padding:var(--md-space-6);}
    .area-col{width:320px;min-width:280px;max-width:420px;}
    .overview-columns{columns:4 280px;}
  }

  /* ---- MEDIUM (600-839px): narrower sidebar, board still horizontal-scroll, 2-col overview ---- */
  @media (max-width:839px){
    .sidebar{width:200px;}
    .area-col{width:320px;min-width:280px;max-width:420px;}
    .overview-columns{columns:2 240px;}
    .roster-search{width:200px;}
  }

  /* ---- COMPACT (<600px): single-column, drawer sidebar, stacked board, full-screen dialogs ---- */
  @media (max-width:599px){
    html{font-size:15px;}

    /* compact: app bar stays single row, tab bar scrolls horizontally */
    .topbar{padding:0 var(--md-space-2);gap:var(--md-space-1);}
    .search-box{width:80px !important;font-size:13px;}
    .search-box:focus{width:120px !important;}
    .brand{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;display:block;}
    .period-pill{font-size:10px;padding:var(--md-space-1) var(--md-space-2);white-space:nowrap;}
    .btn-primary{font-size:12px;padding:7px 12px;}
    .rotate-label{display:none;}
    .tab-bar{height:64px;}
    .tab-btn{min-width:72px;padding:8px var(--md-space-2) 10px;}

    .tab-icon{font-size:22px;}
    .tab-label{font-size:10px;}
    .layout{height:calc(100vh - 120px);position:relative;}

    /* sidebar becomes a slide-in drawer, hidden off-canvas until opened */
    .sidebar{
      position:fixed;
      top:0; bottom:0; left:0;
      width:82vw;
      max-width:320px;
      z-index:20;
      transform:translateX(-100%);
      transition:transform .2s ease;
      box-shadow:var(--md-sys-elevation-3);
      padding-top:120px;
    }
    .sidebar.drawer-open{transform:translateX(0);}
    .drawer-scrim{display:block;}

    /* board mobile: full-width stacked, page is the scrollbar */
    .board-wrap{padding:0 0 24px;width:100%;box-sizing:border-box;overflow-x:hidden;}
    .board{flex-direction:column;align-items:stretch;gap:10px;overflow-x:visible;padding-right:0;overflow-y:visible;}
    .area-col{
      width:auto !important;
      min-width:0 !important;
      max-width:none !important;   /* let it fill full width */
      height:auto !important;
      max-height:none !important;
      overflow:visible !important;
    }
    .area-drop{
      max-height:none !important;overflow-y:visible !important;
      flex:none !important;min-height:0 !important;
    }
    .dept-board{gap:20px;padding:0 12px;}
    .add-area-col{width:100%;min-height:52px;}

    /* overview: single column, already has columns:1 from existing 900px rule but reinforce here */
    .overview-wrap{padding:var(--md-space-3) var(--md-space-4) var(--md-space-8);}
    .overview-columns{columns:1;}
    .overview-toolbar{flex-direction:column;align-items:flex-start;gap:var(--md-space-2);}

    /* roster: allow horizontal scroll, sticky first column for context while scrolling */
    .roster-toolbar{flex-direction:row;align-items:center;}
    .roster-search{width:100%;}
    .roster-table{font-size:11.5px;}
    .roster-table td{padding:3px 3px 3px 6px;}
    .roster-table th{padding:7px 3px 7px 6px;}
    .roster-table .cell-name{position:sticky;left:0;background:var(--md-sys-color-surface-container-lowest);z-index:2;}
    .roster-table thead th:first-child{position:sticky;left:0;z-index:3;}

    /* breaks view: single-column results, tighter filter panel */
    .breaks-wrap{padding:var(--md-space-3) var(--md-space-3) var(--md-space-8);}
    .breaks-filters{padding:var(--md-space-3);}
    .breaks-results{grid-template-columns:1fr;}
    .filter-chip{font-size:11px;padding:var(--md-space-1) var(--md-space-2);min-height:36px;}

    /* chips: slightly larger tap targets */
    .chip-actions button{padding:var(--md-space-2) var(--md-space-1);font-size:11px;min-height:32px;}

    /* modals become full-screen sheets, not centered cards, for comfortable thumb reach */
    .modal-backdrop{padding:0;align-items:flex-end;}
    .modal{
      max-width:100%;
      width:100%;
      max-height:92vh;
      border-radius:var(--md-sys-shape-corner-extra-large) var(--md-sys-shape-corner-extra-large) 0 0;
    }
    .modal-foot{flex-wrap:wrap;gap:6px;}
    .modal-foot .btn-primary{flex:1;min-width:0;}
    .modal-foot .btn-danger{flex:0 0 auto;}

    .callout-banner{flex-wrap:wrap;}

  }

  /* ---------- Sign-in screen (real Supabase auth gate) ---------- */
  .rc-signin-screen{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;

    outline:none;

    border-radius:20px;
    padding:28px 24px 24px;

    text-align:center;

    font-size:13px;color:var(--ink-soft);
    margin-bottom:20px;
  }
  .rc-signin-label{
    text-align:left;
    font-size:12px;font-weight:600;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.03em;
    margin:0 0 6px;
  }
  .rc-signin-name-input{
    width:100%;box-sizing:border-box;
    font-family:inherit;font-size:16px;
    color:var(--c-text);background:var(--c-surface-2,var(--c-bg));
    border:1px solid var(--c-border);border-radius:12px;
    padding:11px 14px;
    outline:none;
    margin-bottom:18px;
    transition:border-color .15s;
  }
  .rc-signin-name-input:focus{border-color:var(--c-accent);}
  .rc-pin-dots{
    display:flex;justify-content:center;gap:14px;
    margin-bottom:10px;
  }
  .rc-pin-dot{
    width:14px;height:14px;border-radius:50%;
    border:1.5px solid var(--ink-soft);
    background:transparent;
    transition:background .12s,border-color .12s,transform .12s;
  }
  .rc-pin-dot.filled{
    background:var(--c-accent);border-color:var(--c-accent);
    transform:scale(1.08);
  }
  .rc-signin-error{
    color:var(--rust);font-size:13px;font-weight:600;
    margin-bottom:10px;min-height:16px;
  }
  .rc-signin-error-detail{
    color:var(--ink-soft);font-size:11px;font-family:var(--mono,monospace);
    margin:-6px 0 10px;word-break:break-word;
  }
  .rc-keypad{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:14px 0 20px;
  }
  .rc-keypad-btn{
    font-family:inherit;font-size:20px;font-weight:500;
    color:var(--c-text);
    background:var(--c-surface-2,var(--c-bg));
    border:1px solid var(--c-border);
    border-radius:14px;
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .1s,transform .08s;
  }
  .rc-keypad-btn:hover{background:var(--c-surface-3,#E5E5EA);}
  .rc-keypad-btn:active{transform:scale(.94);}
  .rc-keypad-btn:disabled{opacity:.5;cursor:default;}
  .rc-keypad-btn.rc-keypad-backspace{font-size:17px;color:var(--ink-soft);border:none;background:transparent;}
  .rc-keypad-blank{aspect-ratio:1;}
  .rc-signin-submit-btn{
    width:100%;
    font-family:inherit;font-size:15px;font-weight:600;
    color:#fff;background:var(--c-accent);
    border:none;border-radius:12px;
    padding:12px;
    cursor:pointer;
    transition:opacity .12s;
  }
  .rc-signin-submit-btn:hover{opacity:.9;}
  .rc-signin-submit-btn:disabled{opacity:.6;cursor:default;}
  .nav-account{
    padding:10px 16px 4px;
    font-size:12px;color:var(--ink-soft);
  }
  .nav-account b{color:var(--c-text);font-weight:600;}

const STORAGE_KEY = 'rotation-app-state-v1';
let toastTimer = null;
let toastExitTimer = null;

// ============ AUTH (Supabase sign-in gate) ============
// status: 'checking' (session lookup in flight) | 'signed-out' | 'submitting' | 'signed-in'
let authState = {
  status: 'checking',
  name: '',
  pin: '',
  error: '',
  errorDetail: '', // muted technical detail shown under `error`, for diagnosing unexpected failures
  account: null, // {id, name, role, assigned_area_id}
  showRequestForm: false,
  requestName: '',
  requestStatus: 'idle', // 'idle' | 'submitting' | 'done'
  requestMessage: '',
};

// Team leads get evaluations + a read-only board view — every write table's
// RLS policy already requires is_manager() (admin/supervisor) server-side,
// so this is closing the client-side gap: without it, a team lead could
// drag people around, mark callouts, edit staff, etc. and only find out it
// silently failed to save. Real enforcement stays in Postgres; this just
// keeps the UI from offering actions that were always going to be rejected.
function isTeamLeadRole(){ return !!(authState.account && authState.account.role === 'team_lead'); }

function waitForRC(){
  return new Promise(resolve=>{
    if(window.RC){ resolve(); return; }
    window.addEventListener('rc:ready', ()=>resolve(), {once:true});
    setTimeout(resolve, 5000); // don't hang forever if the module script fails to load
  });
}

function renderSignInScreen(){
  if(authState.status==='checking'){
    return `<div class="rc-signin-screen"><div class="rc-signin-checking">Loading…</div></div>`;
  }
  if(authState.showRequestForm) return renderRequestAccessScreen();
  const submitting = authState.status==='submitting';
  const digitBtn = d => `<button type="button" class="rc-keypad-btn" data-digit="${d}" ${submitting?'disabled':''}>${d}</button>`;
  return `
  <div id="rc-signin-screen" class="rc-signin-screen" tabindex="-1">
    <div class="rc-signin-card">
      <div class="rc-signin-brand">Schedule</div>
      <div class="rc-signin-sub">Sign in with your name and PIN</div>

      <div class="rc-signin-label">Name</div>
      <input id="rc-signin-name" class="rc-signin-name-input" type="text" autocomplete="name"
        placeholder="Full name" value="${escapeHtml(authState.name)}" ${submitting?'disabled':''}/>

      <div class="rc-signin-label">PIN</div>
      <div class="rc-pin-dots" id="rc-pin-dots">
        ${[0,1,2,3].map(i=>`<span class="rc-pin-dot${authState.pin.length>i?' filled':''}"></span>`).join('')}
      </div>

      <div class="rc-signin-error">${authState.error?escapeHtml(authState.error):''}</div>
      ${authState.errorDetail ? `<div class="rc-signin-error-detail">${escapeHtml(authState.errorDetail)}</div>` : ''}

      <div class="rc-keypad">
        ${['1','2','3'].map(digitBtn).join('')}
        ${['4','5','6'].map(digitBtn).join('')}
        ${['7','8','9'].map(digitBtn).join('')}
        <div class="rc-keypad-blank"></div>
        ${digitBtn('0')}
        <button type="button" id="rc-pin-backspace" class="rc-keypad-btn rc-keypad-backspace" aria-label="Backspace" ${submitting?'disabled':''}>⌫</button>
      </div>

      <button type="button" id="rc-signin-submit" class="rc-signin-submit-btn" ${submitting?'disabled':''}>
        ${submitting ? 'Signing in…' : 'Sign in'}
      </button>
      ${submitting?'':'<button type="button" id="rc-toggle-request" style="background:none;border:none;color:var(--md-sys-color-primary);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:14px;padding:8px;">Don\'t have access yet? Request it</button>'}
    </div>
  </div>`;
}

function renderRequestAccessScreen(){
  const submitting = authState.requestStatus==='submitting';
  const done = authState.requestStatus==='done';
  return `
  <div id="rc-signin-screen" class="rc-signin-screen" tabindex="-1">
    <div class="rc-signin-card">
      <div class="rc-signin-brand">Schedule</div>
      <div class="rc-signin-sub">Request access</div>
      ${done ? `
        <div class="rc-signin-error" style="color:var(--md-sys-color-tertiary);margin:16px 0;">${escapeHtml(authState.requestMessage||'Request submitted.')}</div>
        <button type="button" id="rc-toggle-request" class="rc-signin-submit-btn">← Back to sign in</button>
      ` : `
        <div class="rc-signin-label">Your full name</div>
        <input id="rc-request-name-input" class="rc-signin-name-input" type="text" autocomplete="name"
          placeholder="Full name" value="${escapeHtml(authState.requestName||'')}" ${submitting?'disabled':''}/>
        <div class="rc-signin-error">${authState.requestMessage?escapeHtml(authState.requestMessage):''}</div>
        <button type="button" id="rc-request-submit" class="rc-signin-submit-btn" ${submitting?'disabled':''}>${submitting?'Submitting…':'Request access'}</button>
        <button type="button" id="rc-toggle-request" style="background:none;border:none;color:var(--md-sys-color-primary);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:14px;padding:8px;" ${submitting?'disabled':''}>← Back to sign in</button>
      `}
    </div>
  </div>`;
}

async function attemptRequestAccess(){
  if(authState.requestStatus==='submitting') return;
  const name = (authState.requestName||'').trim();
  if(!name){ authState.requestMessage = 'Enter your name.'; render(); return; }
  if(!window.RC || typeof window.RC.requestAccess!=='function'){
    authState.requestMessage = 'Request is unavailable right now. Refresh and try again.';
    render();
    return;
  }
  authState.requestStatus = 'submitting';
  authState.requestMessage = '';
  render();
  try{
    const body = await window.RC.requestAccess(name);
    authState.requestStatus = 'done';
    authState.requestMessage = body.message || 'Request submitted.';
  }catch(e){
    console.error('Request access failed:', e);
    authState.requestStatus = 'idle';
    authState.requestMessage = 'Could not submit your request — try again.';
  }
  render();
}

function signInPinDigit(d){
  if(authState.status==='submitting') return;
  if(authState.pin.length>=4) return;
  authState.pin += d;
  authState.error = '';
  authState.errorDetail = '';
  render();
  if(authState.pin.length===4) attemptSignIn();
}

function signInPinBackspace(){
  if(authState.status==='submitting') return;
  if(!authState.pin.length) return;
  authState.pin = authState.pin.slice(0,-1);
  authState.error = '';
  authState.errorDetail = '';
  render();
}

// Our own API already returns short, actionable messages for the cases
// people actually hit (wrong name/PIN, account not active yet, etc.) — pass
// those through as-is. Anything else is a technical/unexpected failure (a
// network hiccup, a library error) that isn't helpful to show verbatim, so
// give a plain, friendly fallback instead and log the real detail to the
// console for debugging.
const KNOWN_SIGNIN_MESSAGES = [
  'Name and a 4-digit PIN are required.',
  'Name or PIN not recognized.',
  'This account is not active yet.',
  'Account is not linked to a login. Contact an admin.',
  'Could not start a session. Try again.',
];
function friendlySignInError(e){
  const msg = e && e.message;
  if(msg && KNOWN_SIGNIN_MESSAGES.includes(msg)) return msg;
  return "Something went wrong signing in — give it another try.";
}

async function attemptSignIn(){
  if(authState.status==='submitting') return;
  const name = authState.name.trim();
  if(!name){ authState.error = 'Enter your name.'; authState.errorDetail = ''; render(); return; }
  if(authState.pin.length!==4){ authState.error = 'Enter your 4-digit PIN.'; authState.errorDetail = ''; render(); return; }
  if(!window.RC || typeof window.RC.signInWithPin!=='function'){
    authState.error = 'Sign-in is unavailable right now. Refresh and try again.';
    authState.errorDetail = '';
    render();
    return;
  }
  authState.status = 'submitting';
  authState.error = '';
  authState.errorDetail = '';
  render();
  try{
    const account = await window.RC.signInWithPin(name, authState.pin);
    authState.account = account;
    authState.status = 'signed-in';
    authState.pin = '';
    authState.error = '';
    authState.errorDetail = '';
    await bootApp();
  }catch(e){
    console.error('Sign-in failed:', e);
    authState.status = 'signed-out';
    authState.pin = '';
    authState.error = friendlySignInError(e);
    // Small, muted technical detail shown under the friendly message —
    // not for the average user, just so a screenshot is enough to diagnose
    // an unexpected failure without needing browser devtools access. Includes
    // the first couple stack frames (function/file:line) so we can tell
    // exactly where in the library/call chain this is coming from.
    const stackLines = (e && e.stack ? String(e.stack).split('\n').slice(0,3).join(' | ') : '');
    authState.errorDetail = e ? `${e.name || 'Error'}: ${e.message || String(e)}${stackLines ? ' — '+stackLines : ''}` : '';
    render();
  }
}

function attachSignInHandlers(){
  const screen = document.getElementById('rc-signin-screen');
  const nameInput = document.getElementById('rc-signin-name');
  const reqNameInput = document.getElementById('rc-request-name-input');

  on('rc-toggle-request', ()=>{
    authState.showRequestForm = !authState.showRequestForm;
    authState.requestMessage = '';
    authState.requestStatus = 'idle';
    render();
  });
  on('rc-request-submit', attemptRequestAccess);
  if(reqNameInput){
    reqNameInput.addEventListener('input', e=>{
      authState.requestName = e.target.value;
      authState.requestMessage = '';
      const pos = reqNameInput.selectionStart;
      render();
      const el = document.getElementById('rc-request-name-input');
      if(el){ el.focus(); el.setSelectionRange(pos, pos); }
    });
    reqNameInput.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); attemptRequestAccess(); }
    });
  }

  if(nameInput){
    nameInput.addEventListener('input', e=>{
      authState.name = e.target.value;
      authState.error = '';
      authState.errorDetail = '';
      const pos = nameInput.selectionStart;
      render();
      const el = document.getElementById('rc-signin-name');
      if(el){ el.focus(); el.setSelectionRange(pos, pos); }
    });
    nameInput.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); attemptSignIn(); }
    });
  }

  document.querySelectorAll('#rc-signin-screen [data-digit]').forEach(btn=>{
    btn.addEventListener('click', ()=> signInPinDigit(btn.getAttribute('data-digit')));
  });
  on('rc-pin-backspace', signInPinBackspace);
  on('rc-signin-submit', attemptSignIn);

  if(screen && !authState.showRequestForm){
    screen.addEventListener('keydown', e=>{
      if(document.activeElement===nameInput) return; // let the name field handle its own typing
      if(/^[0-9]$/.test(e.key)){ e.preventDefault(); signInPinDigit(e.key); }
      else if(e.key==='Backspace' || e.key==='Delete'){ e.preventDefault(); signInPinBackspace(); }
      else if(e.key==='Enter'){ e.preventDefault(); attemptSignIn(); }
    });
    if(document.activeElement!==nameInput) screen.focus();
  }
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function todayLabel(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function yesterdayLabel(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function friendlyDate(isoStr){
  if(!isoStr) return '—';
  try{
    const [y,m,d] = isoStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[dt.getDay()]+' '+months[m-1]+' '+d;
  } catch(e){ return isoStr; }
}

async function loadState(){
  try{
    const res = await window.storage.get('app-state', true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(state, parsed, {loaded:true});
      if(!state.supervisors) state.supervisors = [];
      if(!state.rotationFlows) state.rotationFlows = [];
      if(!state.proficiency) state.proficiency = {};

      if(!state.dailyLog) state.dailyLog = [];
      if(!state.teamLeadCoverage) state.teamLeadCoverage = {};
      if(!state.fillHistory) state.fillHistory = [];
      if(!state.coverage) state.coverage = {};
      if(!state.timeOff) state.timeOff = {};
      if(!state.areaOrder) state.areaOrder = {};
      // migrate old department names on staff
      state.staff.forEach(s=>{
        if(s.department==='Customer Service / Communications') s.department='Communications';
        if(s.department==='Fraud') s.department='Fixed Positions';
        if(s.department==='Cashier') s.department='Fixed Positions';

        if(s.department==='Courier / Processing / QC') s.department='Courier / Processing / QC';
      });
      // auto-return any coverage assigned on a previous day
      if(state.coverage && Object.keys(state.coverage).length > 0){
        const today = todayLabel();
        let anyReturned = false;
        Object.keys(state.coverage).forEach(sid=>{
          const cov = state.coverage[sid];
          if(cov.date && cov.date !== today){
            // stale — return to original area
            state.assignments[sid] = cov.returnToAreaId || null;
            delete state.coverage[sid];
            anyReturned = true;
          }
        });
        if(anyReturned) console.log('Auto-returned stale coverage staff');
      }
      // Apply today's scheduled time off and sync coverage to board on load
      applyScheduledTimeOff();
      if(!state.shifts) state.shifts = [
        {id:'sh1',label:'7:00 – 3:45',start:'7:00',end:'3:45'},

      ];

        if(s.counterCert===undefined) s.counterCert = false;
        if(!s.languageCerts) s.languageCerts = [];
        // normalize shiftHours to use en-dash to match dropdown labels
        if(s.shiftHours) s.shiftHours = s.shiftHours.replace(/\s*-\s*/g,' – ');
      });
      state.areas.forEach(a=>{
        if(a.fixed===undefined) a.fixed = false;
        // merge old separate rows into single combined row
        if(a.department==='Courier'||a.department==='Processing'||a.department==='BP / QC'){
          a.department = 'Courier / Processing / QC';
        }
        if(a.department==='Cashier'||a.department==='Fraud'||a.department==='Admin'){

        }
      });
      state.staff.forEach(s=>{
        if(s.supervisorId===undefined) s.supervisorId = null;
        if(s.flowId===undefined) s.flowId = null;

let saveQueued = false;
async function saveState(){
  // debounce-ish: collapse rapid saves
  if(saveQueued) return;
  saveQueued = true;
  setTimeout(async ()=>{
    saveQueued = false;
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        const payload = JSON.stringify({
          areas: state.areas, staff: state.staff, blocks: state.blocks,
          assignments: state.assignments, history: state.history,
          currentPeriod: state.currentPeriod, callouts: state.callouts,
          departments: state.departments, supervisors: state.supervisors,
          rotationFlows: state.rotationFlows,
          proficiency: state.proficiency,
          pendingFeedback: state.pendingFeedback,
          calloutHistory: state.calloutHistory,
          rotationNotes: state.rotationNotes,
          dailyLog: state.dailyLog,
          teamLeadCoverage: state.teamLeadCoverage,
          fillHistory: state.fillHistory,
          coverage: state.coverage,
          timeOff: state.timeOff,
          shifts: state.shifts,
          languages: state.languages
        });
        // storage.set may return null on success in some environments — that's fine
        await window.storage.set('app-state', payload, true);
      }
      // if no storage API, state lives in memory for this session only
    }catch(e){
      // only show error for unexpected failures, not missing API or null response
      if(e && e.message && !e.message.includes('Invalid response')){
        console.warn('save warning:', e.message);
      }
    }
  }, 150);
}

function showToast(msg, kind){
  const root = document.getElementById('toast-root');
  if(!root) return;
  clearTimeout(toastTimer);
  clearTimeout(toastExitTimer);
  root.innerHTML = `<div class="toast ${kind||''}">${escapeHtml(msg)}</div>`;
  const el = root.querySelector('.toast');
  toastExitTimer = setTimeout(()=>{ if(el) el.classList.add('leaving'); }, 2900);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 3200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getStaffById(id){ return state.staff.find(s=>s.id===id); }
