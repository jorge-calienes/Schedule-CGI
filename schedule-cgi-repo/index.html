    const groups  = areasByDepartment();
    const fixed   = state.areas.filter(a=>a.fixed);
    const calledOut = state.staff.filter(s=>s.active!==false && state.callouts[s.id]);
    const langStaff = state.staff.filter(s=>s.active!==false && ((s.languageCerts||[]).length || s.counterCert));
    const langNames = s=>(s.languageCerts||[]).map(id=>state.languages.find(x=>x.id===id)?.name).filter(Boolean).join(', ');
    const friendlyD = d=>{ try{const[y,m,dd]=d.split('-');const dt=new Date(y,m-1,dd);return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}};

    // ── Helpers ──────────────────────────────────────────────────────────
    function totalHoursWorked(s){
      // Sum hours from shift label e.g. "7:30 – 4:15" = 8.75h
      const m = (s.shiftHours||'').match(/(\d+):(\d+)[^\d]+(\d+):(\d+)/);
      if(!m) return null;
      const start = parseInt(m[1])*60+parseInt(m[2]);
      const end   = parseInt(m[3])*60+parseInt(m[4]);
      const daily = (end - start) / 60;
      const periods = state.history.filter(h=>h.assignments&&h.assignments[s.id]).length;
      return periods > 0 ? (daily * periods).toFixed(1) : null;
    }
    function calloutCount(s){
      return (state.calloutHistory||{})[s.id]?.length || 0;
    }
    function scheduledLeaveCount(s){
      const offs = (state.timeOff||{})[s.id]||[];
      const upcoming = offs.filter(r=>r.endDate>=today);
      return upcoming.length;
    }
    function rotationCount(s){
      return state.history.filter(h=>h.assignments&&h.assignments[s.id]).length;
    }
    function needsChange(s, areaId){
      if(!areaId) return false;
      return isRepeatArea(s.id, areaId);
    }

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 1 — Board layout
    // ─────────────────────────────────────────────────────────────────────
    let page1 = `<div class="page page-break">
      <div class="report-header">
        <div>
          <h1>Schedule Board</h1>
          <div class="subtitle">Period: ${period} &nbsp;·&nbsp; ${today}</div>
        </div>
        <div class="report-stats-row">
          <span class="report-stat">${state.staff.filter(s=>s.active!==false).length} staff</span>
          <span class="report-stat">${state.areas.length} areas</span>
          ${calledOut.length?`<span class="report-stat callout-stat">${calledOut.length} out today</span>`:''}
        </div>
      </div>`;

    groups.filter(g=>!g.areas.every(a=>a.fixed)).forEach(g=>{
      page1 += `<div class="dept-block"><div class="dept-label">${escapeHtml(g.department)}</div><div class="areas-row">`;
      g.areas.filter(a=>!a.fixed).forEach(a=>{
        const members = staffInArea(a.id).filter(s=>s.active!==false);
        const isOut = s => !!state.callouts[s.id];
        page1 += `<div class="area-card"><div class="area-name"><span>${escapeHtml(a.name)}</span><span class="area-cap">${members.length}/${a.capacity}</span></div>`;
        if(!members.length) page1 += `<div class="empty">—</div>`;
        members.forEach(s=>{
          const out = isOut(s);
          const cov = state.coverage?.[s.id];
          const sched = isScheduledOut(s.id,today);
          const rec = ((state.timeOff||{})[s.id]||[]).find(r=>today>=r.startDate&&today<=r.endDate);
          const hasCov = !!(rec?.coverageStaffId);
          page1 += `<div class="person-row ${s.isTeamLead?'lead':''} ${out?'out':''}">
            <span>${s.isTeamLead?'★ ':''}${escapeHtml(s.name)}</span>
            ${(showTimes||showBreaks)?`<span class="person-meta">${showTimes?escapeHtml(s.shiftHours||''):''}${showTimes&&showBreaks&&s.breakTimes?' · ':''}${showBreaks&&s.breakTimes?escapeHtml(s.breakTimes):''}</span>`:''}
            ${sched&&!hasCov?'<span class="badge badge-warn">📅 No coverage</span>':''}
            ${sched&&hasCov?'<span class="badge badge-ok">📅 Covered</span>':''}
            ${cov?'<span class="badge badge-cov">↩ Covering</span>':''}
            ${out&&!sched?'<span class="badge badge-out">Out</span>':''}
            ${showAccom&&s.needsAccommodations?'<span class="badge" style="background:#f0e6ff;color:#6b21a8">♿</span>':''}
          </div>`;
        });
        page1 += `</div>`;
      });
      page1 += `</div></div>`;
    });

    // Fixed areas
    if(fixed.length){
      page1 += `<div class="dept-block"><div class="dept-label">Fixed Positions</div><div class="areas-row">`;
      fixed.forEach(a=>{
        const members = staffInArea(a.id).filter(s=>s.active!==false);
        page1 += `<div class="area-card"><div class="area-name">${escapeHtml(a.name)}</div>`;
        if(!members.length) page1 += `<div class="empty">—</div>`;
        members.forEach(s=>{ page1 += `<div class="person-row">${escapeHtml(s.name)}${showTimes?'<span class="person-meta">'+escapeHtml(s.shiftHours||'')+'</span>':''}</div>`; });
        page1 += `</div>`;
      });
      page1 += `</div></div>`;
    }
    page1 += `</div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 2 — Staff Report: Hours, Callouts, Leaves, Rotation health
    // ─────────────────────────────────────────────────────────────────────
    const reportStaff = state.staff
      .filter(s=>s.active!==false)
      .sort((a,b)=>a.name.localeCompare(b.name));

    // ── Extra metrics ──
    function avgPositionsPerRotation(s){
      const h = state.history.filter(x=>x.assignments&&x.assignments[s.id]);
      if(h.length<2) return null;
      const unique = new Set(h.map(x=>x.assignments[s.id]));
      return (unique.size/h.length).toFixed(2);
    }
    function areasProficiency(s){
      const prof = state.proficiency?.[s.id];
      if(!prof) return null;
      const entries = Object.entries(prof);
      if(!entries.length) return null;
      const avg = entries.reduce((sum,[,v])=>sum+(v.rating||0),0)/entries.length;
      return avg.toFixed(1);
    }
    function topAreas(s){
      const h = state.history.filter(x=>x.assignments&&x.assignments[s.id]);
      const cnt = {};
      h.forEach(x=>{ const a=x.assignments[s.id]; cnt[a]=(cnt[a]||0)+1; });
      return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([aid,n])=>`${getAreaById(aid)?.name||aid}(${n})`).join(', ');
    }
    function latestNote(s){
      // Supervisor note from rotation notes
      const periods = Object.keys(state.rotationNotes||{}).sort().reverse();
      for(const p of periods){
        const note = state.rotationNotes[p];
        if(note && note.toLowerCase().includes(s.name.split(' ')[0].toLowerCase()))
          return note.slice(0,60)+'…';
      }
      return '';
    }

    let page2 = `<div class="page page-break">
      <h1>Staff Performance Report</h1>
      <div class="subtitle">Period: ${period} &nbsp;·&nbsp; Generated ${today} &nbsp;·&nbsp; ${reportStaff.length} staff members</div>
      <table class="report-table">
        <thead><tr>
          <th style="min-width:140px">Name &amp; Role</th>
          ${showAccom?'<th style="width:60px;text-align:center">Accom.</th>':''}
          ${showSeniority?'<th style="width:58px;text-align:center" title="Years of service">Seniority</th>':''}
          <th style="min-width:100px">Current Area</th>
          ${showTimes?'<th style="width:72px">Shift</th>':''}
          <th style="width:52px;text-align:center" title="Total rotation periods worked">Rots.</th>
          <th style="width:58px;text-align:center" title="Estimated hours from shift × rotations">Est. Hrs</th>
          <th style="width:48px;text-align:center" title="Total recorded call-outs">Callouts</th>
          <th style="width:52px;text-align:center" title="Upcoming scheduled leaves">Leaves</th>
          <th style="width:52px;text-align:center" title="Avg. unique positions per rotation (higher = more flexible)">Flex.</th>
          <th style="width:52px;text-align:center" title="Average proficiency rating across all areas (1–5)">Prof.</th>
          <th style="width:62px;text-align:center" title="Should supervisor move them to a new area?">Needs Move</th>
          <th>Top Areas · Flags</th>
        </tr></thead><tbody>`;

    reportStaff.forEach(s=>{
      const areaId   = state.assignments[s.id];
      const area     = getAreaById(areaId);
      const rots     = rotationCount(s);
      const hrs      = totalHoursWorked(s);
      const cos      = calloutCount(s);
      const leaves   = scheduledLeaveCount(s);
      const move     = needsChange(s, areaId);
      const flex     = avgPositionsPerRotation(s);
      const prof     = areasProficiency(s);
      const best     = topAreas(s);
      const todayOut = !!state.callouts[s.id];
      const isCov    = !!(state.coverage?.[s.id]);
      const sched    = isScheduledOut(s.id, today);
      const flags    = [];
      if(todayOut && !sched) flags.push('⚡ Out today');
      const pendingReqs = (s.positionRequests||[]).filter(r=>(!r.status||r.status==='pending')).length;
      if(pendingReqs) flags.push(`📋 ${pendingReqs} request${pendingReqs>1?'s':''}`);
      if(s.lateStart) flags.push(`⏰ Late start: ${s.lateStart}`);
      if(sched) flags.push('📅 On leave');
      if(isCov) flags.push('↩ Covering');
      if(showAccom&&s.needsAccommodations) flags.push('♿ Accommodations');
      if(cos > 4) flags.push('⚠ High callouts');
      if(move) flags.push('🔄 Repeat area');

      const cosStyle = cos>4?'color:#c0392b;font-weight:700':cos>2?'color:#e67e22;font-weight:600':'';

      const senYrs = seniorityYears(s);
      const senLbl = seniorityLabel(s);
      const veteran = isVeteran(s); const senior = isSenior(s);
      page2 += `<tr class="${todayOut?'out-row':''}">
        <td>
          <b>${s.isTeamLead?'★ ':''}${escapeHtml(s.name)}</b>
          ${veteran?'<br><small style="color:#7d5a00">🏅 Veteran</small>':senior?'<br><small style="color:#555">⭐ Senior</small>':''}
          ${showAccom&&s.needsAccommodations?'<br><small style="color:#555">♿ Accommodations</small>':''}
          ${s.lateStart?'<br><small style="color:#D97706">⏰ Late: '+escapeHtml(s.lateStart)+'</small>':''}
        </td>
        ${showSeniority?`<td style="text-align:center;font-weight:${veteran?'700':'400'};color:${veteran?'#7d5a00':senior?'#555':'#bbb'}">${senLbl||'—'}</td>`:''}
        <td>${area?escapeHtml(area.name):'<em style="color:#aaa">Unassigned</em>'}<br><small style="color:#888">${escapeHtml(s.department||'')}</small></td>
        ${showTimes?`<td style="font-size:10pt">${escapeHtml(s.shiftHours||'—')}</td>`:''}
        <td style="text-align:center">${rots||'—'}</td>
        <td style="text-align:center">${hrs?hrs+'h':'—'}</td>
        <td style="text-align:center;${cosStyle}">${cos||'—'}</td>
        <td style="text-align:center">${leaves||'—'}</td>
        <td style="text-align:center;color:${flex&&parseFloat(flex)<0.5?'#e67e22':'#555'}">${flex||'—'}</td>
        <td style="text-align:center;color:${prof&&parseFloat(prof)>=4?'#27ae60':prof&&parseFloat(prof)<2.5?'#c0392b':'#555'}">${prof||'—'}</td>
        <td style="text-align:center">${move
          ?'<span style="color:#e67e22;font-weight:700">⚠ Yes</span>'
          :'<span style="color:#27ae60">✓</span>'}</td>
        <td style="font-size:10pt">${best?'<span style="color:#555">'+escapeHtml(best)+'</span>':'—'}${flags.length?'<br><small>'+flags.join(' · ')+'</small>':''}</td>
      </tr>`;
    });
    page2 += `</tbody></table></div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 3 — Certifications & Call-outs
    // ─────────────────────────────────────────────────────────────────────
    let page3 = `<div class="page page-break">
      <h1>Certifications &amp; Absences</h1>
      <div class="subtitle">Period: ${period}</div>`;

    if(langStaff.length){
      page3 += `<div class="to-section"><div class="to-section-head">Language speakers &amp; certified staff (${langStaff.length})</div>
        <table><thead><tr><th style="width:180px">Name</th><th style="width:100px">Area</th><th style="width:110px">Shift</th><th>Certifications</th></tr></thead><tbody>`;
      langStaff.sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{
        const areaName = getAreaById(state.assignments[s.id])?.name||'—';
        const ln = langNames(s);
        const certs = [];
        if(ln) certs.push('🌐 '+ln);
        if(s.counterCert) certs.push('✓ CA Cert');
        if(showAccom&&s.needsAccommodations) certs.push('♿ Accommodations');
        page3 += `<tr><td><b>${s.isTeamLead?'★ ':''}${escapeHtml(s.name)}</b></td><td>${escapeHtml(areaName)}</td><td>${escapeHtml(s.shiftHours||'—')}</td><td>${certs.join('  ·  ')}</td></tr>`;
      });
      page3 += `</tbody></table></div>`;
    }

    if(calledOut.length){
      page3 += `<div class="to-section" style="margin-top:20px;"><div class="to-section-head">Called out today (${calledOut.length})</div>`;
      calledOut.forEach(s=>{
        const area = getAreaById(state.assignments[s.id]);
        const sched = isScheduledOut(s.id,today);
        const rec = ((state.timeOff||{})[s.id]||[]).find(r=>today>=r.startDate&&today<=r.endDate);
        const covName = rec?.coverageStaffId ? getStaffById(rec.coverageStaffId)?.name : null;
        page3 += `<div class="to-card">
          <div class="to-name">${escapeHtml(s.name)}</div>
          <div class="to-area">${area?escapeHtml(area.name):'Unassigned'} · ${escapeHtml(s.shiftHours||'')}</div>
          <div class="to-nocov">${sched?'📅 Scheduled leave':'Manual callout'}${covName?' · Coverage: '+escapeHtml(covName):'  ⚠ No coverage'}</div>
        </div>`;
      });
      page3 += `</div>`;
    }
    page3 += `</div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 4 — Scheduled Time Off (upcoming)
    // ─────────────────────────────────────────────────────────────────────
    const allOff = [];
    state.staff.forEach(s=>{
      ((state.timeOff||{})[s.id]||[]).forEach(r=>{
        if(r.endDate>=today){
          const area = getAreaById(state.assignments[s.id]);
          const cov  = r.coverageStaffId ? getStaffById(r.coverageStaffId) : null;
          allOff.push({...r, staff:s, area, cov});
        }
      });
    });
    allOff.sort((a,b)=>a.startDate.localeCompare(b.startDate));
    const upcoming = allOff.filter(r=>r.startDate>today);
    const active   = allOff.filter(r=>r.startDate<=today&&r.endDate>=today);

    let page4 = `<div class="page">
      <h1>Scheduled Time Off</h1>
      <div class="subtitle">Period: ${period}</div>`;

    if(active.length){
      page4 += `<div class="to-section"><div class="to-section-head">Out today (${active.length})</div>`;
      active.forEach(r=>{
        page4 += `<div class="to-card ${r.cov?'covered':'needs-cov'}">
          <div class="to-name">${escapeHtml(r.staff.name)}</div>
          <div class="to-area">${r.area?escapeHtml(r.area.name):'—'} · ${friendlyD(r.startDate)} – ${friendlyD(r.endDate)}</div>
          <div class="to-nocov">${r.cov?'✓ Coverage: '+escapeHtml(r.cov.name):'⚠ No coverage assigned'}</div>
        </div>`;
      });
      page4 += `</div>`;
    }
    if(upcoming.length){
      page4 += `<div class="to-section" style="margin-top:20px;"><div class="to-section-head">Upcoming (${upcoming.length})</div>
        <table><thead><tr><th style="width:160px">Name</th><th style="width:110px">Area</th><th>Dates</th><th>Label</th><th>Coverage</th></tr></thead><tbody>`;
      upcoming.forEach(r=>{
        page4 += `<tr>
          <td><b>${escapeHtml(r.staff.name)}</b></td>
          <td>${r.area?escapeHtml(r.area.name):'—'}</td>
          <td>${friendlyD(r.startDate)}${r.startDate!==r.endDate?' – '+friendlyD(r.endDate):''}</td>
          <td>${escapeHtml(r.label||'—')}</td>
          <td>${r.cov?escapeHtml(r.cov.name):'<span style="color:#e67e22">⚠ Needed</span>'}</td>
        </tr>`;
      });
      page4 += `</tbody></table></div>`;
    }
    if(!active.length&&!upcoming.length){
      page4 += `<div style="color:#aaa;font-style:italic;padding:16px 0;">No scheduled time off recorded.</div>`;
    }
    page4 += `</div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 5 — Daily Activity Log (reassignments per day)
    // ─────────────────────────────────────────────────────────────────────
    const allLog = (state.dailyLog||[]).slice().sort((a,b)=>b.ts.localeCompare(a.ts));
    
    // Group by date
    const logByDate = {};
    allLog.forEach(e=>{
      const d = e.date||e.ts.slice(0,10);
      if(!logByDate[d]) logByDate[d]=[];
      logByDate[d].push(e);
    });
    const logDates = Object.keys(logByDate).sort().reverse();

    const typeLabels = {
      move:     '↗ Move',
      swap:     '⇄ Swap',
      callout:  '⚡ Callout',
      return:   '↩ Return',
      coverage: '🛡 Coverage',
      'time-off':'📅 Time Off',
    };
    const typeColors = {
      move:    '#2a85ff',
      swap:    '#8e59ff',
      callout: '#ff6a55',
      return:  '#83bf6e',
      coverage:'#f59e0b',
      'time-off':'#6b7280',
    };

    let page5 = `<div class="page page-break">
      <h1>Daily Activity Log</h1>
      <div class="subtitle">All reassignments, callouts &amp; coverage events — most recent first</div>`;

    if(!logDates.length){
      page5 += `<div style="color:#aaa;font-style:italic;padding:20pt 0;">No activity recorded yet. Events are logged automatically when you move, swap, call out, or assign coverage on the board.</div>`;
    } else {
      logDates.forEach(date=>{
        const events = logByDate[date];
        const moves    = events.filter(e=>e.type==='move').length;
        const swaps    = events.filter(e=>e.type==='swap').length;
        const callouts = events.filter(e=>e.type==='callout').length;
        const covs     = events.filter(e=>e.type==='coverage').length;
        const friendly = (()=>{
          try{const[y,m,d]=date.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch(e){return date;}
        })();
        page5 += `
        <div class="day-block">
          <div class="day-header">
            <span class="day-date">${friendly}</span>
            <span class="day-summary">${moves?moves+' move'+(moves>1?'s':''):''} ${swaps?swaps+' swap'+(swaps>1?'s':''):''} ${callouts?callouts+' callout'+(callouts>1?'s':''):''} ${covs?covs+' coverage':''}
            </span>
          </div>
          <table class="log-table">
            <thead><tr><th style="width:55pt">Time</th><th style="width:70pt">Type</th><th style="width:150pt">Staff</th><th style="width:110pt">From</th><th style="width:110pt">To</th><th>Note</th></tr></thead>
            <tbody>`;
        events.forEach(e=>{
          const time = e.ts ? new Date(e.ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
          const staff = getStaffById(e.staffId)?.name || e.staffId || '—';
          const from  = e.fromArea ? (getAreaById(e.fromArea)?.name||e.fromArea) : '—';
          const to    = e.toArea   ? (getAreaById(e.toArea)?.name||e.toArea)     : '—';
          const color = typeColors[e.type]||'#555';
          const label = typeLabels[e.type]||e.type;
          page5 += `<tr>
            <td style="font-size:9pt;color:#777">${time}</td>
            <td><span style="font-size:9pt;font-weight:700;color:${color};background:${color}18;padding:1pt 5pt;border-radius:3pt">${label}</span></td>
            <td style="font-weight:600">${escapeHtml(staff)}</td>
            <td style="color:#777;font-size:10pt">${escapeHtml(from)}</td>
            <td style="font-size:10pt">${escapeHtml(to)}</td>
            <td style="font-size:9pt;color:#888">${escapeHtml(e.note||'')}</td>
          </tr>`;
        });
        page5 += `</tbody></table></div>`;
      });
    }
    page5 += `</div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 6 — Supervisor Summary
    // ─────────────────────────────────────────────────────────────────────
    const supStaff = sup => state.staff.filter(s=>s.active!==false&&s.supervisorId===sup.id);
    const supOut   = sup => supStaff(sup).filter(s=>!!state.callouts[s.id]);
    const supLeads = sup => supStaff(sup).filter(s=>s.isTeamLead);
    const supAccom = sup => supStaff(sup).filter(s=>s.needsAccommodations);
    const supLang  = sup => supStaff(sup).filter(s=>(s.languageCerts||[]).length>0);

    let page6 = `<div class="page page-break">
      <h1>Supervisor Summary</h1>
      <div class="subtitle">Period: ${period}</div>
      <table class="report-table">
        <thead><tr>
          <th>Supervisor</th>
          <th style="width:55px;text-align:center">Staff</th>
          <th style="width:55px;text-align:center">Out today</th>
          <th style="width:55px;text-align:center">Team Leads</th>
          ${showAccom?'<th style="width:55px;text-align:center">Accom.</th>':''}
          <th style="width:55px;text-align:center">Multilingual</th>
          <th style="width:55px;text-align:center">Pending Req.</th>
          <th>Staff</th>
        </tr></thead><tbody>`;

    state.supervisors.forEach(sup=>{
      const staff = supStaff(sup);
      if(!staff.length) return;
      const out    = supOut(sup).length;
      const leads  = supLeads(sup).length;
      const accom  = supAccom(sup).length;
      const langs  = supLang(sup).length;
      const reqs   = staff.reduce((n,s)=>n+((s.positionRequests||[]).filter(r=>!r.status||r.status==='pending').length),0);
      page6 += `<tr class="${out>0?'out-row':''}">
        <td><b>${escapeHtml(sup.name)}</b></td>
        <td style="text-align:center">${staff.length}</td>
        <td style="text-align:center;color:${out>0?'#c0392b':'#27ae60'};font-weight:${out>0?'700':'400'}">${out||'—'}</td>
        <td style="text-align:center">${leads||'—'}</td>
        ${showAccom?`<td style="text-align:center">${accom||'—'}</td>`:''}
        <td style="text-align:center">${langs||'—'}</td>
        <td style="text-align:center;${reqs>0?'color:#e67e22;font-weight:700':''}">${reqs||'—'}</td>
        <td style="font-size:9pt;color:#555">${staff.map(s=>s.name.split(' ')[0]).join(', ')}</td>
      </tr>`;
    });
    page6 += `</tbody></table></div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 7 — Area Utilization & Coverage Gaps
    // ─────────────────────────────────────────────────────────────────────
    const areaFill = a => {
      const placed = staffInArea(a.id).filter(s=>s.active!==false&&!state.callouts[s.id]).length;
      const cap    = a.capacity||1;
      return {placed, cap, pct: Math.round((placed/cap)*100), gap: Math.max(0, cap-placed)};
    };
    const langCover = a => {
      const members = staffInArea(a.id).filter(s=>s.active!==false&&!state.callouts[s.id]);
      const langs = [...new Set(members.flatMap(s=>(s.languageCerts||[]).map(id=>state.languages.find(l=>l.id===id)?.name).filter(Boolean)))];
      return langs;
    };
    const histFill = a => {
      if(!state.history.length) return null;
      const fills = state.history.map(h=>Object.values(h.assignments||{}).filter(aid=>aid===a.id).length);
      return fills.length ? Math.round(fills.reduce((s,n)=>s+n,0)/fills.length*10)/10 : null;
    };
    const understaffedCount = a => {
      return (state.fillHistory||[]).filter(h=>{ const f=h.areas?.[a.id]; return f&&f.capacity>0&&f.placed<f.capacity; }).length;
    };
    const understaffedPct = a => {
      const total=(state.fillHistory||[]).filter(h=>h.areas?.[a.id]).length;
      if(!total) return null;
      const under=understaffedCount(a);
      return Math.round(under/total*100);
    };

    let page7 = `<div class="page page-break">
      <h1>Area Utilization</h1>
      <div class="subtitle">Period: ${period} — Today's staffing vs capacity, with history</div>
      <table class="report-table">
        <thead><tr>
          <th>Area</th>
          <th style="width:70px">Dept</th>
          <th style="width:50px;text-align:center">Placed</th>
          <th style="width:50px;text-align:center">Cap.</th>
          <th style="width:55px;text-align:center">Fill %</th>
          <th style="width:55px;text-align:center">Gap</th>
          <th style="width:60px;text-align:center">Avg hist.</th>
          <th style="width:65px;text-align:center" title="How often this area was below capacity across all rotations">Understaffed</th>
          <th>Languages covered</th>
          <th>Notes</th>
        </tr></thead><tbody>`;

    state.areas.filter(a=>!a.fixed).forEach(a=>{
      const {placed,cap,pct,gap} = areaFill(a);
      const avg  = histFill(a);
      const langs = langCover(a);
      const flags = [];
      if(pct < 60) flags.push('⚠ Under-staffed');
      if(pct === 0) flags.push('🚨 Empty');
      const dept = state.staff.find(s=>state.assignments[s.id]===a.id)?.department||'—';
      page7 += `<tr>
        <td><b>${escapeHtml(a.name)}</b></td>
        <td style="font-size:9pt;color:#555">${escapeHtml(dept)}</td>
        <td style="text-align:center">${placed}</td>
        <td style="text-align:center">${cap}</td>
        <td style="text-align:center;font-weight:700;color:${pct>=80?'#27ae60':pct>=50?'#e67e22':'#c0392b'}">${pct}%</td>
        <td style="text-align:center;color:${gap>0?'#c0392b':'#27ae60'}">${gap>0?gap:'✓'}</td>
        <td style="text-align:center;color:#777">${avg!==null?avg:'—'}</td>
        <td style="text-align:center;font-weight:${understaffedPct(a)>30?'700':'400'};color:${understaffedPct(a)>50?'#c0392b':understaffedPct(a)>20?'#e67e22':'#27ae60'}">${understaffedPct(a)!==null?(understaffedCount(a)+'× ('+understaffedPct(a)+'%)'):'—'}</td>
        <td style="font-size:9pt">${langs.length?langs.join(', '):'<span style="color:#aaa">None</span>'}</td>
        <td style="font-size:9pt;color:#c0392b">${flags.join(' ')}</td>
      </tr>`;
    });
    page7 += `</tbody></table>`;

    // Language coverage gaps
    const areasWithNoLang = state.areas.filter(a=>!a.fixed&&langCover(a).length===0&&staffInArea(a.id).filter(s=>s.active!==false).length>0);
    if(areasWithNoLang.length){
      page7 += `<div style="margin-top:16pt;padding:8pt;background:#fff8f8;border:1pt solid #fde;border-radius:4pt;">
        <b>⚠ Areas with no language coverage today:</b>
        ${areasWithNoLang.map(a=>escapeHtml(a.name)).join(' · ')}
      </div>`;
    }
    page7 += `</div>`;

    // ─────────────────────────────────────────────────────────────────────
    // PAGE 8 — Rotation Notes & Proficiency Breakdown
    // ─────────────────────────────────────────────────────────────────────
    const rNotes = Object.entries(state.rotationNotes||{}).sort((a,b)=>b[0].localeCompare(a[0]));
    const topProf = (staffId) => {
      const p = state.proficiency?.[staffId];
      if(!p) return [];
      return Object.entries(p).sort((a,b)=>(b[1].rating||0)-(a[1].rating||0)).slice(0,3)
        .map(([aid,v])=>({area:getAreaById(aid)?.name||aid, rating:v.rating||0}));
    };
    const blockedPairs = (state.blocks||[]).map(b=>({
      a: getStaffById(b.staffA)?.name||b.staffA,
      b: getStaffById(b.staffB)?.name||b.staffB,
      reason: b.reason||'',
    }));

    let page8 = `<div class="page">
      <h1>Notes, Proficiency &amp; Constraints</h1>
      <div class="subtitle">Period: ${period}</div>`;

    if(rNotes.length){
      page8 += `<div class="to-section"><div class="to-section-head">Rotation notes (${rNotes.length})</div>
        <table><thead><tr><th style="width:100pt">Period</th><th>Note</th></tr></thead><tbody>`;
      rNotes.slice(0,20).forEach(([p,note])=>{
        page8 += `<tr><td style="font-weight:600">${escapeHtml(p)}</td><td>${escapeHtml(note)}</td></tr>`;
      });
      page8 += `</tbody></table></div>`;
    }

    if(blockedPairs.length){
      page8 += `<div class="to-section" style="margin-top:16pt"><div class="to-section-head">Blocked pairs (${blockedPairs.length})</div>
        <table><thead><tr><th>Staff A</th><th>Staff B</th><th>Reason</th></tr></thead><tbody>`;
      blockedPairs.forEach(b=>{
        page8 += `<tr><td>${escapeHtml(b.a)}</td><td>${escapeHtml(b.b)}</td><td style="color:#888">${escapeHtml(b.reason)}</td></tr>`;
      });
      page8 += `</tbody></table></div>`;
    }

    // Top proficiency by area
    const profStaff = reportStaff.filter(s=>topProf(s.id).length>0);
    if(profStaff.length){
      page8 += `<div class="to-section" style="margin-top:16pt"><div class="to-section-head">Top area proficiency ratings</div>
        <table><thead><tr><th style="width:160pt">Name</th><th>Top rated areas</th></tr></thead><tbody>`;
      profStaff.slice(0,20).forEach(s=>{
        const areas = topProf(s.id).map(p=>`${escapeHtml(p.area)} (${p.rating}/5)`).join('  ·  ');
        page8 += `<tr><td><b>${escapeHtml(s.name)}</b></td><td style="font-size:10pt">${areas}</td></tr>`;
      });
      page8 += `</tbody></table></div>`;
    }

    // Pending position requests
    const pendingReqs = reportStaff.flatMap(s=>
      (s.positionRequests||[]).filter(r=>!r.status||r.status==='pending').map(r=>({...r,staff:s}))
    ).sort((a,b)=>a.date.localeCompare(b.date));
    if(pendingReqs.length){
      page8 += `<div class="to-section" style="margin-top:16pt"><div class="to-section-head">Pending position requests (${pendingReqs.length})</div>
        <table><thead><tr><th style="width:150pt">Name</th><th style="width:90pt">Supervisor</th><th>From → To</th><th>Reason</th><th style="width:70pt">Submitted</th></tr></thead><tbody>`;
      pendingReqs.forEach(r=>{
        const sup = getSupervisorById(r.staff.supervisorId);
        page8 += `<tr>
          <td><b>${escapeHtml(r.staff.name)}</b></td>
          <td>${escapeHtml(sup?.name||'—')}</td>
          <td>${escapeHtml(getAreaById(r.fromArea)?.name||'Current')} → ${escapeHtml(getAreaById(r.toArea)?.name||'?')}</td>
          <td style="font-size:9pt;color:#555">${escapeHtml(r.reason||'')}</td>
          <td style="font-size:9pt;color:#777">${r.date}</td>
        </tr>`;
      });
      page8 += `</tbody></table></div>`;
    }

    // Team lead coverage events
    const tlCovEvents = Object.entries(state.teamLeadCoverage||{}).map(([aId,ev])=>({
      area: getAreaById(aId)?.name||aId,
      outLead: getStaffById(ev.outLeadId)?.name||ev.outLeadId,
      coverLead: ev.coverLeadId ? getStaffById(ev.coverLeadId)?.name : null,
      date: ev.date, status: ev.status
    }));
    if(tlCovEvents.length){
      page8 += '<div class="to-section" style="margin-top:16pt"><div class="to-section-head">Team lead coverage events ('+tlCovEvents.length+')</div>'
        +'<table><thead><tr><th style="width:80pt">Date</th><th style="width:100pt">Area</th><th>Out</th><th>Covering</th><th style="width:65pt">Status</th></tr></thead><tbody>';
      tlCovEvents.forEach(ev=>{
        page8 += '<tr><td>'+escapeHtml(ev.date||'')+'</td><td>'+escapeHtml(ev.area)+'</td><td>'+escapeHtml(ev.outLead)+'</td><td>'+(ev.coverLead?escapeHtml(ev.coverLead):'<span style="color:#c0392b">⚠ Unassigned</span>')+'</td><td>'+escapeHtml(ev.status||'pending')+'</td></tr>';
      });
      page8 += '</tbody></table></div>';
    }

    // Arrival log (late arrivals)
    const arrivalData=[];
    state.staff.forEach(s=>{ (s.arrivalLog||[]).filter(l=>l.date>=todayLabel().slice(0,7)).forEach(l=>arrivalData.push({...l,name:s.name})); });
    arrivalData.sort((a,b)=>b.date.localeCompare(a.date));
    if(arrivalData.length){
      const late=arrivalData.filter(l=>{ if(!l.scheduled||!l.actual) return false; const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;}; return toM(l.actual)-toM(l.scheduled)>5; });
      page8 += '<div class="to-section" style="margin-top:16pt"><div class="to-section-head">Arrival log — '+arrivalData.length+' records, '+late.length+' late (>5 min)</div>'
        +'<table><thead><tr><th style="width:150pt">Name</th><th style="width:80pt">Date</th><th style="width:70pt">Scheduled</th><th style="width:70pt">Actual</th><th style="width:70pt">Diff</th></tr></thead><tbody>';
      arrivalData.slice(0,30).forEach(l=>{
        const toM=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
        const diff=toM(l.actual)!=null&&toM(l.scheduled)!=null?toM(l.actual)-toM(l.scheduled):null;
        const diffStr=diff!=null?(diff>0?'<span style="color:#c0392b">+'+diff+' min</span>':diff<-5?'<span style="color:#27ae60">'+diff+' min</span>':diff+' min'):'—';
        page8 += '<tr><td><b>'+escapeHtml(l.name)+'</b></td><td>'+escapeHtml(l.date)+'</td><td>'+escapeHtml(l.scheduled||'—')+'</td><td>'+escapeHtml(l.actual||'—')+'</td><td>'+diffStr+'</td></tr>';
      });
      page8 += '</tbody></table></div>';
    }

    if(!rNotes.length&&!blockedPairs.length&&!profStaff.length&&!pendingReqs.length&&!tlCovEvents.length&&!arrivalData.length){
      page8 += '<div style="color:#aaa;font-style:italic;padding:20pt 0;">No notes, constraints or proficiency data recorded yet.</div>';
    }
    page8 += '</div>';

    // ─────────────────────────────────────────────────────────────────────
    // Compile and download
    // ─────────────────────────────────────────────────────────────────────
    const reportCSS = `
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12pt;color:#111;background:#fff;}
      .page{padding:24pt 28pt;min-height:100vh;}
      .page-break{page-break-after:always;}
      .report-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16pt;border-bottom:2pt solid #111;padding-bottom:8pt;}
      h1{font-size:20pt;font-weight:700;color:#111;margin-bottom:4pt;}
      .subtitle{font-size:10pt;color:#555;margin-bottom:12pt;}
      .report-stats-row{display:flex;gap:12pt;align-items:center;}
      .report-stat{font-size:10pt;font-weight:600;background:#f4f4f4;padding:3pt 8pt;border-radius:4pt;}
      .callout-stat{background:#fff0f0;color:#c0392b;}
      .dept-block{margin-bottom:14pt;}
      .dept-label{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:6pt;padding-left:6pt;border-left:3pt solid #2a85ff;}
      .areas-row{display:flex;flex-wrap:wrap;gap:8pt;}
      .area-card{border:1pt solid #ddd;border-radius:6pt;padding:8pt;min-width:130pt;max-width:170pt;flex:1 1 130pt;}
      .area-name{display:flex;justify-content:space-between;font-size:10pt;font-weight:700;margin-bottom:4pt;border-bottom:1pt solid #eee;padding-bottom:3pt;}
      .area-cap{font-size:9pt;font-weight:400;color:#777;}
      .person-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4pt;font-size:9.5pt;padding:1.5pt 0;border-bottom:0.5pt solid #f0f0f0;}
      .person-row:last-child{border-bottom:none;}
      .person-row.lead{font-weight:700;}
      .person-row.out{opacity:.5;text-decoration:line-through;}
      .person-meta{font-size:8.5pt;color:#777;margin-left:auto;}
      .badge{font-size:8pt;padding:1pt 4pt;border-radius:3pt;font-weight:600;}
      .badge-warn{background:#fff3cd;color:#856404;}
      .badge-ok{background:#d1f2d3;color:#155724;}
      .badge-out{background:#fde;color:#c0392b;}
      .badge-cov{background:#fff3cd;color:#7d5a00;}
      .empty{font-size:9pt;color:#bbb;font-style:italic;}
      .report-table{width:100%;border-collapse:collapse;font-size:9pt;margin-top:10pt;}
      .report-table th{background:#f4f4f4;text-align:left;padding:5pt 6pt;border:1pt solid #ddd;font-size:8.5pt;font-weight:700;}
      .report-table td{padding:4pt 6pt;border:1pt solid #eee;vertical-align:top;}
      .report-table tr:nth-child(even) td{background:#fafafa;}
      .report-table .out-row td{background:#fff8f8;color:#888;}
      table{width:100%;border-collapse:collapse;font-size:10pt;margin-top:6pt;}
      thead th{background:#f4f4f4;text-align:left;padding:5pt;border:1pt solid #ddd;font-size:9pt;}
      tbody td{padding:4pt 5pt;border:1pt solid #eee;}
      .to-section{margin-bottom:14pt;}
      .to-section-head{font-size:10pt;font-weight:700;border-bottom:1pt solid #ddd;padding-bottom:4pt;margin-bottom:8pt;color:#111;}
      .to-card{border:1pt solid #ddd;border-radius:5pt;padding:7pt 10pt;margin-bottom:6pt;display:flex;flex-wrap:wrap;gap:6pt;align-items:center;}
      .to-card.covered{border-color:#83bf6e;background:#f6fff6;}
      .to-card.needs-cov{border-color:#ff6a55;background:#fff8f8;}
      .to-name{font-weight:700;font-size:11pt;}
      .to-area{font-size:9.5pt;color:#555;}
      .to-nocov{font-size:9.5pt;margin-left:auto;}
      @media print{.page-break{page-break-after:always;}}
      .day-block{margin-bottom:16pt;border:1pt solid #e0e0e0;border-radius:6pt;overflow:hidden;}
      .day-header{display:flex;justify-content:space-between;align-items:baseline;background:#f8f8f8;padding:6pt 10pt;border-bottom:1pt solid #e0e0e0;}
      .day-date{font-size:11pt;font-weight:700;color:#111;}
      .day-summary{font-size:9pt;color:#777;}
      .log-table{width:100%;border-collapse:collapse;font-size:10pt;}
      .log-table th{background:#fafafa;text-align:left;padding:4pt 6pt;border-bottom:1pt solid #eee;font-size:8.5pt;font-weight:700;color:#555;}
      .log-table td{padding:3.5pt 6pt;border-bottom:0.5pt solid #f0f0f0;vertical-align:middle;}
      .log-table tr:last-child td{border-bottom:none;}
    `;

    // Build only selected sections
    const parts = [];
    if(sections.board)        parts.push(page1);
    if(sections.staff)        parts.push(page2);
    if(sections.certs)        parts.push(page3);
    if(sections.timeoff)      parts.push(page4);
    if(sections.activity)     parts.push(page5);
    if(sections.supervisors)  parts.push(page6);
    if(sections.utilization)  parts.push(page7);
    if(sections.notes)        parts.push(page8);
    return {page1,page2,page3,page4,page5,page6,page7,page8, reportCSS, parts};
  };
  // ── swap mode ──
  // Tap any chip while swap mode active → complete the swap immediately
  document.querySelectorAll('.chip[data-staff-id]').forEach(chip=>{
    chip.addEventListener('click', e=>{
      if(!swapMode||swapMode.staffId===chip.dataset.staffId) return;
      if(e.target.closest('[data-chip-menu]')||e.target.closest('.chip-quick-out')||e.target.closest('.cia-btn')) return;
      e.stopPropagation();
      doSwap(swapMode.staffId, chip.dataset.staffId);
    });
  });

  document.querySelectorAll('[data-do-swap]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    if(swapMode) doSwap(swapMode.staffId, btn.dataset.doSwap);
  }));
  on('btn-cancel-swap', ()=>{ swapMode=null; render(); });
  on('btn-open-callout-dash', ()=>openModal({type:'callout-dash'}));
  on('btn-add-area', ()=>openModal({type:'area-editor'}));
  on('btn-add-area-2', ()=>openModal({type:'area-editor'}));
  on('btn-mark-callout', ()=>openModal({type:'mark-callout'}));

  // --- tab bar (view switcher) ---
  on('btn-view-board',       ()=>{ viewMode='board';       navDrawerOpen=false; render(); });
  on('btn-view-overview',    ()=>{ viewMode='overview';    navDrawerOpen=false; render(); });
  // roster view now accessed from nav drawer only
  on('btn-view-supervisors', ()=>{ viewMode='supervisors'; navDrawerOpen=false; render(); });
  on('btn-view-breaks',      ()=>{ viewMode='breaks';      navDrawerOpen=false; render(); });
  on('btn-view-timeoff',     ()=>{ viewMode='timeoff';     navDrawerOpen=false; render(); });

  // ── Time Off view events ──
  if(viewMode==='timeoff'){
    // Time-off filter tabs
    document.querySelectorAll('[data-to-filter]').forEach(btn=>btn.addEventListener('click', ()=>{
      timeOffFilter = btn.dataset.toFilter;
      render();
    }));
    on('btn-to-add', ()=>openModal({type:'time-off-manager', pickStaff:true}));

    on('btn-cal-prev', ()=>{ timeOffMonth=document.getElementById('cal-prev-month')?.value||null; render(); });
    on('btn-cal-next', ()=>{ timeOffMonth=document.getElementById('cal-next-month')?.value||null; render(); });
    on('btn-cal-today',()=>{ timeOffMonth=null; render(); });

    // best-fit suggestion card clicks
    document.querySelectorAll('.to-sug-card').forEach(btn=>btn.addEventListener('click',()=>{
      const sid=btn.dataset.toAssignStaff, rid=btn.dataset.toAssignId, covId=btn.dataset.toAssignCov;
      if(!sid||!rid||!covId) return;
      applyTimeOffCoverage(sid, rid, covId);
      render();
    }));

    // "Others…" dropdown
    document.querySelectorAll('.to-sug-more').forEach(sel=>sel.addEventListener('change',()=>{
      const sid=sel.dataset.toAssignStaff, rid=sel.dataset.toAssignId, covId=sel.value;
      if(!covId) return;
      applyTimeOffCoverage(sid, rid, covId);
      render();
    }));

    // remove coverage
    document.querySelectorAll('.to-remove-cov').forEach(btn=>btn.addEventListener('click',()=>{
      const rid=btn.dataset.toRemoveCov, sid=btn.dataset.toStaff;
      removeTimeOffCoverage(sid, rid);
      render();
    }));

    // edit / delete from list
    document.querySelectorAll('[data-to-edit-staff]').forEach(el=>el.addEventListener('click',()=>{
      openModal({type:'time-off-manager', staffId:el.dataset.toEditStaff, editId:el.dataset.toEditId,
                 _returnModal:{type:'noop'} });
    }));
    document.querySelectorAll('[data-to-delete-staff]').forEach(el=>el.addEventListener('click', async ()=>{
      const sid=el.dataset.toDeleteStaff, rid=el.dataset.toDeleteId;
      const sync = await syncCrudWrite(()=>window.RC.deleteTimeOff({timeOffId:rid}));
      if(state.timeOff[sid]) state.timeOff[sid]=state.timeOff[sid].filter(r=>r.id!==rid);
      saveState(); render();
      if(!sync.ok) showToast(`Removed here, but not saved to the database — ${sync.error?.message||'try again'}`, 'rust');
    }));
  }

  // --- nav drawer ---
  on('btn-open-nav',  ()=>{ navDrawerOpen=true;  render(); });
  on('nav-scrim',     ()=>{ navDrawerOpen=false; render(); });
  const closeNav = () => { navDrawerOpen=false; };
  on('nav-roster', ()=>{ viewMode='roster'; closeNav(); render(); });
  on('nav-manage-staff',        ()=>{ closeNav(); openModal({type:'staff-manager'}); });
  on('nav-import-staff',        ()=>{ closeNav(); openModal({type:'staff-import', step:'pick'}); });
  on('nav-manage-supervisors',  ()=>{ closeNav(); openModal({type:'supervisor-manager'}); });
  on('nav-org-diagram',         ()=>{ closeNav(); openModal({type:'org-diagram'}); });
  on('nav-manage-blocks',       ()=>{ closeNav(); openModal({type:'blocks-manager'}); });
  on('nav-manage-flows',        ()=>{ closeNav(); openModal({type:'flow-manager'}); });
  on('nav-history',             ()=>{ closeNav(); openModal({type:'history'}); });
  on('nav-my-evaluations',      ()=>{ closeNav(); openEvalQueue(); });
  on('nav-mark-callout',        ()=>{ closeNav(); openModal({type:'mark-callout'}); });
  on('nav-add-area',            ()=>{ closeNav(); openModal({type:'area-editor'}); });
  on('nav-reorder-depts',       ()=>{ closeNav(); openModal({type:'dept-reorder'}); });
  on('nav-manage-accounts',     ()=>{ closeNav(); openManageAccounts(); });
  on('nav-audit-log',           ()=>{ closeNav(); openAuditLog(); });
  on('nav-team-dashboard',      ()=>{ closeNav(); openTeamDashboard(); });
  on('nav-pending-evals',       ()=>{ closeNav(); openPendingEvals(); });
  on('nav-manage-shifts',       ()=>{ closeNav(); openModal({type:'shifts-manager'}); });
  on('nav-manage-lunch-times',  ()=>{ closeNav(); openModal({type:'lunch-times-manager'}); });
  on('nav-reset-areas',         ()=>{ closeNav(); openModal({type:'reset-confirm', kind:'areas', typed:''}); });
  on('nav-manage-languages',    ()=>{ closeNav(); openModal({type:'languages-manager'}); });
  on('nav-sign-out', async ()=>{
    closeNav();
    if(window.RC && typeof window.RC.unsubscribeFromBoardChanges==='function'){
      window.RC.unsubscribeFromBoardChanges();
    }
    if(window.RC && typeof window.RC.signOut==='function'){
      try{ await window.RC.signOut(); }catch(e){}
    }
    authState = { status:'signed-out', name:'', pin:'', error:'', account:null };
    state.loaded = false;
    render();
  });

  // --- breaks view filters ---
  if(viewMode==='breaks'){
    document.querySelectorAll('[data-toggle-area-filter]').forEach(b=>b.addEventListener('click', ()=>{
      const id = b.dataset.toggleAreaFilter;
      const idx = breaksFilter.areaIds.indexOf(id);
      if(idx===-1) breaksFilter.areaIds.push(id); else breaksFilter.areaIds.splice(idx,1);
      render();
    }));
    document.querySelectorAll('[data-toggle-break-filter]').forEach(b=>b.addEventListener('click', ()=>{
      const label = b.dataset.toggleBreakFilter;
      const idx = breaksFilter.breakLabels.indexOf(label);
      if(idx===-1) breaksFilter.breakLabels.push(label); else breaksFilter.breakLabels.splice(idx,1);
      render();
    }));
    document.querySelectorAll('[data-toggle-lunch-filter]').forEach(b=>b.addEventListener('click', ()=>{
      const label = b.dataset.toggleLunchFilter;
      const idx = breaksFilter.lunchLabels.indexOf(label);
      if(idx===-1) breaksFilter.lunchLabels.push(label); else breaksFilter.lunchLabels.splice(idx,1);
      render();
    }));
    on('btn-clear-area-filter', ()=>{ breaksFilter.areaIds=[]; render(); });
    on('btn-clear-time-filter', ()=>{ breaksFilter.breakLabels=[]; breaksFilter.lunchLabels=[]; render(); });
  }
  on('btn-add-supervisor', ()=>openModal({type:'supervisor-manager'}));
  on('btn-add-supervisor-2', ()=>openModal({type:'supervisor-manager'}));
  on('btn-org-diagram', ()=>openModal({type:'org-diagram'}));
  document.querySelectorAll('[data-edit-supervisor]').forEach(b=>b.addEventListener('click', ()=>{
    openModal({type:'supervisor-manager', editId:b.dataset.editSupervisor});
  }));
  document.querySelectorAll('[data-sup-select]').forEach(sel=>sel.addEventListener('change', ()=>{
    const s = getStaffById(sel.dataset.supSelect);
    s.supervisorId = sel.value || null;
    saveState();
    syncRosterStaffEdit(s, 'supervisor assignment');
    render();
  }));

  document.querySelectorAll('[data-edit-area]').forEach(b=>b.addEventListener('click', ()=>{
    openModal({type:'area-editor', editId:b.dataset.editArea});
  }));

  // --- modal generic close ---
  on('modal-close-x', closeModal);
  on('modal-cancel', closeModal);
  const backdrop = document.getElementById('modal-backdrop');
  if(backdrop){
    backdrop.addEventListener('mousedown', e=>{ if(e.target===backdrop) closeModal(); });
  }

  if(!activeModal) return;

  // --- team lead displacement warning modal ---
  if(activeModal.type==='team-lead-warning'){
    const returnTo = activeModal.returnTo;
    on('modal-move-anyway', ()=>{
      attemptPlace(activeModal.staffId, activeModal.targetAreaId, true);
      if(returnTo) openModal(returnTo); else closeModal();
    });
    on('modal-return-home', ()=>{
      if(returnTo){ openModal(returnTo); return; }
      const s = getStaffById(activeModal.staffId);
      attemptPlace(activeModal.staffId, s.homeAreaId, true);
      closeModal();
    });
  }

  // --- capacity hard stop modal (no override) ---
  if(activeModal.type==='capacity-full'){
    const areaId = activeModal.targetAreaId;
    const returnTo = activeModal.returnTo;
    on('modal-close-cap', ()=>{ if(returnTo) openModal(returnTo); else closeModal(); });
    on('modal-raise-capacity', ()=>{
      openModal({type:'area-editor', editId:areaId});
    });
  }

  // --- certification-missing block modal ---
  if(activeModal.type==='cert-block'){
    on('modal-close-cert', ()=>closeModal());
    on('modal-edit-cert-profile', ()=>{
      openModal({type:'staff-manager', editId:activeModal.staffId, staffTab:'rotation'});
    });
  }

  // --- placement conflict modal ---
  if(activeModal.type==='placement-conflict'){
    on('modal-place-anyway', ()=>{
      attemptPlace(activeModal.staffId, activeModal.targetAreaId, true);
      closeModal();
    });
    document.querySelectorAll('[data-pick-area]').forEach(el=>el.addEventListener('click', ()=>{
      attemptPlace(activeModal.staffId, el.dataset.pickArea, true); // already vetted as suggestion; place directly
      closeModal();
    }));
  }

  // --- staff manager modal ---
  // --- staff experience stats modal (read-only, except the team-lead lunch quick-editor below) ---
  if(activeModal.type==='staff-stats'){
    const staffId = activeModal.staffId;
    on('modal-close-stats', closeModal);
    on('modal-edit-from-stats', ()=>{
      openModal({type:'staff-manager', editId:staffId});
    });
    const lunchSel = document.getElementById('stats-lunch-input');
    if(lunchSel) lunchSel.addEventListener('change', async ()=>{
      const s = getStaffById(lunchSel.dataset.staffId);
      if(!s) return;
      const newLunch = lunchSel.value;
      // keep whatever break-start portion is already there — team leads
      // aren't editing shift hours, only the lunch half of the combined string
      const breakPart = (s.breakTimes||'').split('/')[0]?.trim() || '10:00';
      const breakTimes = newLunch ? `${breakPart} / ${newLunch}` : '';
      lunchSel.disabled = true;
      const sync = await syncCrudWrite(()=>window.RC.updateStaffBreakTime({
        staffId: s.id, breakTimesLabel: breakTimes, actingAccountId: authState.account.id, staffName: s.name,
      }));
      if(sync.ok){
        s.breakTimes = breakTimes;
        saveState();
        showToast('Lunch time updated — saved to database ✓', 'teal');
      } else {
        showToast(`Not saved to the database: ${sync.error?.message||'try again'}`, 'rust');
      }
      render();
    });
  }

  // ── Position request: approve / deny ──
  document.querySelectorAll('.pos-req-approve-btn').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    const s = getStaffById(btn.dataset.staffId);
    if(!s) return;
    const req = (s.positionRequests||[]).find(r=>r.date===btn.dataset.reqDate);
    if(!req) return;
    req.status='approved';
    // Move them to requested area
    if(req.toArea){
      const _fromArea = req.fromArea ? getAreaById(req.fromArea) : null;
      const _toArea = getAreaById(req.toArea);
      state.assignments[s.id]=req.toArea;
      logDailyEvent('move',s.id,req.fromArea,req.toArea,'Position request approved');
      syncBoardWrite(()=>window.RC.moveStaff({
        staffId:s.id, areaId:req.toArea, actingAccountId:authState.account.id,
        staffName:s.name, fromAreaName:_fromArea?.name, toAreaName:_toArea?.name,
      }), 'move');
    }
    saveState(); openModal({type:'staff-manager',editId:s.id,staffTab:'stats'}); render();
    showToast(`${s.name.split(' ')[0]}'s request approved`,'teal');
  }));

        const newStaff={id: sync.ok ? createdId : uid('staff'), name,tdisNumber:tdisNumberRaw,tags,department:dept,active:true,shiftHours,breakTimes,

          needsAccommodations,counterCert,hireDate,isSubcontractor,languageCerts:finalLangCerts,lateStart};
        state.staff.push(newStaff); state.assignments[newStaff.id]=null;
        saveState();
        showToast(sync.ok ? `${name} added — saved to database ✓` : `${name} added here, but not saved to the database — ${sync.error?.message||'try again'}`, sync.ok?'teal':'rust');
        closeModal();

      state.staff=state.staff.filter(s=>s.id!==id); delete state.assignments[id]; delete state.callouts[id];

      if(!sync.ok) showToast(`Removed here, but not saved to the database — ${sync.error?.message||'try again'}`, 'rust');
      openModal({type:'blocks-manager'});
    }));
  }

  // --- callout dashboard modal ---
  if(activeModal.type==='callout-dash'){
    // Remove a coverage assignment
    document.querySelectorAll('.cd-undo-btn').forEach(btn=>btn.addEventListener('click', ()=>{
      returnFromCoverage(btn.dataset.removeCover);

    }));

    document.querySelectorAll('[data-mark-in]').forEach(el=>el.addEventListener('click', ()=>{
      const _id = el.dataset.markIn;

      const allCovered = outIds.every(sid=>{

      saveState();

  // --- department reorder modal ---
  if(activeModal.type==='dept-reorder'){

    // helper: move dept at idx by delta (-1=up, +1=down), preserving fixed depts in place
    function moveDept(idx, delta){
      const fixedDepts = new Set(state.areas.filter(a=>a.fixed).map(a=>a.department));
      const reorderable = state.departments.filter(d=>!fixedDepts.has(d));
      const newIdx = idx + delta;
      if(newIdx < 0 || newIdx >= reorderable.length) return;
      // swap in the reorderable slice, then re-merge back into state.departments
      [reorderable[idx], reorderable[newIdx]] = [reorderable[newIdx], reorderable[idx]];
      // rebuild state.departments: keep fixed depts in original relative position, replace reorderable depts
      let rIdx = 0;
      state.departments = state.departments.map(d=>fixedDepts.has(d) ? d : reorderable[rIdx++]);
      saveState();
      openModal({type:'dept-reorder'}); // re-render modal with new order
    }

    document.querySelectorAll('[data-move-dept]').forEach(btn=>btn.addEventListener('click', ()=>{

      row.addEventListener('dragstart', ()=>{
        dragDeptIdx = parseInt(row.dataset.deptIdx, 10);
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); });
      row.addEventListener('dragover', e=>{
        e.preventDefault();
        document.querySelectorAll('.dept-order-row').forEach(r=>r.classList.remove('drag-over'));
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', ()=>row.classList.remove('drag-over'));
      row.addEventListener('drop', e=>{
        e.preventDefault();
        row.classList.remove('drag-over');
        const targetIdx = parseInt(row.dataset.deptIdx, 10);
        if(dragDeptIdx === null || dragDeptIdx === targetIdx) return;
        const delta = targetIdx - dragDeptIdx;
        // apply moves step-by-step to handle multi-step drags
        const steps = Math.abs(delta);
        const dir = Math.sign(delta);
        let cur = dragDeptIdx;
        for(let i=0; i<steps; i++){ moveDept(cur, dir); cur += dir; }
        dragDeptIdx = null;
      });
    });
