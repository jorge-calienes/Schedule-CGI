// --- 0. Team lead displacement warning (highest priority - supervision coverage) ---
function renderTeamLeadWarningModal(m){
  const staff = getStaffById(m.staffId);
  const homeArea = getAreaById(staff.homeAreaId);
  const targetArea = getAreaById(m.targetAreaId);
  return `
  <div class="modal">
    <div class="modal-head">
      <div><h2>⚠ This removes supervision from ${escapeHtml(homeArea?homeArea.name:'their area')}</h2><p>${escapeHtml(staff.name)} is the Team Lead supervising <b>${escapeHtml(homeArea?homeArea.name:'')}</b>.${targetArea?` Moving them to <b>${escapeHtml(targetArea.name)}</b> leaves that area without their direct supervision.`:' Unassigning them leaves that area without their direct supervision.'}</p></div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      <div class="alert-box rust"><b>Team Lead lock.</b> This role is blocked from moving by default — confirm only if you're intentionally reassigning supervision for this rotation.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-light" id="modal-return-home">Keep in ${escapeHtml(homeArea?homeArea.name:'home area')}</button>
      <button class="btn btn-danger" id="modal-move-anyway">Move anyway</button>
    </div>
  </div>`;
}

// --- 1. Placement conflict (drag caused a repeat-area or block conflict) ---
function renderPlacementConflictModal(m){
  const staff = getStaffById(m.staffId);
  const targetArea = getAreaById(m.targetAreaId);
  const conflicts = blockConflictsIn(m.staffId, m.targetAreaId);
  const repeat = isRepeatArea(m.staffId, m.targetAreaId);
  const suggestions = suggestAreasFor(m.staffId).filter(s=>s.area.id!==m.targetAreaId);

  let alertHtml = '';
  if(repeat){
    alertHtml += `<div class="alert-box"><b>Repeat placement.</b> ${escapeHtml(staff.name)} was already in <b>${escapeHtml(targetArea.name)}</b> during the last rotation (${escapeHtml(lastCompletedRotation()?.period||'')}).</div>`;
  }
  if(conflicts.length>0){
    alertHtml += `<div class="alert-box rust"><b>Blocked pairing.</b> ${escapeHtml(staff.name)} is blocked with ${conflicts.map(c=>escapeHtml(c.name)).join(', ')}, who ${conflicts.length>1?'are':'is'} already in this area.</div>`;
  }

  return `
  <div class="modal">
    <div class="modal-head">
      <div><h2>Heads up before placing ${escapeHtml(staff.name)}</h2><p>Choose to proceed anyway or pick a better-fit area below.</p></div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      ${alertHtml}
      <div class="small-muted" style="margin-bottom:8px;font-weight:700;">Suggested areas, best fit first</div>
      <div class="option-list">
        ${suggestions.map((s,i)=>`
          <div class="option-card ${i===0 && s.conflicts.length===0 && !s.repeat ?'best':''}" data-pick-area="${s.area.id}">
            <div class="oc-left">
              <span class="oc-name">${escapeHtml(s.area.name)}</span>
              <span class="oc-sub">${s.count}/${s.area.capacity} placed${s.over?' · over capacity':''}</span>
            </div>
            ${i===0 && s.conflicts.length===0 && !s.repeat ? '<span class="badge best">Best fit</span>' : (s.conflicts.length? '<span class="badge conflict">Blocked</span>' : (s.repeat?'<span class="badge conflict">Repeat</span>':''))}
          </div>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-light" id="modal-cancel">Cancel placement</button>
      <button class="btn btn-danger" id="modal-place-anyway">Place anyway</button>
    </div>
  </div>`;
}

// --- 2. Staff manager (add / list / edit) ---
function renderStaffManagerModal(m){
  const editing = m.editId ? getStaffById(m.editId) : null;
  const tab = m.staffTab || 'profile';
  const TAB_ORDER = ['profile','rotation','stats'];
  const isNewStaffContext = _prevStaffManagerEditId !== m.editId;
  if(isNewStaffContext) _prevStaffManagerTab = null;
  const tabChanged = _prevStaffManagerTab !== null && _prevStaffManagerTab !== tab;
  const tabDir = TAB_ORDER.indexOf(tab) >= TAB_ORDER.indexOf(_prevStaffManagerTab||tab) ? 1 : -1;
  _prevStaffManagerTab = tab;
  _prevStaffManagerEditId = m.editId;
  const hasLangCert = editing && (editing.languageCerts||[]).length > 0;
  const langSwitchOn = m.langSwitchOn !== undefined ? m.langSwitchOn : hasLangCert;

  const sw = (id, checked, label, sub='') =>
    `<div class="sw-row"><div class="sw-label-group"><span class="sw-label">${label}</span>${sub?`<span class="sw-sublabel">${sub}</span>`:''}</div>`+
    `<button class="sw-track ${checked?'on':''}" id="${id}" role="switch" aria-checked="${checked}" type="button"><span class="sw-thumb"></span></button></div>`;

  const tagsSwitchOn = m.swTags !== undefined ? m.swTags : !!(editing && editing.tags);
  const lateStartSwitchOn = m.swLateStart !== undefined ? m.swLateStart : !!(editing && editing.lateStart);
  const profileTab = `
    <div class="sm-grid-2">
      <div class="field"><label>Name</label><input type="text" id="staff-name-input" placeholder="Full name" value="${editing?escapeHtml(editing.name):''}"/></div>
      <div class="field">
        <label>TDIS # <span class="field-hint">(3-char ID)</span></label>
        <input type="text" id="staff-tdis-input" placeholder="e.g. PH2" maxlength="3" value="${editing?escapeHtml(editing.tdisNumber||''):''}" style="text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);"/>
        <div class="field-error" id="staff-tdis-error"></div>
      </div>
    </div>
    <div class="sm-grid-2">
      <div class="field"><label>Shift</label>
        <select id="staff-hours-input"><option value="">— Select —</option>
          ${state.shifts.map(sh=>'<option value="'+escapeHtml(sh.label)+'" '+((editing&&editing.shiftHours&&(editing.shiftHours===sh.label||editing.shiftHours.replace(/\s*[-–]\s*/g,' – ')===sh.label))?'selected':'')+'>'+escapeHtml(sh.label)+'</option>').join('')}
        </select>
      </div>
      <div class="field"><label>Lunch</label>
        <select id="staff-lunch-input"><option value="">— Select —</option>
          ${renderLunchOptions(editing ? editing.breakTimes : null)}
        </select>
      </div>
    </div>
    <div class="field"><label>Supervisor</label>
      <select id="staff-supervisor-input"><option value="">—</option>
        ${state.supervisors.map(sv=>'<option value="'+sv.id+'" '+((m.supervisorId!==undefined ? m.supervisorId===sv.id : editing&&editing.supervisorId===sv.id)?'selected':'')+'>'+escapeHtml(sv.name)+'</option>').join('')}
      </select>
    </div>
    <div class="field">
      <label>Hire date <span class="field-hint">(for seniority)</span></label>
      <input type="date" id="staff-hiredate-input" value="${editing&&editing.hireDate?escapeHtml(editing.hireDate):''}" style="max-width:180px;"/>
    </div>
    <div class="sw-group" style="margin-bottom:0;">
      ${sw('sw-late-start', lateStartSwitchOn, '⏰ Late start / partial day', 'Starts later than usual today')}
    </div>
    <div class="sw-reveal ${lateStartSwitchOn?'open':''}" id="late-start-reveal-wrap"><div class="field" style="margin-top:12px;">
      <input type="time" id="staff-latestart-input" value="${editing&&editing.lateStart?escapeHtml(editing.lateStart):''}" style="max-width:140px;"/>
    </div></div>
    <div class="sw-group" style="margin-bottom:0;">
      ${sw('sw-tags', tagsSwitchOn, 'Role / tags', 'Optional label shown on chip')}
      ${sw('sw-subcontractor', m.swSubcontractor !== undefined ? m.swSubcontractor : !!(editing&&editing.isSubcontractor), '🏷 AGS (Sub-contractor)', 'Marks this person as agency / sub-contracted staff')}
    </div>
    <div class="sw-reveal ${tagsSwitchOn?'open':''}" id="tags-reveal-wrap"><div class="field" style="margin-top:12px;"><input type="text" id="staff-tags-input" placeholder="e.g. Escort, Backup, Bilingual" value="${editing?escapeHtml(editing.tags||''):''}"/></div></div>`;

  const rotationTab = `
    <div class="field"><label>Rotation flow</label>
      <select id="staff-flow-input"><option value="">No flow / rotates freely</option>
        ${state.rotationFlows.map(f=>'<option value="'+f.id+'" '+((m.flowId!==undefined ? m.flowId===f.id : editing&&editing.flowId===f.id)?'selected':'')+'>'+escapeHtml(f.name)+'</option>').join('')}
      </select>
    </div>
    <div class="sw-group">
      ${sw('sw-team-lead',   m.swTeamLead    !== undefined ? m.swTeamLead    : !!(editing&&editing.isTeamLead),           '★ Team Lead',                     'Locked to their area, supervises it')}
      ${sw('sw-accom',       m.swAccom       !== undefined ? m.swAccom       : !!(editing&&editing.needsAccommodations),   '♿ Needs accommodations',           'Shown on board & profile to supervisors only — hidden in shared reports by default')}
      ${sw('sw-counter-cert',m.swCounterCert !== undefined ? m.swCounterCert : !!(editing&&editing.counterCert),           '✅ Counter Acceptance certified',   'Required to work that station')}
      ${sw('sw-lang',        langSwitchOn,                                                                                 '🌐 Language certifications',        'Tap to pick languages')}
    </div>
    <div class="field" style="margin-top:var(--md-space-3);">
      <label>Scheduled time off</label>
      ${((state.timeOff||{})[editing?.id]||[]).length===0
        ? '<div class="small-muted" style="margin-bottom:8px;">No upcoming time off scheduled.</div>'
        : '<div class="time-off-list">'+((state.timeOff||{})[editing?.id]||[]).slice(-3).map(r=>'<div class="time-off-row"><span class="time-off-dates">'+escapeHtml(r.startDate)+' → '+escapeHtml(r.endDate)+'</span>'+(r.label?'<span class="time-off-note">'+escapeHtml(r.label)+'</span>':'')+'</div>').join('')+'</div>'
      }
      ${editing ? `<button class="btn btn-light btn-sm" id="btn-open-time-off" style="width:100%;">📅 Manage time off</button>` : ''}
    </div>
    <div class="sw-reveal ${langSwitchOn?'open':''}" id="lang-reveal-wrap"><div class="lang-cert-grid" id="lang-cert-section">${state.languages.map(lang=>{
        const checked = editing&&editing.languageCerts&&editing.languageCerts.includes(lang.id);
        return '<label class="lang-cert-chip '+(checked?'checked':'')+'"><input type="checkbox" class="staff-lang-cert" data-lang-id="'+lang.id+'" '+(checked?'checked':'')+' style="display:none;"/>'+escapeHtml(lang.name)+'</label>';
      }).join('')}</div></div>`;

  const statsTab = (() => {
    if(!editing) return '<div class="small-muted">Save first to see stats.</div>';

    // star display helper: filled/empty stars for 1-5 rating
    const stars = renderProficiencyStars;

    // ── Performance evaluations (Phase 2 mockup screen 4) ── fetched
    // on-demand when this tab is opened — see the fetch trigger in the
    // 'staff-manager' event-wiring block below. Shown above the rotation
    // stats since it's not gated on rotation history existing at all.
    const evalSection = (() => {
      const hist = m.evalHistory;
      const err = m.evalHistoryError;
      let body;
      if(err){
        body = '<div class="small-muted" style="padding:8px 0;">Could not load evaluations — '+escapeHtml(err)+'</div>';
      } else if(hist===undefined || m._evalHistoryLoading){
        body = '<div class="small-muted" style="padding:8px 0;">Loading evaluation history…</div>';
      } else if(hist.length===0){
        body = '<div class="small-muted" style="padding:8px 0;">No evaluations recorded yet.</div>';
      } else {
        // Only approved evaluations move the averages/latest recommendation —
        // a team_lead's still-pending/needs-revision submission is listed
        // below but doesn't count until a supervisor accepts it.
        const approved = hist.filter(r=>r.status==='approved');
        const awaiting = hist.filter(r=>r.status==='pending'||r.status==='needs_revision');
        const avg = key => approved.length ? approved.reduce((sum,r)=>sum+r[key],0)/approved.length : 0;
        const summary = approved.length ? (()=>{
          const latest = approved[0];
          const recMeta = EVAL_RECOMMENDATION_META[latest.recommendation];
          return '<div class="eval-summary-grid">'+
              '<div class="eval-summary-stat"><span class="eval-summary-label">Productivity</span>'+stars(avg('productivity'))+'</div>'+
              '<div class="eval-summary-stat"><span class="eval-summary-label">Performance</span>'+stars(avg('performance'))+'</div>'+
              '<div class="eval-summary-stat"><span class="eval-summary-label">Reliability</span>'+stars(avg('reliability'))+'</div>'+
            '</div>'+
            '<div class="eval-summary-meta">'+
              '<span class="eval-rec-badge" style="background:'+(recMeta?.color||'#999')+'">'+(recMeta?.label||latest.recommendation)+'</span>'+
              '<span class="small-muted"> · latest recommendation · '+approved.length+' approved evaluation'+(approved.length===1?'':'s')+'</span>'+
            '</div>';
        })() : '<div class="small-muted" style="padding:4px 0 12px;">No approved evaluations yet.</div>';
        const awaitingBanner = awaiting.length
          ? '<div class="small-muted" style="margin-bottom:10px;">⏳ '+awaiting.length+' evaluation'+(awaiting.length===1?'':'s')+' awaiting supervisor review</div>'
          : '';
        const trendChart = renderEvalTrendChart(approved);
        body = summary + awaitingBanner + trendChart +
          '<div class="eval-history-list">'+
          hist.slice(0,8).map(r=>{
            const evaluatorName = (r.evaluator&&r.evaluator.name) || 'Unknown';
            const areaName = r.area&&r.area.name;
            const periodLabel = r.period&&r.period.period_label;
            const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString() : '';
            const statusBadge = r.status==='approved'
              ? (()=>{ const rm=EVAL_RECOMMENDATION_META[r.recommendation]; return '<span class="eval-rec-badge small" style="background:'+(rm?.color||'#999')+'">'+(rm?.label||r.recommendation)+'</span>'; })()
              : r.status==='needs_revision'
                ? '<span class="eval-rec-badge small" style="background:'+EVAL_RECOMMENDATION_META.training.color+'">Needs revision</span>'
                : '<span class="eval-rec-badge small" style="background:#8B6F47;">Pending review</span>';
            return '<div class="eval-history-row">'+
              '<div class="eval-history-row-head">'+
                '<span class="eval-history-date">'+escapeHtml(dateStr)+(periodLabel?' · '+escapeHtml(periodLabel):'')+'</span>'+
                statusBadge+
              '</div>'+
              '<div class="eval-history-scores">P '+r.productivity+' · Pf '+r.performance+' · R '+r.reliability+(areaName?' · '+escapeHtml(areaName):'')+'</div>'+
              '<div class="eval-history-evaluator">by '+escapeHtml(evaluatorName)+'</div>'+
              (r.note ? '<div class="eval-history-note">'+escapeHtml(r.note)+'</div>' : '')+
              (r.review_note ? '<div class="eval-history-note" style="font-style:normal;"><b>Review note:</b> '+escapeHtml(r.review_note)+'</div>' : '')+
            '</div>';
          }).join('')+
          '</div>';
      }
      return '<div class="stats-prof-section-label" style="margin-top:0;">Performance evaluations</div>'+body;
    })();

    const { rows, totalCompletedRotations, currentAreaId, bestFit } = staffExperienceBreakdown(editing.id);
    if(totalCompletedRotations===0) return evalSection+'<div class="small-muted" style="line-height:1.6;padding:16px 0 8px;">No rotations recorded yet. Stats will appear after the first Rotate Now.</div>';
    const worked = rows.filter(r=>r.hasExperience);
    const total  = state.areas.filter(a=>!a.fixed).length;
    const pct    = total>0 ? Math.round(worked.length/total*100) : 0;

    return (
      evalSection+
      // ── Overall progress ──
      '<div class="stats-overall-bar-wrap">'+
      '<div class="stats-overall-label"><span>Areas covered</span><span class="stats-overall-pct">'+pct+'%</span></div>'+
      '<div class="stats-overall-track"><div class="stats-overall-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="small-muted" style="margin-top:4px;">'+worked.length+' of '+total+' rotation areas</div></div>'+

      // ── Best fit banner ──
      (bestFit?
        '<div class="stats-bestfit-banner" style="margin:12px 0;"><span class="stats-bestfit-icon">🎯</span><div>'+
        '<div class="stats-bestfit-title">Best fit: <b>'+escapeHtml(bestFit.area.name)+'</b></div>'+
        '<div class="stats-bestfit-sub">'+bestFit.timesWorked+'× experience · '+(bestFit.periodsAgo===0?'last rotation':bestFit.periodsAgo+' rotations ago')+'</div></div></div>':'')+

      // ── Worked areas with proficiency ──
      '<div class="stats-prof-section-label">Proficiency by area</div>'+
      '<div class="stats-prof-grid">'+
      worked.map(r=>{
        const rating  = getAreaRating(editing.id, r.areaId);
        const lvl     = getProficiencyLevel(rating);
        const history = getAreaRatingHistory(editing.id, r.areaId);
        const lastRated = history.length ? history[history.length-1] : null;
        const isCurrent = r.areaId === currentAreaId;
        return '<div class="stats-prof-card'+(isCurrent?' current':'')+'">'+
          '<div class="stats-prof-card-header">'+
          '<span class="area-dot" style="background:'+r.area.color+'"></span>'+
          '<span class="stats-prof-area-name">'+escapeHtml(r.area.name)+'</span>'+
          (isCurrent?'<span class="stats-current-tag">now</span>':'')+
          '</div>'+
          '<div class="stats-prof-rating-row">'+
          stars(rating)+
          (rating?'<span class="stats-prof-badge" style="background:'+lvl.color+'">'+lvl.label+'</span>':'')+'</div>'+
          '<div class="stats-prof-meta">'+
          r.timesWorked+'× worked'+
          (r.periodsAgo===0?' · last rotation':' · '+r.periodsAgo+' rotation'+(r.periodsAgo===1?'':'s')+' since')+
          (lastRated?' · rated '+lastRated.period:' · not yet rated')+
          '</div>'+
          '</div>';
      }).join('')+
      '</div>'+

      // ── Rotation history timeline ──
      (state.history.length>0 ?
        '<div class="stats-prof-section-label" style="margin-top:var(--md-space-5);">Rotation history</div>'+
        '<div class="timeline-row">'+
        state.history.slice(-12).reverse().map(h=>{
          const aId = h.assignments[editing.id];
          const a   = aId ? getAreaById(aId) : null;
          return '<div class="timeline-stop">'
            +'<div class="timeline-dot" style="background:'+(a?a.color:'var(--md-sys-color-outline)')+'" title="'+(a?escapeHtml(a.name):'Unassigned')+'"></div>'
            +'<div class="timeline-label">'+(a?escapeHtml(a.name.slice(0,8)):'—')+'</div>'
            +'<div class="timeline-period">'+escapeHtml(h.period)+'</div>'
            +'</div>';
        }).join('<div class="timeline-arrow">←</div>')+
        '</div>' : '')+

      // ── Call-out history ──
      ((((state.calloutHistory||{})[editing.id]||[]).length>0) ?
        '<div class="stats-prof-section-label" style="margin-top:var(--md-space-5);">Call-out history</div>'+
        '<div class="callout-history-list">'+
        ((state.calloutHistory||{})[editing.id]||[]).slice().reverse().slice(0,8).map(c=>
          '<div class="callout-history-row"><span class="callout-date">'+escapeHtml(c.period||c.date)+'</span>'+(c.reason?'<span class="callout-reason">'+escapeHtml(c.reason)+'</span>':'')+'</div>'
        ).join('')+
        '</div>' : '')
    +`<div class="modal-section-head" style="margin-top:16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-2);padding-top:12px;border-top:1px solid var(--c-border);">Position Change Requests</div>`
    +(()=>{
      const reqs=(editing?.positionRequests||[]).slice().reverse().slice(0,5);
      if(!reqs.length) return '<div class="small-muted" style="margin:6px 0;">No requests submitted.</div>';
      return reqs.map(r=>`<div class="pos-req-row pos-req-${r.status||'pending'}">
        <span class="pos-req-date">${escapeHtml(r.date||'')}</span>
        <span class="pos-req-areas">${escapeHtml(getAreaById(r.fromArea)?.name||'Current')} → ${escapeHtml(getAreaById(r.toArea)?.name||'?')}</span>
        <span class="pos-req-reason">${escapeHtml(r.reason||'')}</span>
        <span class="pos-req-status">${r.status==='approved'?'✅ Approved':r.status==='denied'?'❌ Denied':'⏳ Pending'}</span>
        ${r.status==='pending'||!r.status?`<button class="pos-req-approve-btn" data-staff-id="${editing?.id}" data-req-date="${r.date}">✓ Approve</button>
        <button class="pos-req-deny-btn" data-staff-id="${editing?.id}" data-req-date="${r.date}">✕ Deny</button>`:''}
      </div>`).join('');
    })()
    +(editing?`<button class="btn btn-light btn-sm" id="btn-submit-pos-req" style="width:100%;margin-top:8px;">+ Submit position request</button>`:'')
    );
  })();

  const tabs=[{id:'profile',icon:'👤',label:'Profile'},{id:'rotation',icon:'🔄',label:'Rotation'},{id:'stats',icon:'📊',label:'Stats'}];
  return `
  <div class="modal">
    <div class="modal-head">
      <div><h2>${editing?escapeHtml(editing.name):'Add staff'}</h2>
      <p>${editing?(editing.department||'')+(editing.tags?' · '+editing.tags:''):'Fill in the details, then save.'}</p></div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="sm-tab-bar">
      ${tabs.map(t=>`<button class="sm-tab ${tab===t.id?'active':''}" data-staff-tab="${t.id}">${t.icon} ${t.label}</button>`).join('')}
    </div>
    <div class="modal-body">
      <div class="sm-tab-panel ${tabChanged?'sm-tab-panel-anim':''}" style="--tab-dir:${tabDir};">
        ${tab==='profile'?profileTab:tab==='rotation'?rotationTab:statsTab}
      </div>
    </div>
    <div class="modal-foot">
      ${tab!=='stats'
        ?`<button class="btn btn-primary" id="staff-save-btn">${editing?'Save changes':'Add staff'}</button>
          ${editing?'<button class="btn btn-danger btn-sm" id="staff-delete-btn">Remove</button>':''}`
        :`${editing?'<button class="btn btn-primary" id="modal-edit-from-stats">Edit details</button>':''}${editing&&(authState.account?.role==='admin'||authState.account?.role==='supervisor')?'<button class="btn btn-light" id="staff-evaluate-btn">📝 Evaluate</button>':''}`}
    </div>
    ${tab==='profile'&&!editing?`
    <div style="border-top:1px solid var(--line);padding:16px;">
      <div class="small-muted" style="font-weight:700;margin-bottom:8px;">Roster (${state.staff.length})</div>
      <div class="option-list" style="max-height:220px;overflow-y:auto;">
        ${state.staff.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`
          <div class="option-card" data-edit-staff="${s.id}"><div class="oc-left">
            <span class="oc-name">${s.isTeamLead?'★ ':''}${escapeHtml(s.name)}</span>
            <span class="oc-sub">${state.assignments[s.id]?escapeHtml(getAreaById(state.assignments[s.id])?.name||''):'Unassigned'}${s.tags?' · '+escapeHtml(s.tags):''}</span>
          </div></div>`).join('')}
      </div>
    </div>`:''}
  </div>`;
}


// --- 3. Blocks manager ---
function renderBlocksManagerModal(m){
  return `
  <div class="modal">
    <div class="modal-head">
      <div><h2>Blocked pairings</h2><p>These people will never be suggested for, and will be flagged in, the same area.</p></div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Person A</label>
        <select id="block-a-select">${state.staff.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select>

function renderCalloutDashModal(m){
  // same guard as renderCalloutBanner() — a callout with no matching staff
  // record used to crash this modal outright (every row below assumes
  // s.name exists), which looked like "nothing shows" when opening it.
  const outIds = Object.keys(state.callouts).filter(id=>state.callouts[id] && getStaffById(id));
  const searchQ = (m.search||'').toLowerCase().trim();
  const rows = outIds.map(sid=>{
    const s      = getStaffById(sid);
    const areaId = state.assignments[sid];
    const area   = areaId ? getAreaById(areaId) : null;
    const covererId = areaId
      ? Object.keys(state.coverage||{}).find(cid=>state.assignments[cid]===areaId)
      : null;
    const coverPerson = covererId ? getStaffById(covererId) : null;
    const raw  = areaId ? rankCandidatesForArea(areaId,[sid]) : [];
    const cands = raw.filter(c=>{
      if((state.coverage||{})[c.staff.id]) return false;
      if(!c.currentArea) return true;
      return activeInArea(c.currentArea,c.staff.id).length>1;
    });
    const all = cands.length ? cands : raw.filter(c=>!(state.coverage||{})[c.staff.id]);
    // Apply search filter
    const filtered = searchQ
      ? all.filter(c=>c.staff.name.toLowerCase().includes(searchQ)
          || (getAreaById(c.currentArea)?.name||'').toLowerCase().includes(searchQ))
      : all;
    const selId = (m.selects||{})[sid]
      ?? (filtered.find(c=>c.staff.id===(m.selects||{})[sid])?.staff.id)
      ?? filtered[0]?.staff.id ?? null;
    return {sid,s,area,areaId,covererId,coverPerson,candidates:filtered,selId};
  });
  const pendingCount = rows.filter(r=>!r.coverPerson&&r.area).length;
  const allDone = pendingCount===0;

  const candCard = (c,sid,selId,showBest) => {
    const from = getAreaById(c.currentArea);
    const isSel = c.staff.id===selId;
    const exp  = c.hasExperience?(c.sinceWorked===0?'Last rotation':c.timesWorked+'×'):'New here';
    return '<div class="cd-cand '+(isSel?'sel':'')+(showBest&&!c.wouldDisplaceLead&&!c.conflicts.length?' best':'')+'"'
      +' data-sel-candidate="'+sid+'" data-cand-id="'+c.staff.id+'">'
      +'<div class="cd-cand-av">'+escapeHtml(c.staff.name.charAt(0))+'</div>'
      +'<div class="cd-cand-body">'
        +'<div class="cd-cand-name">'+escapeHtml(c.staff.name)+'</div>'
        +'<div class="cd-cand-sub">'+exp+(from?(' · '+escapeHtml(from.name)):'')+'</div>'
      +'</div>'
      +(showBest&&!c.wouldDisplaceLead&&!c.conflicts.length?'<div class="cd-best-tag">Best</div>':'')
      +(isSel?'<div class="cd-sel-check">✓</div>':'')
      +'</div>';
  };

  return '<div class="modal" style="max-width:460px;max-height:88vh;">'
    +'<div class="modal-head">'
      +'<div><h2>Coverage</h2>'
        +'<p>'+(allDone?'✓ All covered':pendingCount+' need'+(pendingCount>1?'':'s')+' coverage')+'</p>'
      +'</div>'
      +'<button class="modal-close" id="modal-close-x">✕</button>'
    +'</div>'
    +'<div class="cd-search-bar">'
      +'<span class="cd-search-icon">🔍</span>'
      +'<input class="cd-search-input" id="cd-search" type="text" placeholder="Search by name or area…" value="'+escapeHtml(m.search||'')+'"/>'
      +(m.search?'<button class="cd-search-clear" id="cd-search-clear">✕</button>':'')
    +'</div>'
    +'<div class="modal-body" style="padding:0;">'
      +rows.map(({sid,s,area,areaId,covererId,coverPerson,candidates,selId})=>{
        return '<div class="cd-row '+(coverPerson?'cd-done':'cd-pending')+'">'

          // ── Who's out ──
          +'<div class="cd-out-bar">'
            +'<div>'
              +'<div class="cd-out-name">'+escapeHtml(s.name)+'</div>'
              +'<div class="cd-out-area">'+(area?escapeHtml(area.name):'No area')+'</div>'
            +'</div>'
            +'<button class="btn btn-sm cd-mark-in-btn" data-mark-in="'+sid+'">Back ✓</button>'
          +'</div>'

          // ── Covered state ──
          +(coverPerson
            ?'<div class="cd-covered-bar">'
              +'<div class="cd-cov-check">✓</div>'
              +'<div class="cd-cov-text">'
                +'<div class="cd-cov-name">'+escapeHtml(coverPerson.name)+'</div>'
                +'<div class="cd-cov-sub">covering · returns tomorrow</div>'
              +'</div>'
              +'<button class="cd-undo-btn" data-remove-cover="'+(covererId||coverPerson.id)+'">✕</button>'
            +'</div>'

            // ── No area ──
            :!area
            ?'<div class="cd-no-area">No area — nothing to cover</div>'

            // ── No candidates ──
            :candidates.length===0
            ?'<div class="cd-no-area">No available staff</div>'

            // ── Candidate picker ──
            :'<div class="cd-cands">'
              +candidates.slice(0,4).map((c,i)=>candCard(c,sid,selId,i===0)).join('')
              +(candidates.length>4
                ?'<details class="cd-more"><summary>+'+(candidates.length-4)+' more</summary>'
                  +candidates.slice(4).map(c=>candCard(c,sid,selId,false)).join('')
                +'</details>'
                :'')
            +'</div>'
            +'<div class="cd-assign-bar">'
              +'<span class="cd-assign-who">'+(selId?escapeHtml(getStaffById(selId)?.name||''):'Select above')+'</span>'
              +'<button class="cd-assign-btn btn btn-primary btn-sm"'
                +' data-cover="'+selId+'" data-cover-area="'+areaId+'" data-cover-out="'+sid+'"'
                +(selId?'':' disabled')
              +'>✓ Assign</button>'
            +'</div>'
          )

          +'</div>';
      }).join('')
    +'</div>'
    +(allDone?'<div class="modal-foot"><button class="btn btn-primary" id="btn-cov-done">Done ✓</button></div>':'')
  +'</div>';
}

function nextPeriodLabel(){
  const weeks = Number(state.rotationWeeks)||2;
  const base = state.rotationStartDate || state.currentPeriod || todayLabel();
  return addDaysToDateStr(base, weeks*7);
}

// adds N days to an ISO date string (YYYY-MM-DD), returns ISO date string
function addDaysToDateStr(isoStr, days){
  const [y,m,d] = (isoStr||todayLabel()).split('-').map(Number);
  const dt = new Date(y, (m||1)-1, d||1);
  dt.setDate(dt.getDate()+days);
  return dt.toISOString().slice(0,10);
}

// --- Staff import (Excel/CSV) ---
// Fields NOT included here (Supervisor, Language certifications, Rotation
// flow) aren't wired to Supabase anywhere yet, even from the manual staff
// form — those tables are never loaded by loadBoard() and there's no sync
// function for them. Importing them would silently not persist, the same
// trap counter_cert/hire_date were in before this feature surfaced it.
const STAFF_IMPORT_FIELDS = ['name','tdis','department','shift','hireDate','teamLead','subcontractor','accommodations','counterCert','tags'];
const STAFF_IMPORT_ALIASES = {
  name: ['name','fullname','staffname','employeename'],
  tdis: ['tdis','tdisnumber','tdisno','tdis#'],
  department: ['department','dept'],
  shift: ['shift','shifthours','hours','shifttime'],
  hireDate: ['hiredate','datehired','startdate'],
  teamLead: ['teamlead','isteamlead','tl'],
  subcontractor: ['agssubcontractor','subcontractor','ags','issubcontractor'],
  accommodations: ['needsaccommodations','accommodations','accommodation'],
  counterCert: ['counteracceptance','counteracceptancecertified','countercert','cacertified','ca','counteracceptancecert'],
  tags: ['tags','roletags','role'],
};
const STAFF_IMPORT_LABELS = {
  name:'Name', tdis:'TDIS #', department:'Department', shift:'Shift', hireDate:'Hire date',
  teamLead:'Team Lead (Y/N)', subcontractor:'AGS/Subcontractor (Y/N)', accommodations:'Needs Accommodations (Y/N)',
  counterCert:'Counter Acceptance Certified (Y/N)', tags:'Tags',
};
function autoDetectStaffImportMapping(headers){
  const norm = h => String(h).toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]/g,'');
  const find = aliases => headers.find(h => aliases.includes(norm(h))) || '';
  const mapping = {};
  STAFF_IMPORT_FIELDS.forEach(key => { mapping[key] = find(STAFF_IMPORT_ALIASES[key]); });
  return mapping;
}
const STAFF_IMPORT_TRUTHY = ['yes','y','true','1','x','✓','certified','cert'];
function normalizeDateForImport(raw){
  const s = String(raw||'').trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : d.toISOString().slice(0,10);
}
function buildStaffImportPreview(rawRows, mapping){
  const seenTdis = new Set();
  const g = (row, key) => String(row[mapping[key]] ?? '').trim();
  const truthy = (row, key) => STAFF_IMPORT_TRUTHY.includes(g(row,key).toLowerCase());
  return rawRows.map(row=>{
    const name = g(row,'name');
    const tdisNumber = g(row,'tdis').toUpperCase();
    const department = g(row,'department');
    const shiftHours = g(row,'shift');
    const hireDate = normalizeDateForImport(g(row,'hireDate'));
    const tags = g(row,'tags');
    const isTeamLead = truthy(row,'teamLead');
    const isSubcontractor = truthy(row,'subcontractor');
    const needsAccommodations = truthy(row,'accommodations');
    const counterCert = truthy(row,'counterCert');

    const existing = tdisNumber ? state.staff.find(s=>s.tdisNumber===tdisNumber) : null;

    let error = '';
    if(!name) error = 'Missing name';
    else if(tdisNumber && !/^[A-Z0-9]{3}$/.test(tdisNumber)) error = 'TDIS must be 3 letters/numbers';
    else if(tdisNumber && seenTdis.has(tdisNumber)) error = `TDIS ${tdisNumber} appears twice in this file`;
    if(!error && tdisNumber) seenTdis.add(tdisNumber);

    return { name, tdisNumber, department, shiftHours, hireDate, tags, isTeamLead, isSubcontractor, needsAccommodations, counterCert,
      error, existingId: existing ? existing.id : null };
  });
}
function downloadStaffImportTemplate(){
  const headers = STAFF_IMPORT_FIELDS.map(k=>STAFF_IMPORT_LABELS[k]);
  const example = ['Jane Doe','JD1','Fixed Positions','7:30 - 4:15','2024-03-01','No','No','No','Yes','Bilingual'];
  const ws = XLSX.utils.aoa_to_sheet([headers, example]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Staff');
  XLSX.writeFile(wb, 'staff-import-template.xlsx');
}

// --- Audit log (supervisor/admin, read-only) ---
const AUDIT_ACTION_ICONS = {
  move:'🔀', swap:'⇄', callout:'⚠️', clear_callout:'✅', edit_staff:'👤', add_staff:'➕',
  archive_staff:'🗑', edit_area:'🏷', add_area:'➕', rotate_period:'🔁', evaluation:'📝',
  account_request:'🔑', account_grant:'🔓', account_revoke:'🔒', time_off:'📅',
};
const AUDIT_ACTION_LABELS = {
  move:'Move', swap:'Swap', callout:'Callout', clear_callout:'Clear callout', edit_staff:'Edit staff',
  add_staff:'Add staff', archive_staff:'Remove staff', edit_area:'Edit area', add_area:'Add area',
  rotate_period:'Rotate', evaluation:'Evaluation', account_request:'Account request',
  account_grant:'Account grant', account_revoke:'Account revoke', time_off:'Time off',
};
function renderAuditLogModal(m){
  const q = (m.search||'').trim().toLowerCase();
  const actionFilter = m.actionFilter||'';
  const dateFilter = m.dateFilter||'';
  const entries = (m.entries||[]).filter(e=>{
    if(actionFilter && e.action!==actionFilter) return false;
    if(dateFilter && (!e.created_at || e.created_at.slice(0,10)!==dateFilter)) return false;
    if(q && !(e.description||'').toLowerCase().includes(q) && !(e.accounts?.name||'').toLowerCase().includes(q)) return false;
    return true;
  });
  const actionsPresent = [...new Set((m.entries||[]).map(e=>e.action))];
  return `
  <div class="modal" style="max-width:640px;">
    <div class="modal-head">
      <div><h2>Audit log</h2><p>Most recent ${(m.entries||[]).length} actions across the app.</p></div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      ${!m.loading?`
      <div class="log-filters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <select id="audit-action-filter" style="border:1px solid var(--md-sys-color-outline);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12.5px;background:var(--md-sys-color-surface);">
          <option value="">All action types</option>
          ${actionsPresent.map(a=>`<option value="${a}" ${actionFilter===a?'selected':''}>${AUDIT_ACTION_LABELS[a]||a}</option>`).join('')}
        </select>
        <input type="date" id="audit-date-filter" value="${escapeHtml(dateFilter)}" style="border:1px solid var(--md-sys-color-outline);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12.5px;background:var(--md-sys-color-surface);"/>
        ${(actionFilter||dateFilter)?'<button class="btn btn-light btn-sm" id="audit-filters-clear">Clear filters</button>':''}
      </div>
      <div class="roster-search-wrap" style="margin-bottom:12px;">
        <span class="roster-search-icon">🔍</span>
        <input type="text" id="audit-search" class="roster-search" placeholder="Search by action or who did it…" value="${escapeHtml(m.search||'')}"/>
        ${m.search?'<button class="roster-search-clear" id="audit-search-clear">✕</button>':''}
      </div>`:''}
      ${m.loading?`<div class="small-muted">Loading audit log…</div>`:''}
      ${!m.loading && m.error?`<div class="alert-box rust">Couldn't load the audit log: ${escapeHtml(m.error)}</div>`:''}
      ${!m.loading && !m.error && (m.entries||[]).length===0?`<div class="small-muted" style="line-height:1.6;">No activity recorded yet. Moves, edits, rotations, and evaluations will show up here as people use the app.</div>`:''}
      ${!m.loading && !m.error && (m.entries||[]).length>0 && entries.length===0?`<div class="small-muted">No entries match the current filters.</div>`:''}
      ${entries.length>0?`
      <div class="option-list" style="max-height:420px;overflow-y:auto;">
        ${entries.map(e=>`
          <div class="option-card" style="cursor:default;">
            <div class="oc-left">
              <span class="oc-name">${AUDIT_ACTION_ICONS[e.action]||'•'} ${escapeHtml(e.description||e.action)}</span>
              <span class="oc-sub">${escapeHtml(e.accounts?.name||'Unknown')} · ${e.created_at?new Date(e.created_at).toLocaleString():''}</span>
            </div>
          </div>`).join('')}
      </div>`:''}
    </div>
  </div>`;
}

// --- Team dashboard (Phase 2 mockup screen 5) — aggregated evaluations
// across the whole team, admin/supervisor only. ---
// Team dashboard columns — mirrors the mockup's 3-column kanban grouped by
// latest recommendation (stay/advance/training), plus a 4th "Not yet
// evaluated" column that wasn't in the mockup but was worth keeping: it's
// the one place a manager can see who's never been reviewed at all, not
// just how the reviewed people scored.
const TEAM_DASH_COLUMNS = [
  {id:'stay',     label:'Keep on rotation',    dot:'#B45309', match:r=>r.latestRecommendation==='stay'},
  {id:'advance',  label:'Ready to advance',    dot:'#2D6E5E', match:r=>r.latestRecommendation==='advance'},
  {id:'training', label:'Flagged for training',dot:'#B91C1C', match:r=>r.latestRecommendation==='training'},
  {id:'unrated',  label:'Not yet evaluated',   dot:'#9E9E9E', match:r=>r.count===0},
];
function renderTeamDashboardModal(m){
  const search = (m.search||'').trim().toLowerCase();
  const rows = m.loading ? [] : aggregateTeamPerformance(m.raw);
  const visible = search ? rows.filter(r=>r.name.toLowerCase().includes(search)) : rows;
  const evaluatedRows = rows.filter(r=>r.count>0);
  const teamAvg = key => evaluatedRows.length ? evaluatedRows.reduce((sum,r)=>sum+r[key],0)/evaluatedRows.length : 0;

  const renderCard = r => {
    const recMeta = r.latestRecommendation ? EVAL_RECOMMENDATION_META[r.latestRecommendation] : null;
    return `<button class="team-dash-card" data-team-staff="${r.staffId}">
      <div class="team-dash-card-name">${escapeHtml(r.name)}</div>
      ${r.count>0 ? `
        <div class="team-dash-card-scores">
          <span class="mini-score">P ${r.avgProductivity.toFixed(1)}</span>
          <span class="mini-score">Pf ${r.avgPerformance.toFixed(1)}</span>
          <span class="mini-score">R ${r.avgReliability.toFixed(1)}</span>
        </div>
      ` : `<div class="small-muted" style="font-size:11.5px;">No approved evaluation yet</div>`}
      ${r.pendingCount>0?`<span class="eval-rec-badge small" style="background:#8B6F47;margin-top:4px;">⏳ ${r.pendingCount} pending</span>`:''}
    </button>`;
  };

  return `
  <div class="modal" style="max-width:820px;">
    <div class="modal-head">
      <div><h2>📊 Team performance</h2><p>Where each person stands, based on their latest approved evaluation</p></div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      ${m.loading ? `<div class="small-muted">Loading team performance…</div>` : ''}
      ${!m.loading && m.error ? `<div class="alert-box rust">Couldn't load team performance: ${escapeHtml(m.error)}</div>` : ''}
      ${!m.loading && !m.error ? `
        ${evaluatedRows.length===0 ? `<div class="small-muted" style="line-height:1.6;margin-bottom:12px;">No evaluations approved yet — team-wide stats will appear here once staff have been evaluated.</div>` : `
        <div class="team-dash-summary">
          <div class="team-dash-stat"><span class="team-dash-stat-label">Productivity</span>${renderProficiencyStars(teamAvg('avgProductivity'))}</div>
          <div class="team-dash-stat"><span class="team-dash-stat-label">Performance</span>${renderProficiencyStars(teamAvg('avgPerformance'))}</div>
          <div class="team-dash-stat"><span class="team-dash-stat-label">Reliability</span>${renderProficiencyStars(teamAvg('avgReliability'))}</div>
        </div>`}
        <input type="text" id="team-dash-search" class="team-dash-search" placeholder="Search staff…" value="${escapeHtml(m.search||'')}"/>
        <div class="team-dash-cols">
          ${TEAM_DASH_COLUMNS.map(col=>{
            const colRows = visible.filter(col.match);
            return `<div class="team-dash-col">
              <div class="team-dash-col-head">
                <span class="team-dash-col-dot" style="background:${col.dot};"></span>
                <h3>${col.label}</h3>
                <span class="team-dash-filter-count">${colRows.length}</span>
              </div>
              ${colRows.length===0 ? `<div class="small-muted" style="font-size:12px;padding:8px 0;">Nobody here.</div>` : colRows.map(renderCard).join('')}
            </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  </div>`;
}

  const items = m.items||[];
  return `

    <div class="modal-head">
      <div><h2>📝 Pending evaluations</h2><p>Submitted by team leads, awaiting your review</p></div>

      ${!m.loading && !m.error && items.length===0?`<div class="small-muted" style="line-height:1.6;">Nothing waiting on you — every team-lead evaluation has been reviewed.</div>`:''}
      ${items.length>0?`
      <div class="eval-history-list">

          const staffName = (row.staff&&row.staff.name)||'Unknown';

          return `

              <span class="eval-history-date">${escapeHtml(staffName)}${periodLabel?' · '+escapeHtml(periodLabel):''}</span>

            </div>

            <div class="eval-history-evaluator">submitted by ${escapeHtml(evaluatorName)}</div>
            ${row.note?`<div class="eval-history-note">${escapeHtml(row.note)}</div>`:''}
            ${isRejecting ? `
              <div style="margin-top:10px;">
                <textarea id="reject-note-input" rows="2" placeholder="What needs to change before this can be approved?" style="width:100%;border:1px solid var(--md-sys-color-outline);border-radius:var(--md-sys-shape-corner-extra-small);padding:8px;font-family:var(--sans);resize:vertical;"></textarea>
                <div style="display:flex;gap:8px;margin-top:8px;">
                  <button class="btn btn-primary btn-sm" id="confirm-reject-btn" data-confirm-reject="${row.id}" data-confirm-reject-staff="${row.staff_id}">Send back</button>
                  <button class="btn btn-light btn-sm" id="cancel-reject-btn">Cancel</button>
                </div>
              </div>
            ` : `
              <div style="display:flex;gap:8px;margin-top:10px;">
                <button class="btn btn-primary btn-sm" data-approve-eval="${row.id}" data-approve-staff="${row.staff_id}">✓ Approve</button>
                <button class="btn btn-light btn-sm" data-reject-eval="${row.id}">↩ Send back</button>
              </div>
            `}
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

// --- Scheduled Time Off Manager ---
function renderTimeOffManagerModal(m){
  const editing = m.staffId ? getStaffById(m.staffId) : null;
  const offs = editing ? ((state.timeOff||{})[editing.id]||[]) : [];
  const allStaff = m.staffId ? null : state.staff.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const searchQ = m.searchQ||'';

  // Staff picker mode (from list view + Add button)
  if(m.pickStaff && !m.staffId){
    const sq = m.searchQ||'';
    const filtered = state.staff.filter(s=>!sq||s.name.toLowerCase().includes(sq.toLowerCase()))
      .slice().sort((a,b)=>a.name.localeCompare(b.name));
    return `
    <div class="modal" style="max-width:440px;">
      <div class="modal-head">
        <div><h2>Select staff member</h2><p>Choose who to schedule time off for.</p></div>
        <button class="modal-close" id="modal-close-x">✕</button>
      </div>
      <div class="modal-body">
        <div class="field"><input type="text" id="to-search" placeholder="Search…" value="${escapeHtml(sq)}" style="width:100%;"/></div>
        <div style="max-height:340px;overflow-y:auto;">
          ${filtered.map(s=>`
            <div class="option-card" data-pick-staff="${s.id}">
              <div class="oc-left">
                <span class="oc-name">${escapeHtml(s.name)}</span>
                <span class="oc-sub">${state.assignments[s.id]?escapeHtml(getAreaById(state.assignments[s.id])?.name||''):'Unassigned'}</span>
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-light" id="to-back" type="button">← Back</button>
      </div>
    </div>`;
  }

  // If no staff selected, show the coverage planning dashboard
  if(!m.staffId){
    const today = todayLabel();
    const showPast = m.showPast || false;

    // Build flat list of all time off entries with staff + area info
    const allOff = [];
    state.staff.forEach(s=>{
      ((state.timeOff||{})[s.id]||[]).forEach(r=>{
        if(!showPast && r.endDate < today) return; // skip past by default
        const areaId = state.assignments[s.id];
        const area   = areaId ? getAreaById(areaId) : null;
        allOff.push({staff:s, area, areaId, ...r});
      });
    });
    allOff.sort((a,b)=>a.startDate.localeCompare(b.startDate));

    const filtered = searchQ
      ? allOff.filter(r=>
          r.staff.name.toLowerCase().includes(searchQ.toLowerCase()) ||
          (r.label||'').toLowerCase().includes(searchQ.toLowerCase()) ||
          (r.area?.name||'').toLowerCase().includes(searchQ.toLowerCase()))
      : allOff;

    // Group by start date for a calendar-like view
    const grouped = {};
    filtered.forEach(r=>{
      const key = r.startDate;
      if(!grouped[key]) grouped[key]=[];
      grouped[key].push(r);
    });

    const today_label = today;

    return `
    <div class="modal" style="max-width:600px;max-height:90vh;">
      <div class="modal-head">
        <div><h2>📅 Coverage planning</h2><p>Upcoming time off and coverage assignments.</p></div>
        <button class="modal-close" id="modal-close-x">✕</button>
      </div>
      <div class="modal-body" style="padding-top:0;">
        <div class="to-toolbar">
          <input type="text" id="to-search" placeholder="Search name, area, or note…" value="${escapeHtml(searchQ)}"/>
          <label class="to-past-toggle"><input type="checkbox" id="to-show-past" ${showPast?'checked':''}/> Show past</label>
          <button class="btn btn-primary btn-sm" id="btn-add-time-off">+ Add</button>
        </div>

        ${filtered.length===0

// Read-only star display (filled/half/empty) for a 1-5 rating — shared by
// the Stats tab's proficiency cards, the performance-evaluation summary,
// and the team dashboard.
function renderProficiencyStars(rating){
  if(!rating) return '<span class="prof-stars unrated">Not yet rated</span>';
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  let s = '';
  for(let i=1;i<=5;i++){
    if(i<=full) s+='<span class="prof-star filled">★</span>';
    else if(i===full+1&&half) s+='<span class="prof-star half">★</span>';
    else s+='<span class="prof-star empty">☆</span>';
  }
  return '<span class="prof-stars">'+s+'</span>';
}

// Combined-score trend chart for the staff performance profile (mockup
// screen 4) — groups approved evaluations by rotation period, averages
// productivity/performance/reliability into one 0-5 "combined score" per
// period (multiple evaluators in the same period just average together),
// and shows the last 6 periods oldest-to-newest. Evaluations with no
// period_id (submitted outside a formal rotation) aren't plottable on a
// period timeline, so they're excluded here — they still show in the
// history list above.
function renderEvalTrendChart(approvedRows){
  const byPeriod = {};
  approvedRows.forEach(r=>{
    if(!r.period_id) return;
    if(!byPeriod[r.period_id]) byPeriod[r.period_id] = { label: (r.period&&r.period.period_label)||'?', scores: [], earliest: r.created_at };
    byPeriod[r.period_id].scores.push((r.productivity+r.performance+r.reliability)/3);
    if(r.created_at < byPeriod[r.period_id].earliest) byPeriod[r.period_id].earliest = r.created_at;
  });
  const periods = Object.values(byPeriod)
    .map(p=>({ label: p.label, combined: p.scores.reduce((a,b)=>a+b,0)/p.scores.length, earliest: p.earliest }))
    .sort((a,b)=> a.earliest < b.earliest ? -1 : (a.earliest > b.earliest ? 1 : 0))
    .slice(-6);
  if(periods.length===0) return '';
  const shortLabel = label => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(label);
    if(!m) return label;
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[Number(m[2])-1]+' '+Number(m[3]);
  };
  return '<div class="stats-prof-section-label" style="margin-top:0;">Trend over time</div>'+
    '<div class="small-muted" style="margin-bottom:6px;">Combined score, last '+periods.length+' rotation period'+(periods.length===1?'':'s')+'</div>'+
    '<div class="trend-chart">'+
      periods.map(p=>'<div class="trend-bar" style="height:'+Math.max(6,Math.round(p.combined/5*100))+'%;"><span class="trend-bar-v">'+p.combined.toFixed(1)+'</span></div>').join('')+
    '</div>'+
    '<div class="trend-labels">'+periods.map(p=>'<span>'+escapeHtml(shortLabel(p.label))+'</span>').join('')+'</div>';
}

// Groups raw evaluation rows (as returned by fetchTeamPerformanceOverview)
// by staff_id and computes per-person averages, plus fills in any active
// staff member who has zero evaluations — visible team-wide gaps are as
// useful here as the scores themselves. Rows arrive newest-first from the
// query, so each group's first APPROVED row is already the latest one that
// counts — a team_lead's still-'pending'/'needs_revision' submission
// doesn't move the averages or the recommendation until a supervisor
// accepts it, only shows up as a pendingCount badge.
function aggregateTeamPerformance(raw){
  const byStaff = {};
  (raw||[]).forEach(r=>{
    if(!byStaff[r.staff_id]) byStaff[r.staff_id] = { staffId:r.staff_id, name:(r.staff&&r.staff.name)||getStaffById(r.staff_id)?.name||'Unknown', rows:[] };
    byStaff[r.staff_id].rows.push(r);
  });
  const evaluated = Object.values(byStaff).map(entry=>{
    const approvedRows = entry.rows.filter(r=>r.status==='approved');
    const pendingCount = entry.rows.filter(r=>r.status==='pending'||r.status==='needs_revision').length;
    if(!approvedRows.length){
      return { staffId: entry.staffId, name: entry.name, count: 0, pendingCount,
        avgProductivity: 0, avgPerformance: 0, avgReliability: 0, latestRecommendation: null, latestDate: null };
    }
    const avg = key => approvedRows.reduce((sum,row)=>sum+row[key],0)/approvedRows.length;
    return {
      staffId: entry.staffId, name: entry.name, count: approvedRows.length, pendingCount,
      avgProductivity: avg('productivity'), avgPerformance: avg('performance'), avgReliability: avg('reliability'),
      latestRecommendation: approvedRows[0].recommendation, latestDate: approvedRows[0].created_at,
    };
  });
  const evaluatedIds = new Set(evaluated.map(e=>e.staffId));
  const notEvaluated = state.staff.filter(s=>!evaluatedIds.has(s.id)).map(s=>({
    staffId: s.id, name: s.name, count: 0, pendingCount: 0,
    avgProductivity: 0, avgPerformance: 0, avgReliability: 0,
    latestRecommendation: null, latestDate: null,
  }));
  return evaluated.concat(notEvaluated).sort((a,b)=>a.name.localeCompare(b.name));
}

// ============ PLACEMENT LOGIC ============

// Fires a Supabase write in the background for a board action that's already
// been applied to local state + rendered (Step 3: board writes go to
// Supabase, but never block the UI on network latency). On failure the local
// change stands — just tell the user it didn't sync.
function syncBoardWrite(fn, label){
  if(!window.RC || authState.status!=='signed-in' || !authState.account) return;
  Promise.resolve().then(fn).catch(e=>{
    console.warn(label+' sync failed:', e && e.message);
    showToast(`Saved here, but didn't sync to the server (${label})`, 'rust');
  });
}

// Awaited version of syncBoardWrite for deliberate Save/Delete actions
// (staff & area CRUD) where the user wants a definitive "did this actually
// persist to the database?" answer, rather than a fire-and-forget
// background sync. Local state should still be applied by the caller either
// way — this just reports whether the database write also succeeded.
async function syncCrudWrite(fn){
  if(!window.RC || authState.status!=='signed-in' || !authState.account){
    return {ok:false, error:new Error('Not connected to the database.')};
  }
  try{
    const result = await fn();
    return {ok:true, result};
  }catch(e){
    console.warn('CRUD sync failed:', e && e.message);
    return {ok:false, error:e};
  }
}

// Roster table inline edits (shift/lunch/flow selects, CA-cert toggle, AGS
// toggle, team-lead toggle, tags cell) mutate a single field on `s`, but
// updateStaff() writes every staffRow() column — so the sync must resend
// the record's current full state, not just the one field that changed.
// Fire-and-forget like syncBoardWrite(): frequent, low-friction edits, not
// a deliberate CRUD save that deserves an awaited "saved to database ✓".
function syncRosterStaffEdit(s, label){
  syncBoardWrite(async ()=>{
    const departmentId = s.department ? await window.RC.ensureDepartment(s.department) : null;
    return window.RC.updateStaff({
      staffId: s.id, name: s.name, tdisNumber: s.tdisNumber, departmentId, homeAreaId: s.homeAreaId,
      isTeamLead: s.isTeamLead, isSubcontractor: s.isSubcontractor, needsAccommodations: s.needsAccommodations,
      tags: s.tags, counterCert: s.counterCert, hireDate: s.hireDate,
      supervisorId: s.supervisorId, flowId: s.flowId, flowEnrolled: s.flowEnrolled,
      shiftHoursLabel: s.shiftHours, breakTimesLabel: s.breakTimes, actingAccountId: authState.account.id,
    });
  }, label);
}

// attempts to place staffId into areaId (or null for pool). If conflicts exist, opens modal instead of placing.
function attemptPlace(staffId, areaId, force){
  // Counter Acceptance cert check — hard block regardless of force
  if(areaId){
    const area = getAreaById(areaId);
    const staff = getStaffById(staffId);
    if(area && area.name==='Counter Acceptance' && staff && !staff.counterCert){
      openModal({type:'cert-block', staffId, targetAreaId:areaId, missing:'Counter Acceptance certification'});
      return;
    }
  }
  if(!force){
    if(isTeamLeadDisplaced(staffId, areaId)){
      openModal({type:'team-lead-warning', staffId, targetAreaId:areaId});
      return;
    }
  }
  // capacity is a hard stop with no override — even a forced placement (from another
  // modal's "place anyway") must still respect it, since the only valid fix is
  // raising the area's capacity, not bypassing the limit.
  if(areaId){
    const area = getAreaById(areaId);
    const currentlyThere = activeInArea(areaId, staffId).length; // excludes callouts — they don't occupy a slot
    if(area && currentlyThere >= area.capacity){
      openModal({type:'capacity-full', staffId, targetAreaId:areaId});
      return;
    }
  }
  if(!force){
    const conflicts = areaId ? blockConflictsIn(staffId, areaId) : [];
    const repeat = areaId ? isRepeatArea(staffId, areaId) : false;
    if(conflicts.length>0 || repeat){
      openModal({type:'placement-conflict', staffId, targetAreaId:areaId});
      return;
    }
  }
  const staffMoved = getStaffById(staffId);
  const areaMoved  = areaId ? getAreaById(areaId) : null;
  const fromAreaId = state.assignments[staffId];
  const fromArea   = fromAreaId ? getAreaById(fromAreaId) : null;
  state.assignments[staffId] = areaId;
  saveState();
  syncBoardWrite(()=>window.RC.moveStaff({
    staffId, areaId, actingAccountId: authState.account.id,
    staffName: staffMoved?.name, fromAreaName: fromArea?.name, toAreaName: areaMoved?.name,
  }), 'move');
  if(staffMoved) showToast(areaMoved ? `${staffMoved.name.split(' ')[0]} moved to ${areaMoved.name}` : `${staffMoved.name.split(' ')[0]} unassigned`, 'teal');
  render();
}

function attachHandlers(){
  // close mobile overflow menu on outside click (registered once).

  // ── Scroll-fade cue: show a bottom fade + hint when an area column has more chips below the fold ──
  document.querySelectorAll('.area-drop').forEach(drop=>{
    const col = drop.closest('.area-col');
    if(!col) return;
    const updateCue = ()=>{
      const hasMore = (drop.scrollHeight - drop.scrollTop - drop.clientHeight) > 4;
      col.classList.toggle('has-more', hasMore);
    };
    updateCue();
    drop.addEventListener('scroll', updateCue);
  });

  // ── Area column drag-to-reorder within a row ──────────────────────────
  let _dragAreaId = null, _dragAreaDept = null;
  document.querySelectorAll('[data-drag-area]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      _dragAreaId   = el.dataset.dragArea;
      _dragAreaDept = el.dataset.dragDept;
      boardInteractionInProgress = true;
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    el.addEventListener('dragend', ()=>{
      _dragAreaId = _dragAreaDept = null;
      boardInteractionInProgress = false;
      document.querySelectorAll('.area-col.drag-over').forEach(c=>c.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.area-col').forEach(col=>{
    col.addEventListener('dragover', e=>{
      if(!_dragAreaId) return;
      const targetId = col.querySelector('[data-drag-area]')?.dataset.dragArea;
      if(targetId && targetId !== _dragAreaId){
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll('.area-col.drag-over').forEach(c=>c.classList.remove('drag-over'));
        col.classList.add('drag-over');
      }
    });
    col.addEventListener('dragleave', e=>{
      if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e=>{
      e.preventDefault();
      e.stopPropagation();
      col.classList.remove('drag-over');
      if(!_dragAreaId) return;
      const targetId = col.querySelector('[data-drag-area]')?.dataset.dragArea;
      if(!targetId || targetId === _dragAreaId) return;
      const dept  = _dragAreaDept;
      const areas = state.areas.filter(a=>a.department===dept);
      const ao    = ((state.areaOrder||{})[dept] || areas.map(a=>a.id)).slice();
      // ensure both ids are in the order list
      areas.forEach(a=>{ if(!ao.includes(a.id)) ao.push(a.id); });
      const from  = ao.indexOf(_dragAreaId);
      const to    = ao.indexOf(targetId);
      if(from<0||to<0) return;
      ao.splice(from, 1);

  function buildReportHTML(sections, opts={}){
    const period  = escapeHtml(state.currentPeriod||'—');
    const showTimes       = opts.showTimes       !== false;
    const showBreaks      = opts.showBreaks      !== false;
    const showSeniority   = opts.showSeniority   !== false;
    const showAccom       = opts.showAccom       === true;  // OFF by default — private
