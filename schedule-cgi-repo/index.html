          const leaves= ((state.timeOff||{})[s.id]||[]).filter(r=>r.endDate>=today).length;
          const move  = !!(area&&!area.fixed&&isRepeatArea(s.id,area.id));
          const reqs  = (s.positionRequests||[]).filter(r=>!r.status||r.status==='pending').length;
          sh1.push([
            s.name, s.department||'', area?.name||'', s.shiftHours||'',
            senYrs(s), rots||0, hrs||'', cos||0, leaves||0,
            move?'Yes':'No', s.isTeamLead?'Yes':'No', ...(showAccom?[s.needsAccommodations?'Yes':'No']:[]),
            langs, sup?.name||'', reqs||0, s.hireDate||'', s.lateStart||''
          ]);
        });

        // ── Sheet 2: Area Utilization ──────────────────────────────────────
        const sh2 = [
          ['Area','Department','Fixed','Placed Today','Capacity','Fill %','Gap','Times Understaffed','Understaffed %','Avg Historical Fill','Languages Available']
        ];
        state.areas.forEach(a=>{
          const members = state.staff.filter(s=>s.active!==false&&state.assignments[s.id]===a.id);
          const active  = members.filter(s=>!state.callouts[s.id]);
          const placed  = active.length;
          const cap     = a.capacity||0;
          const pct     = cap>0?Math.round(placed/cap*100):0;
          const gap     = Math.max(0,cap-placed);
          const hist    = (state.fillHistory||[]).filter(h=>h.areas?.[a.id]);
          const under   = hist.filter(h=>{ const f=h.areas[a.id]; return f.capacity>0&&f.placed<f.capacity; }).length;
          const uPct    = hist.length?Math.round(under/hist.length*100):0;
          const avgFill = hist.length?( hist.reduce((s,h)=>s+(h.areas[a.id]?.placed||0),0)/hist.length ).toFixed(1):'';
          const langs   = [...new Set(active.flatMap(s=>(s.languageCerts||[]).map(id=>state.languages.find(l=>l.id===id)?.name).filter(Boolean)))].join(', ');
          const dept    = members[0]?.department||'';
          sh2.push([a.name, dept, a.fixed?'Yes':'No', placed, cap, pct+'%', gap, under, uPct+'%', avgFill, langs]);
        });

        // ── Sheet 3: Daily Activity Log ────────────────────────────────────
        const sh3 = [['Date','Time','Type','Staff Name','Department','From Area','To Area','Note','Period']];
        (state.dailyLog||[]).slice().reverse().forEach(e=>{
          const s  = getStaffById(e.staffId);
          const ts = e.ts ? new Date(e.ts) : null;
          const timeStr = ts ? ts.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}) : '';
          sh3.push([
            e.date||'', timeStr, e.type||'',
            s?.name||e.staffId||'', s?.department||'',
            getAreaById(e.fromArea)?.name||e.fromArea||'',
            getAreaById(e.toArea)?.name||e.toArea||'',
            e.note||'', e.period||''
          ]);
        });

        // ── Sheet 4: Arrival Times ─────────────────────────────────────────
        const sh4 = [['Name','Department','Date','Scheduled','Actual','Diff (min)','Status']];
        state.staff.filter(s=>(s.arrivalLog||[]).length).forEach(s=>{
          (s.arrivalLog||[]).forEach(log=>{
            const diff = (toMin(log.actual)!=null&&toMin(log.scheduled)!=null)
              ? toMin(log.actual)-toMin(log.scheduled) : '';
            const status = diff===''?'':diff>10?'Late':diff>0?'Slightly late':diff<-5?'Early':'On time';
            sh4.push([s.name, s.department||'', log.date||'', log.scheduled||'', log.actual||'', diff, status]);
          });
        });

        // ── Sheet 5: Callout History ──────────────────────────────────────
        const sh5 = [['Name','Department','Area','Supervisor','Total Callouts','Callout Dates']];
        state.staff.filter(s=>s.active!==false&&((state.calloutHistory||{})[s.id]||[]).length>0)
          .sort((a,b)=>((state.calloutHistory||{})[b.id]?.length||0)-((state.calloutHistory||{})[a.id]?.length||0))
          .forEach(s=>{
            const hist = (state.calloutHistory||{})[s.id]||[];
            const area = getAreaById(state.assignments[s.id]);
            const sup  = getSupervisorById(s.supervisorId);
            sh5.push([s.name, s.department||'', area?.name||'', sup?.name||'', hist.length, hist.map(h=>h.date||h).join(', ')]);
          });

        // ── Sheet 6: Position Requests ────────────────────────────────────
        const sh6 = [['Name','Department','Supervisor','From Area','To Area','Reason','Status','Submitted']];
        state.staff.filter(s=>s.active!==false&&(s.positionRequests||[]).length).forEach(s=>{
          const sup = getSupervisorById(s.supervisorId);
          (s.positionRequests||[]).forEach(r=>{
            sh6.push([
              s.name, s.department||'', sup?.name||'',
              getAreaById(r.fromArea)?.name||'', getAreaById(r.toArea)?.name||'',
              r.reason||'', r.status||'pending', r.date||''
            ]);
          });
        });

        // ── Sheet 7: Scheduled Time Off ───────────────────────────────────
        const sh7 = [['Name','Department','Start Date','End Date','Label','Coverage Person','Coverage Area']];
        state.staff.forEach(s=>{
          ((state.timeOff||{})[s.id]||[]).forEach(r=>{
            const cov = r.coverageStaffId ? getStaffById(r.coverageStaffId) : null;
            const covArea = cov ? getAreaById(state.assignments[cov.id]) : null;
            sh7.push([s.name, s.department||'', r.startDate||'', r.endDate||'', r.label||'', cov?.name||'', covArea?.name||'']);
          });
        });

        // ── Build workbook HTML (multi-sheet XLS) ─────────────────────────
        const sheets = [
          {name:'Staff Report',       rows:sh1},
          {name:'Area Utilization',   rows:sh2},
          {name:'Activity Log',       rows:sh3},
          {name:'Arrival Times',      rows:sh4},
          {name:'Callout History',    rows:sh5},
          {name:'Position Requests',  rows:sh6},
          {name:'Time Off',           rows:sh7},
        ].filter(s=>s.rows.length>1); // skip empty sheets

        // Build each sheet as an HTML table with a named WorksheetOptions tag
        let body = '';
        sheets.forEach(sheet=>{
          body += '<ss:Worksheet ss:Name="'+esc(sheet.name)+'">';
          body += '<ss:Table>';
          sheet.rows.forEach((row,ri)=>{
            body += '<ss:Row>';
            row.forEach(cell=>{
              const v = cell==null?'':cell;
              const type = typeof v==='number'?'Number':'String';
              const style = ri===0?'s1':'s0';
              body += '<ss:Cell ss:StyleID="'+style+'"><ss:Data ss:Type="'+type+'">'+esc(v)+'</ss:Data></ss:Cell>';
            });
            body += '</ss:Row>';
          });
          body += '</ss:Table></ss:Worksheet>';
        });

        const xml = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>'+
          '<ss:Workbook xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
          '<ss:Styles>'+
            '<ss:Style ss:ID="s0"><ss:Alignment ss:WrapText="0"/></ss:Style>'+
            '<ss:Style ss:ID="s1"><ss:Font ss:Bold="1"/><ss:Interior ss:Color="#2A85FF" ss:Pattern="Solid"/><ss:Font ss:Color="#FFFFFF" ss:Bold="1"/></ss:Style>'+
          '</ss:Styles>'+body+'</ss:Workbook>';

        const blob = new Blob([xml], {type:'application/vnd.ms-excel;charset=utf-8'});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = 'schedule-report-'+today+'.xls';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
        showToast('Excel downloaded — '+sheets.length+' sheets', 'teal');
      } catch(err){
        console.error('Excel export error:', err);
        showToast('Export error: '+err.message, 'rust');
      }
    });;

    // Section checkbox toggles
    document.querySelectorAll('.rp-check').forEach(cb=>cb.addEventListener('change',()=>{
      const newSecs = {...secs, [cb.dataset.sec]: cb.checked};
      openModal({type:'report-preview', sections:newSecs, previewPage:m.previewPage, orient:m.orient, showTimes:m.showTimes, showBreaks:m.showBreaks, showSeniority:m.showSeniority});
      render();
    }));

    // Click entire row to toggle section
    document.querySelectorAll('.rp-section-toggle').forEach(row=>{
      row.addEventListener('click', e=>{
        if(e.target.closest('.rp-preview-btn')) return; // handled separately
        const sec = row.querySelector('.rp-check')?.dataset.sec;
        if(!sec) return;
        const newSecs = {...secs, [sec]: !secs[sec]};
        openModal({type:'report-preview', sections:newSecs, previewPage:m.previewPage, orient:m.orient});
        render();
      });
    });

    // Preview buttons
    document.querySelectorAll('.rp-preview-btn').forEach(btn=>btn.addEventListener('click', e=>{
      e.stopPropagation();
      const pg = btn.dataset.preview;
      if(!secs[pg]){ showToast('Enable this section first', 'rust'); return; }
      openModal({type:'report-preview', sections:secs, previewPage: m.previewPage===pg?null:pg, orient:m.orient});
      render();
      // After render, write to iframe
      setTimeout(()=>{
        const iframe = document.getElementById('rp-preview-iframe');
        if(!iframe) return;
        try{
          const {page1,page2,page3,page4,page5,reportCSS} = buildReportHTML(secs, {showTimes:m.showTimes, showBreaks:m.showBreaks, showSeniority:m.showSeniority});
          const pageMap = {board:page1,staff:page2,certs:page3,timeoff:page4,activity:page5,supervisors:page6,utilization:page7,notes:page8};
          const doc = iframe.contentDocument||iframe.contentWindow.document;
          doc.open();
          doc.write('<!DOCTYPE html><html><head><style>'+reportCSS+' body{padding:12pt;} .page-break{page-break-after:avoid;}</style></head><body>'+pageMap[pg]+'</body></html>');
          doc.close();
        }catch(e){ console.error(e); }
      }, 50);
    }));

    // Close preview
    on('rp-close-preview',()=>{ openModal({type:'report-preview',sections:secs,orient:m.orient}); render(); });

    // Format options — orientation
    document.querySelectorAll('input[name="rp-orient"]').forEach(r=>r.addEventListener('change',()=>{
      openModal({type:'report-preview', sections:secs, previewPage:m.previewPage, orient:r.value,
        showTimes:m.showTimes, showBreaks:m.showBreaks, showSeniority:m.showSeniority});
      render();
    }));

    // Format checkboxes — showTimes / showBreaks / showSeniority
    const showTimesEl   = document.getElementById('rp-show-times');
    const showBreaksEl  = document.getElementById('rp-show-breaks');
    const showSenEl     = document.getElementById('rp-show-seniority');
    function saveFormatPrefs_unused(){
      openModal({type:'report-preview', sections:secs, previewPage:m.previewPage, orient:m.orient,
        showTimes:   showTimesEl?.checked   !== false,
        showBreaks:  showBreaksEl?.checked  !== false,
        showSeniority: showSenEl?.checked   !== false,
      });
      render();
    }
    const showAccomEl = document.getElementById('rp-show-accom');
    function saveFormatPrefsAll(){
      openModal({type:'report-preview', sections:secs, previewPage:m.previewPage, orient:m.orient,
        showTimes:   showTimesEl?.checked   !== false,
        showBreaks:  showBreaksEl?.checked  !== false,
        showSeniority: showSenEl?.checked   !== false,
        showAccom:   showAccomEl?.checked   === true,
      });
      render();
    }
    showTimesEl?.addEventListener('change', saveFormatPrefsAll);
    showBreaksEl?.addEventListener('change', saveFormatPrefsAll);
    showSenEl?.addEventListener('change', saveFormatPrefsAll);
    showAccomEl?.addEventListener('change', saveFormatPrefsAll);

    // Download
    on('rp-btn-download',()=>{
      const {parts, reportCSS} = buildReportHTML(secs, {showTimes:m.showTimes, showBreaks:m.showBreaks, showSeniority:m.showSeniority, showAccom:m.showAccom});
      const orient = m.orient||'portrait';
      const orientCSS = orient==='landscape'?'@page{size:landscape;}':'';
      const html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Schedule Report — '+escapeHtml(state.currentPeriod||'')+'</title><style>'+reportCSS+orientCSS+'</style></head><body>'+parts.join('')+'</body></html>';
      const blob = new Blob([html],{type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download='schedule-report-'+(state.currentPeriod||todayLabel())+'.html'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast('Report downloaded','teal');
    });

    // Print
    on('rp-btn-print',()=>{
      const {parts, reportCSS} = buildReportHTML(secs, {showTimes:m.showTimes, showBreaks:m.showBreaks, showSeniority:m.showSeniority});
      const orient = m.orient||'portrait';
      const orientCSS = orient==='landscape'?'@page{size:landscape;}':'';
      const html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Schedule Report</title><style>'+reportCSS+orientCSS+'</style></head><body>'+parts.join('')+'</body></html>';
      const win = window.open('','_blank','width=900,height=700');
      if(win){ win.document.write(html); win.document.close(); win.onload=()=>{ win.focus(); win.print(); }; }
    });
  }

  if(activeModal.type==='rotate-preview'){
    // "Rate now" opens the feedback modal for that staff member
    document.querySelectorAll('[data-open-feedback]').forEach(btn=>btn.addEventListener('click', ()=>{
      const staffId = btn.dataset.openFeedback;
      const sug = computeFlowAdvancement().find(s=>s.staff.id===staffId);
      if(!sug) return;
      openModal({type:'feedback-modal', suggestion:sug, step:'teamlead', tlRating:0, supRating:0});
    }));

    // live-update the schedule preview (computed end date) as weeks/start-date change
    const periodInputEl = document.getElementById('new-period-input');
    const weeksInputEl  = document.getElementById('rotation-weeks-input');
    if(periodInputEl) periodInputEl.addEventListener('change', ()=>{
      const val = periodInputEl.value;
      const weeksVal = Number(weeksInputEl?.value)||activeModal.weeks||(Number(state.rotationWeeks)||2);
      openModal({...activeModal, type:'rotate-preview', startDate: val, weeks: weeksVal});
    });
    if(weeksInputEl) weeksInputEl.addEventListener('change', ()=>{
      const weeksVal = Number(weeksInputEl.value)||2;
      const val = periodInputEl?.value || activeModal.startDate || nextPeriodLabel();
      openModal({...activeModal, type:'rotate-preview', startDate: val, weeks: weeksVal});
    });

    on('confirm-rotate-preview-btn', async ()=>{
      const startDate = document.getElementById('new-period-input').value.trim() || nextPeriodLabel();
      const weeks = Number(document.getElementById('rotation-weeks-input')?.value) || (Number(state.rotationWeeks)||2);
      const newLabel = startDate;
      const prevStart = state.rotationStartDate || state.currentPeriod;
      const notesVal = document.getElementById('rotation-notes-input')?.value?.trim();
      // Snapshot the CLOSING period exactly as it stands right now — this is
      // what gets sent to Supabase (rotation_periods + a
      // rotation_period_assignments row per staff) AND pushed into local
      // state.history, before any of the advancement moves below change it.
      const closingLabel = state.currentPeriod;
      const closingWeeks = Number(state.rotationWeeks)||2;
      const closingSnapshot = Object.assign({}, state.assignments);

      const btn = document.getElementById('confirm-rotate-preview-btn');
      if(btn){ btn.disabled=true; btn.textContent='Saving…'; }

      const sync = await syncCrudWrite(()=>window.RC.createRotationPeriod({
        periodLabel: closingLabel, startDate: prevStart, endDate: todayLabel(), weeks: closingWeeks,
        notes: notesVal || null, actingAccountId: authState.account.id, assignments: closingSnapshot,
      }));

      state.history.push({
        period: closingLabel,
        assignments: closingSnapshot,
        startDate: prevStart,
        endDate: todayLabel(),
        weeks: closingWeeks,
      });
      const suggestions = computeFlowAdvancement();
      let advCount=0, compCount=0, blockedCount=0;
      suggestions.forEach(sug=>{
        if(sug.type==='advance' && sug.toAreaId){
          const pf = sug.pendingFeedback;
          // skip if explicitly blocked
          if(pf && pf.status==='blocked'){ blockedCount++; return; }
          // save proficiency rating if feedback was collected
          if(pf && (pf.status==='approved'||pf.status==='override')){
            saveAreaRating(sug.staff.id, sug.fromAreaId, {
              period: state.currentPeriod,
              teamLeadRating: pf.teamLeadRating||0, teamLeadId: pf.teamLeadId||'',
              teamLeadNote: pf.teamLeadNote||'', supervisorRating: pf.supervisorRating||0,
              supervisorId: pf.supervisorId||'', supervisorApproved: true,
              overrideReason: pf.overrideReason||''
            });
          }
          const area = getAreaById(sug.toAreaId);
          const already = staffInArea(sug.toAreaId, sug.staff.id).length;
          if(!area || already < area.capacity){
            const fromArea = getAreaById(sug.fromAreaId);
            state.assignments[sug.staff.id] = sug.toAreaId;
            syncBoardWrite(()=>window.RC.moveStaff({
              staffId: sug.staff.id, areaId: sug.toAreaId, actingAccountId: authState.account.id,
              staffName: sug.staff.name, fromAreaName: fromArea?.name, toAreaName: area.name,
            }), 'move');
            advCount++;
          }
        }
        if(sug.type==='complete'){
          const s = getStaffById(sug.staff.id);
          if(s){ s.flowEnrolled = false; compCount++; }
        }
      });
      // clear pending feedback
      // save supervisor notes for this period
      if(notesVal) state.rotationNotes[state.currentPeriod] = notesVal;
      endAllCoverage(); // return all coverage staff before snapshotting
      state.pendingFeedback = [];
      state.currentPeriod = newLabel;
      state.rotationStartDate = startDate;
      state.rotationWeeks = weeks;
      state.callouts = {};
      applyScheduledTimeOff(); // auto-callout anyone with scheduled time off today
      saveState();
      closeModal();
      const summary = `Period ${newLabel} started (${weeks}wk rotation) · ${advCount} advanced${blockedCount?` · ${blockedCount} blocked`:''}${compCount?` · ${compCount} complete`:''}`;
      showToast(sync.ok ? `${summary} — saved to database ✓` : `${summary} — not saved to the database: ${sync.error?.message||'try again'}`, sync.ok?'teal':'rust');
    });
  }

  if(activeModal.type==='feedback-modal'){
    const m = activeModal;
    const sug = m.suggestion;

    // star buttons
    document.querySelectorAll('.star-btn').forEach(btn=>btn.addEventListener('click', ()=>{
      const val = parseInt(btn.dataset.star,10);
      const prefix = btn.dataset.prefix;
      if(prefix==='tl'){
        openModal({...m, tlRating:val});
      } else {
        openModal({...m, supRating:val});
      }
    }));

    // team lead → next step
    on('feedback-tl-next', ()=>{
      const note = document.getElementById('tl-note-input')?.value||'';
      openModal({...m, step:'supervisor', tlRating:m.tlRating, tlNote:note});
    });

    // supervisor approve
    on('feedback-approve', ()=>{
      const supRating = m.supRating;
      const overrideNote = document.getElementById('override-note-input')?.value||'';
      const avgRating = (m.tlRating+supRating)/2;
      const status = (avgRating>=3||overrideNote) ? (avgRating<3?'override':'approved') : 'approved';
      // save to pendingFeedback
      const existing = state.pendingFeedback.findIndex(f=>f.staffId===sug.staff.id&&f.areaId===sug.fromAreaId);
      const entry = {staffId:sug.staff.id, areaId:sug.fromAreaId, toAreaId:sug.toAreaId,
        teamLeadRating:m.tlRating, teamLeadId:'', teamLeadNote:m.tlNote||'',
        supervisorRating:supRating, supervisorId:'', supervisorApproved:true,
        overrideReason:overrideNote, status};
      if(existing>=0) state.pendingFeedback[existing]=entry;
      else state.pendingFeedback.push(entry);
      saveState();
      openModal({type:'rotate-preview'});
    });

    // supervisor block
    on('feedback-block', ()=>{
      const existing = state.pendingFeedback.findIndex(f=>f.staffId===sug.staff.id&&f.areaId===sug.fromAreaId);
      const entry = {staffId:sug.staff.id, areaId:sug.fromAreaId, toAreaId:sug.toAreaId,
        teamLeadRating:m.tlRating, teamLeadNote:m.tlNote||'', supervisorRating:m.supRating,
        supervisorApproved:false, overrideReason:'', status:'blocked'};
      if(existing>=0) state.pendingFeedback[existing]=entry;
      else state.pendingFeedback.push(entry);
      // save proficiency even for blocks so the rating is recorded
      saveAreaRating(sug.staff.id, sug.fromAreaId, {...entry, period:state.currentPeriod, supervisorId:''});
      saveState();
      openModal({type:'rotate-preview'});
    });

    // skip
    on('feedback-skip', ()=>openModal({type:'rotate-preview'}));
  }

  // --- evaluations: queue ---
  if(activeModal.type==='eval-queue'){
    document.querySelectorAll('[data-open-eval-form]').forEach(el=>el.addEventListener('click', ()=>{
      openModal({type:'eval-form',
        staffId: el.dataset.openEvalForm,
        areaId: el.dataset.evalArea || null,
        periodId: el.dataset.evalPeriod || null,
        productivity: Number(el.dataset.evalProd)||0,
        performance: Number(el.dataset.evalPerf)||0,
        reliability: Number(el.dataset.evalRel)||0,
        recommendation: el.dataset.evalRec || 'stay',
        note: el.dataset.evalNote || '',
        reviewNote: el.dataset.evalReviewNote || '',
        _returnModal:{type:'eval-queue'}});
    }));
  }

  // --- evaluations: score form ---
  if(activeModal.type==='eval-form'){
    const m = activeModal;
    // Every score/recommendation click re-renders the whole modal — snapshot
    // whatever's currently typed in the note field first, or it gets wiped
    // (same class of bug as the staff-manager tab-switch issue fixed
    // earlier: a click handler re-rendering from stale `m` state clobbers
    // whatever the DOM has that `m` doesn't know about yet).
    const captureNote = () => {
      const el = document.getElementById('eval-note-input');
      return el ? el.value : m.note;
    };
    document.querySelectorAll('.score-scale-btn').forEach(btn=>btn.addEventListener('click', ()=>{
      const key = btn.dataset.scoreKey;
      const val = parseInt(btn.dataset.scoreVal,10);
      openModal({...m, note:captureNote(), [key]:val});
    }));
    document.querySelectorAll('[data-rec-opt]').forEach(el=>el.addEventListener('click', ()=>{
      openModal({...m, note:captureNote(), recommendation:el.dataset.recOpt});
    }));
    on('eval-form-cancel', ()=>{
      if(m._returnModal && m._returnModal.type==='eval-queue') openEvalQueue();
      else if(m._returnModal) openModal(m._returnModal);
      else closeModal();
    });
    on('eval-form-submit', async ()=>{
      if(!(m.productivity>0 && m.performance>0 && m.reliability>0) || m.saving) return;
      const note = captureNote()||'';
      const recommendation = m.recommendation||'stay';
      openModal({...m, saving:true});
      const isManager = authState.account.role!=='team_lead';
      const sync = await syncCrudWrite(()=>window.RC.submitEvaluation({
        staffId: m.staffId,
        periodId: m.periodId||null,
        areaId: m.areaId||null,
        evaluatorId: authState.account.id,
        productivity: m.productivity,
        performance: m.performance,
        reliability: m.reliability,
        note,
        recommendation,
        isManager,
      }));
      if(sync.ok){
        showToast(isManager ? 'Evaluation saved to database ✓' : 'Evaluation sent to your supervisor for review ✓', 'teal');
        if(m._returnModal && m._returnModal.type==='eval-queue') openEvalQueue();
        else if(m._returnModal) openModal(m._returnModal);
        else closeModal();
      } else {
        showToast(`Not saved to the database: ${sync.error?.message||'try again'}`, 'rust');
        openModal({...m, saving:false, note});
      }
    });
  }

  // --- staff import (Excel/CSV) ---
  if(activeModal.type==='staff-import'){
    const m = activeModal;

    if(m.step==='pick' || !m.step){
      on('import-download-template', downloadStaffImportTemplate);
      const fileInput = document.getElementById('staff-import-file');
      if(fileInput) fileInput.addEventListener('change', async ()=>{
        const file = fileInput.files[0];
        if(!file) return;
        try{
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false});
          if(rows.length===0){ openModal({...m, error:'No rows found in that file.'}); return; }
          const headers = Object.keys(rows[0]);
          const mapping = autoDetectStaffImportMapping(headers);
          openModal({type:'staff-import', step:'preview', fileName:file.name, headers, rawRows:rows, mapping});
        }catch(e){
          openModal({...m, error:'Could not read that file: '+((e&&e.message)||'unknown error')});
        }
      });
    }

    if(m.step==='preview'){
      STAFF_IMPORT_FIELDS.forEach(key=>{
        const sel = document.getElementById('map-'+key);
        if(sel) sel.addEventListener('change', ()=>{
          openModal({...m, mapping:{...m.mapping, [key]:sel.value}});
        });
      });
      on('import-back-btn', ()=>openModal({type:'staff-import', step:'pick'}));
      on('import-confirm-btn', async ()=>{
        const toImport = buildStaffImportPreview(m.rawRows, m.mapping).filter(r=>!r.error);
        openModal({type:'staff-import', step:'importing', progress:{done:0, total:toImport.length}});
        const created = [], updated = [], failed = [];
        for(const row of toImport){
          const isUpdate = !!row.existingId;
          const existing = isUpdate ? getStaffById(row.existingId) : null;
          const sync = await syncCrudWrite(async ()=>{
            const departmentId = row.department ? await window.RC.ensureDepartment(row.department) : null;
            if(isUpdate){
              return window.RC.updateStaff({
                staffId: existing.id, name: row.name, tdisNumber: row.tdisNumber, departmentId, homeAreaId: existing.homeAreaId||null,
                isTeamLead: row.isTeamLead, isSubcontractor: row.isSubcontractor, needsAccommodations: row.needsAccommodations, tags: row.tags,
                shiftHoursLabel: row.shiftHours, breakTimesLabel:'', counterCert: row.counterCert, hireDate: row.hireDate,
                actingAccountId: authState.account.id,
              });
            }
            return window.RC.createStaff({
              name: row.name, tdisNumber: row.tdisNumber, departmentId, homeAreaId:null,
              isTeamLead: row.isTeamLead, isSubcontractor: row.isSubcontractor, needsAccommodations: row.needsAccommodations, tags: row.tags,
              shiftHoursLabel: row.shiftHours, breakTimesLabel:'', counterCert: row.counterCert, hireDate: row.hireDate,
              actingAccountId: authState.account.id,
            });
          });
          if(sync.ok){
            if(isUpdate){
              Object.assign(existing, {name: row.name, tdisNumber: row.tdisNumber, department: row.department||existing.department,
                shiftHours: row.shiftHours||existing.shiftHours, isTeamLead: row.isTeamLead, isSubcontractor: row.isSubcontractor,
                needsAccommodations: row.needsAccommodations, tags: row.tags||existing.tags, counterCert: row.counterCert,
                hireDate: row.hireDate||existing.hireDate});
              updated.push(existing);
            } else {
              const newStaff = {id: sync.result.id, name: row.name, tdisNumber: row.tdisNumber, tags: row.tags, department: row.department, active:true,
                shiftHours: row.shiftHours, breakTimes:'', isTeamLead: row.isTeamLead, homeAreaId:null, supervisorId:null, flowId:null, flowEnrolled:false,
                needsAccommodations: row.needsAccommodations, counterCert: row.counterCert, hireDate: row.hireDate, isSubcontractor: row.isSubcontractor, languageCerts:[]};
              state.staff.push(newStaff); state.assignments[newStaff.id]=null;
              created.push(newStaff);
            }
          } else {
            failed.push({name: row.name, error: (sync.error&&sync.error.message)||'Save failed'});
          }
          openModal({type:'staff-import', step:'importing', progress:{done:created.length+updated.length+failed.length, total:toImport.length}});
        }
        saveState();
        openModal({type:'staff-import', step:'done', results:{created, updated, failed}});
      });
    }

    on('import-done-btn', ()=>{ closeModal(); openModal({type:'staff-manager'}); });
  }

  // --- manage accounts ---
  if(activeModal.type==='manage-accounts'){
    on('btn-add-account', ()=>{
      openModal({type:'account-grant-form', mode:'create', accountId:null, name:'', role:'team_lead', assignedAreaId:null, pin:''});
    });
    document.querySelectorAll('[data-grant-account]').forEach(el=>el.addEventListener('click', ()=>{
      openModal({type:'account-grant-form', mode:'grant', accountId:el.dataset.grantAccount, name:el.dataset.grantName, role:'team_lead', assignedAreaId:null, pin:''});
    }));
    document.querySelectorAll('[data-edit-account]').forEach(el=>el.addEventListener('click', ()=>{
      openModal({type:'account-grant-form', mode:'edit', accountId:el.dataset.editAccount, name:el.dataset.editName,
        role:el.dataset.editRole||'team_lead', assignedAreaId:el.dataset.editArea||null, pin:''});
    }));
    document.querySelectorAll('[data-restore-account]').forEach(el=>el.addEventListener('click', ()=>{
      openModal({type:'account-grant-form', mode:'restore', accountId:el.dataset.restoreAccount, name:el.dataset.restoreName,
        role:el.dataset.restoreRole||'team_lead', assignedAreaId:el.dataset.restoreArea||null, pin:''});
    }));
    document.querySelectorAll('[data-revoke-account]').forEach(el=>el.addEventListener('click', async e=>{

  // --- audit log ---
  if(activeModal.type==='audit-log'){
    const m = activeModal;
    const searchInput = document.getElementById('audit-search');
    if(searchInput){
      searchInput.addEventListener('input', e=>{
        m.search = e.target.value;
        const focused = document.activeElement === searchInput;
        render();
        if(focused){
          const el = document.getElementById('audit-search');
          if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
      });
    }
    on('audit-search-clear', ()=>{ openModal({...m, search:''}); });
    const actionFilterSel = document.getElementById('audit-action-filter');
    if(actionFilterSel) actionFilterSel.addEventListener('change', ()=>{ openModal({...m, actionFilter:actionFilterSel.value}); });
    const dateFilterInput = document.getElementById('audit-date-filter');
    if(dateFilterInput) dateFilterInput.addEventListener('change', ()=>{ openModal({...m, dateFilter:dateFilterInput.value}); });

  // --- team dashboard ---

        const focused = document.activeElement === searchInput;

        if(focused){
          const el = document.getElementById('team-dash-search');
          if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

    }

    }));

    on('confirm-reject-btn', async ()=>{

      if(roleSel) roleSel.addEventListener('change', ()=>{

      if(areaSel) areaSel.addEventListener('change', ()=>{ activeModal.assignedAreaId = areaSel.value; });

      const pinIsValid = p => pinRequired ? /^\d{4}$/.test(p) : (p==='' || /^\d{4}$/.test(p));
      const pinInput = document.getElementById('grant-pin-input');
      if(pinInput) pinInput.addEventListener('input', ()=>{

      on('grant-submit-btn', async ()=>{
        const name = (nameInput?nameInput.value:m.name).trim();
        const role = roleSel?roleSel.value:m.role;
        const assignedAreaId = role==='team_lead' ? (areaSel?areaSel.value:m.assignedAreaId) : null;
        const pin = pinInput?pinInput.value:m.pin;
        if(!name || !pinIsValid(pin) || (role==='team_lead'&&!assignedAreaId)) return;

      });

    on('reset-cancel-btn', closeModal);
    on('reset-confirm-btn', async ()=>{
      const copy = RESET_CONFIRM_COPY[m.kind];
      if((m.typed||'').trim()!==copy.phrase || m.saving) return;
      openModal({...m, saving:true});
      let sync;
      if(m.kind==='flows'){
        sync = await syncCrudWrite(()=>window.RC.resetRotationFlows({actingAccountId:authState.account.id}));
        if(sync.ok){
          state.rotationFlows = [];
          state.staff.forEach(s=>{ s.flowId=null; s.flowEnrolled=false; });
        }
      } else if(m.kind==='areas'){
        sync = await syncCrudWrite(()=>window.RC.resetAreasAndDepartments({actingAccountId:authState.account.id}));

        showToast(copy.title+' — saved to database ✓', 'teal');

        showToast(`Could not reset — ${sync.error?.message||'try again'}`, 'rust');

  // --- flow editor modal ---
  if(activeModal.type==='flow-editor'){

    const currentStages = activeModal.stages || (editingFlow?[...editingFlow.stages]:[]);

    document.querySelectorAll('.swatch-pick').forEach(el=>el.addEventListener('click', ()=>{

      colorInput.value = el.dataset.color;

      render();
    }));

    document.querySelectorAll('[data-edit-stage],.fe-stage-edit-btn').forEach(el=>el.addEventListener('click', e=>{

      if(isNaN(idx)) return;
      const st = currentStages[idx];
      const newReq = parseInt(prompt(`Rotations at "${st.label||getAreaById(st.areaId)?.name||'?'}" (current: ${st.requiredRotations}):`, st.requiredRotations),10);
      if(!newReq || isNaN(newReq)) return;
      const newStages = currentStages.map((s,i)=>i===idx?{...s,requiredRotations:newReq}:s);
      openModal({type:'flow-editor', editId:activeModal.editId, stages:newStages, color:activeModal.color});
      render();
    }));

    // ── Drag-to-reorder flow stages ─────────────────────────────────────
    let _dragStageSrc = null;
    document.querySelectorAll('.flow-tl-item,.fe-stage').forEach(item=>{
      item.addEventListener('dragstart', e=>{
        _dragStageSrc = parseInt(item.dataset.stageIdx, 10);
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', ()=>{
        item.classList.remove('dragging');
        document.querySelectorAll('.flow-tl-item').forEach(i=>i.classList.remove('drag-over'));
        _dragStageSrc = null;
      });
      item.addEventListener('dragover', e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.flow-tl-item').forEach(i=>i.classList.remove('drag-over'));
        if(_dragStageSrc !== parseInt(item.dataset.stageIdx,10))
          item.classList.add('drag-over');
      });
      item.addEventListener('drop', e=>{
        e.preventDefault();
        const target = parseInt(item.dataset.stageIdx, 10);
        if(_dragStageSrc === null || _dragStageSrc === target) return;
        const reordered = [...currentStages];
        const [moved] = reordered.splice(_dragStageSrc, 1);
        reordered.splice(target, 0, moved);
        openModal({type:'flow-editor', editId:activeModal.editId, stages:reordered, color:activeModal.color});
        render();
      });
    });

    on('flow-cancel-btn', ()=>{ closeModal(); });
    on('flow-save-btn', async ()=>{
      const name = document.getElementById('flow-name-input').value.trim();
      const color = document.getElementById('flow-color-input').value;
      if(!name){ showToast('Enter a flow name','rust'); return; }
      if(currentStages.length===0){ showToast('Add at least one stage','rust'); return; }
      if(editingFlow){
        const sync = await syncCrudWrite(()=>window.RC.updateRotationFlow({flowId: editingFlow.id, name, color, stages: currentStages}));
        editingFlow.name=name; editingFlow.color=color; editingFlow.stages=currentStages;
        showToast(sync.ok ? 'Flow updated — saved to database ✓' : `Saved here, but not to the database — ${sync.error?.message||'try again'}`, sync.ok?'teal':'rust');
      } else {
        const sync = await syncCrudWrite(()=>window.RC.createRotationFlow({name, color, stages: currentStages}));
        state.rotationFlows.push({id: sync.ok ? sync.result.id : uid('flow'), name, color, stages:currentStages});
        showToast(sync.ok ? 'Flow added — saved to database ✓' : `Added here, but not saved to the database — ${sync.error?.message||'try again'}`, sync.ok?'teal':'rust');
      }
      saveState();
      openModal({type:'flow-manager'});
      render();
    });

    on('flow-delete-btn', async ()=>{
      const id = activeModal.editId;
      const sync = await syncCrudWrite(()=>window.RC.deleteRotationFlow({flowId:id}));
      state.rotationFlows = state.rotationFlows.filter(f=>f.id!==id);
      state.staff.forEach(s=>{ if(s.flowId===id){ s.flowId=null; s.flowEnrolled=false; } });
      saveState();
      showToast(sync.ok ? 'Flow deleted — saved to database ✓' : `Deleted here, but not saved to the database — ${sync.error?.message||'try again'}`, sync.ok?'teal':'rust');
      openModal({type:'flow-manager'});
    });
  }
}

// ── Streak: how many consecutive rotations at current area ──
function getRepeatStreak(staffId){
  const currentArea = state.assignments[staffId];
  if(!currentArea) return 0;
  let streak = 0;
  for(let i=state.history.length-1;i>=0;i--){
    if(state.history[i].assignments[staffId]===currentArea) streak++;
    else break;
  }
  return streak;
}

// ── Coverage gap: is an area below its target minimum? ──
// We treat min as ceil(capacity/2) — half or more staffed = OK
function isUnderStaffed(areaId){
  const area = getAreaById(areaId);
  if(!area || area.fixed) return false;
  const count = activeInArea(areaId).length;
  const min   = Math.max(1, Math.ceil(area.capacity/2));
  return count < min;
}

// ── Quick swap: swap two staff members between their current areas ──
function doSwap(idA, idB){
  const areaA = state.assignments[idA];
  const areaB = state.assignments[idB];
  const nameA = getStaffById(idA)?.name||'?';
  const nameB = getStaffById(idB)?.name||'?';
  state.assignments[idA] = areaB;
  state.assignments[idB] = areaA;
  logDailyEvent('swap', idA, areaA, areaB, `Swapped with ${getStaffById(idB)?.name||'?'}`);
  logDailyEvent('swap', idB, areaB, areaA, `Swapped with ${getStaffById(idA)?.name||'?'}`);
  swapMode = null;
  saveState();
  syncBoardWrite(()=>window.RC.swapStaff({idA, idB, areaA, areaB, actingAccountId:authState.account.id, nameA, nameB}), 'swap');
  render();
  showToast(`Swapped ${nameA} ↔ ${nameB}`, 'teal');
}

// ── Call-out history helpers ──
// ── Daily activity log ──
function logDailyEvent(type, staffId, fromArea, toArea, note=''){
  if(!state.dailyLog) state.dailyLog = [];
  state.dailyLog.push({
    ts:     new Date().toISOString(),
    date:   todayLabel(),
    period: state.currentPeriod,
    type,       // 'move'|'swap'|'callout'|'return'|'coverage'|'time-off'
    staffId,
    fromArea,
    toArea,
    note,
  });
  // Keep last 500 events to avoid unbounded growth
  if(state.dailyLog.length > 500) state.dailyLog = state.dailyLog.slice(-500);
}

function logCallout(staffId, reason=''){
  if(!state.calloutHistory[staffId]) state.calloutHistory[staffId]=[];
  state.calloutHistory[staffId].push({date:todayLabel(), period:state.currentPeriod, reason});
  saveState();
}


// ── Coverage helpers ──
// state.coverage is synced now (0007_coverage_sync.sql) — assignCoverage()/
// returnFromCoverage() mutate local state immediately (same "don't block
// the UI on network latency" pattern as every other board write) and fire
// the Supabase write in the background via syncBoardWrite, covering both
// the coverage_assignments row and the actual board-position move.
function assignCoverage(staffId, coverAreaId){
  const returnTo = state.assignments[staffId];
  state.coverage[staffId] = {returnToAreaId: returnTo, date: todayLabel()};
  state.assignments[staffId] = coverAreaId;
  logDailyEvent('coverage', staffId, returnTo, coverAreaId, `Coverage assigned for ${getAreaById(coverAreaId)?.name||'?'}`);
  saveState(); render();
  const name = getStaffById(staffId)?.name||'?';
  const area = getAreaById(coverAreaId)?.name||'?';
  showToast(`${name} covering ${area} — returns automatically tomorrow`, 'teal');
  syncBoardWrite(()=>window.RC.assignCoverage({
    staffId, coverAreaId, returnToAreaId: returnTo, actingAccountId: authState.account.id,
    staffName: name, coverAreaName: area,
  }), 'coverage assign');
}

function returnFromCoverage(staffId){
  const cov = state.coverage[staffId];
  if(!cov) return;
  logDailyEvent('return', staffId, state.assignments[staffId], cov.returnToAreaId, 'Returned from coverage');
  state.assignments[staffId] = cov.returnToAreaId||null;
  delete state.coverage[staffId];
  saveState(); render();
  showToast(`${getStaffById(staffId)?.name||'?'} returned to original area`, 'teal');
  syncBoardWrite(()=>window.RC.returnFromCoverage({
    staffId, returnToAreaId: cov.returnToAreaId||null, actingAccountId: authState.account.id,
    staffName: getStaffById(staffId)?.name,
  }), 'coverage return');
}

// Whoever's covering `areaId` should go back to their own regular area the
// moment nobody assigned there is still out — whether that's because a
// manager just marked someone back in, or because a scheduled leave
// reached its end date. Only returns if there's no one else still out in
// the same area, since one coverer is tracked per area, not per person.
function maybeReturnCoverageFor(areaId){
  if(!areaId) return;
  const stillOut = state.staff.some(s => state.assignments[s.id]===areaId && state.callouts[s.id]);
  if(stillOut) return;
  const covererId = Object.keys(state.coverage||{}).find(cid=>state.assignments[cid]===areaId);
  if(covererId) returnFromCoverage(covererId);
}

function endAllCoverage(){
  // Called at Rotate Now — returns all coverage staff to their original areas
  Object.keys(state.coverage).forEach(sid => {
    const cov = state.coverage[sid];
    state.assignments[sid] = cov.returnToAreaId||null;
    syncBoardWrite(()=>window.RC.returnFromCoverage({
      staffId: sid, returnToAreaId: cov.returnToAreaId||null, actingAccountId: authState.account.id,
      staffName: getStaffById(sid)?.name,
    }), 'coverage return');
  });
  state.coverage = {};
}

// Shared by the Time Off screen's coverage-assignment UI (best-fit
// suggestion card, "Others…" dropdown, and the equivalent controls in the
// per-person detail view) — links a time-off entry to whoever is covering
// it, and if that absence is already in effect today, also performs the
// actual board move via assignCoverage() (which handles its own sync).
function applyTimeOffCoverage(sid, rid, covId){
  const entry = (state.timeOff[sid]||[]).find(r=>r.id===rid);
  if(!entry) return;
  entry.coverageStaffId = covId;
  syncBoardWrite(()=>window.RC.setTimeOffCoverage({timeOffId:rid, coveringStaffId:covId}), 'time off coverage');
  const today = todayLabel();
  if(today>=entry.startDate && today<=entry.endDate){
    if(!state.callouts[sid]) state.callouts[sid] = true;
    const areaId = state.assignments[sid];
    if(areaId && !(state.coverage||{})[covId]){
      assignCoverage(covId, areaId); // handles state.coverage + the move + its own save/toast/sync
      return;
    }
  }
  saveState();
  const covName = getStaffById(covId)?.name||'?';
  showToast(`${covName} assigned to cover ${getAreaById(state.assignments[sid])?.name||'their area'}`, 'teal');
}

// Clears the coverage link on a time-off entry. Deliberately does NOT
// return the covering person from their board position — same as the
// pre-existing local-only behavior this replaces; the two are separate
// actions (undo the plan vs. undo the actual move) and conflating them
// here would change existing behavior, not just sync it.
function removeTimeOffCoverage(sid, rid){
  const entry = (state.timeOff[sid]||[]).find(r=>r.id===rid);
  if(!entry) return;
  delete entry.coverageStaffId;
  syncBoardWrite(()=>window.RC.setTimeOffCoverage({timeOffId:rid, coveringStaffId:null}), 'time off coverage');
  saveState();
}

// ── Scheduled time off helpers ──
// ── Seniority helpers ──
function seniorityYears(s){
  if(!s.hireDate) return null;
  try{
    const hire = new Date(s.hireDate);
    const now  = new Date();
    const yrs  = (now - hire) / (1000 * 60 * 60 * 24 * 365.25);
    return Math.floor(yrs * 10) / 10; // 1 decimal
  } catch(e){ return null; }
}
function seniorityLabel(s){
  const y = seniorityYears(s);
  if(y === null) return null;
  if(y < 1) return Math.round(y * 12) + 'mo';
  return y.toFixed(y>=10?0:1) + 'yr';
}
function isSenior(s){
  const y = seniorityYears(s);
  return y !== null && y >= 3; // 3+ years = senior
}
function isVeteran(s){
  const y = seniorityYears(s);
  return y !== null && y >= 7; // 7+ years = veteran
}

function _applyTodayTimeOff(){
  const today = todayLabel();
  if(!state.coverage) state.coverage = {};

  state.staff.forEach(s=>{
    const scheduledOff = isScheduledOut(s.id, today);

    // 1. Mark as out (use 'scheduled' to distinguish from manual callout).
    // Guarded on !state.callouts[s.id], so this only fires once per
    // transition even though _applyTodayTimeOff() runs on every render.
    if(scheduledOff && !state.callouts[s.id]){
      state.callouts[s.id] = 'scheduled';
      if(boardLoadedFromServer) syncBoardWrite(()=>window.RC.setCallout({
        staffId: s.id, actingAccountId: authState.account.id, staffName: s.name, reason: 'Scheduled time off',
      }), 'callout');
    }

    // 2. Move coverage person if assigned, not yet moved, and staff has an area
    if(scheduledOff){
      const areaId = state.assignments[s.id];
      const rec = ((state.timeOff||{})[s.id]||[]).find(r=>
        today>=r.startDate && today<=r.endDate && r.coverageStaffId
      );
      if(rec && areaId){
        const covId = rec.coverageStaffId;
        // Only move if not already in coverage state — same guard keeps
        // this to a single sync per transition.
        if(!state.coverage[covId]){
          const returnTo = state.assignments[covId] || null;
          state.coverage[covId] = {returnToAreaId: returnTo, date: today};
          state.assignments[covId] = areaId;
          if(boardLoadedFromServer){
            const covName = getStaffById(covId)?.name;
            const areaName = getAreaById(areaId)?.name;
            syncBoardWrite(()=>window.RC.assignCoverage({
              staffId: covId, coverAreaId: areaId, returnToAreaId: returnTo, actingAccountId: authState.account.id,
              staffName: covName, coverAreaName: areaName,
            }), 'coverage assign');
          }
        }
      }
    }
  });

  // 3. Scheduled leave that ended yesterday — auto mark the person back in
  // and send whoever covered their area back to regular duties, the same
  // as clicking "Back ✓" manually. Narrowly scoped to endDate===yesterday
  // (not "any past record") so this can't misfire against an unrelated
  // manual callout that happens to share a staff member with old time-off
  // history — it only fires in the one-render window right after a leave
  // actually ends.
  // Mutates state directly instead of calling maybeReturnCoverageFor() /
  // returnFromCoverage() — this whole function runs as the first line of
  // render(), so calling something that itself calls render() here would
  // re-enter render() mid-build, same reason step 2 above mutates
  // state.coverage/state.assignments directly instead of calling
  // assignCoverage().
  const yesterday = yesterdayLabel();
  state.staff.forEach(s=>{
    if(!state.callouts[s.id]) return;          // not out, nothing to reconcile
    if(isScheduledOut(s.id, today)) return;     // still within an active range
    const justEnded = ((state.timeOff||{})[s.id]||[]).some(r=>r.endDate===yesterday);
    if(!justEnded) return;
    const areaId = state.assignments[s.id];
    delete state.callouts[s.id];
    if(boardLoadedFromServer) syncBoardWrite(()=>window.RC.clearCallout({
      staffId: s.id, actingAccountId: authState.account.id, staffName: s.name,
    }), 'callout');
    if(!areaId) return;
    const stillOut = state.staff.some(x => state.assignments[x.id]===areaId && state.callouts[x.id]);
    if(stillOut) return;
    const covererId = Object.keys(state.coverage||{}).find(cid=>state.assignments[cid]===areaId);
    if(!covererId) return;
    const cov = state.coverage[covererId];
    state.assignments[covererId] = cov.returnToAreaId || null;
    delete state.coverage[covererId];
    if(boardLoadedFromServer) syncBoardWrite(()=>window.RC.returnFromCoverage({
      staffId: covererId, returnToAreaId: cov.returnToAreaId||null, actingAccountId: authState.account.id,
      staffName: getStaffById(covererId)?.name,
    }), 'coverage return');
  });
}

function isScheduledOut(staffId, dateStr){
  const offs = (state.timeOff||{})[staffId]||[];
  return offs.some(r => dateStr >= r.startDate && dateStr <= r.endDate);
}

function applyScheduledTimeOff(){
  const today = todayLabel();

  // Step 1: mark out anyone whose scheduled time off includes today
  state.staff.forEach(s=>{
    if(isScheduledOut(s.id, today) && !state.callouts[s.id]){
      state.callouts[s.id] = true;
      if(boardLoadedFromServer) syncBoardWrite(()=>window.RC.setCallout({
        staffId: s.id, actingAccountId: authState.account.id, staffName: s.name, reason: 'Scheduled time off',
      }), 'callout');
    }
  });

  // Step 2: for anyone who is out today AND has a coverageStaffId in their
  //         time-off record, move that person to cover their area on the board
  state.staff.forEach(s=>{
    if(!state.callouts[s.id]) return;  // not out, skip
    const areaId = state.assignments[s.id];
    if(!areaId) return;  // not assigned to an area, nothing to cover

    // Find a time-off record active today that has a coverage person assigned
    const todayRecord = ((state.timeOff||{})[s.id]||[]).find(r=>
      today >= r.startDate && today <= r.endDate && r.coverageStaffId
    );
    if(!todayRecord) return;

    const covId = todayRecord.coverageStaffId;
    // Only apply if they aren't already covering (avoid double-move)
    if((state.coverage||{})[covId]) return;

    // Move coverage person to the area and record their return-to
    if(!state.coverage) state.coverage = {};
    const returnTo = state.assignments[covId];
    state.coverage[covId] = { returnToAreaId: returnTo, date: today };
    state.assignments[covId] = areaId;
    if(boardLoadedFromServer){
      const covName = getStaffById(covId)?.name;
      const areaName = getAreaById(areaId)?.name;
      syncBoardWrite(()=>window.RC.assignCoverage({
        staffId: covId, coverAreaId: areaId, returnToAreaId: returnTo, actingAccountId: authState.account.id,
        staffName: covName, coverAreaName: areaName,
      }), 'coverage assign');
    }
  });
}


function on(id, fn){
  const el = document.getElementById(id);
  if(el) el.addEventListener('click', fn);
}

// ============ BOARD DATA FROM SUPABASE (Phase 2, Step 2) ============
// Maps the Supabase tables' snake_case/relational shape onto the app's
// existing in-memory field names, so the rest of the app (which was written
// against the localStorage shape) doesn't need to change.
// NOTE: state.history/calloutHistory/proficiency/etc. are still
// local-only, so ids referenced there may not line up with these
// Supabase-sourced staff/area ids until the rest of the migration lands —
// expected during a one-slice-at-a-time migration, not a bug to chase now.
// state.coverage is synced (see mapSupabaseBoard()'s coverage field and
// bootApp()/reconcileStaleCoverage() below).
function mapSupabaseBoard(board){
  const deptById = {};
  (board.departments||[]).forEach(d=>{ deptById[d.id] = d.name; });

  const areas = (board.areas||[]).map(a=>({
    id: a.id,
    name: a.name,
    color: a.color,
    capacity: a.capacity,
    department: deptById[a.department_id] || '',
    fixed: false,
  }));

  const langCertsByStaff = {};
  (board.staffLanguageCerts||[]).forEach(row=>{
    if(!langCertsByStaff[row.staff_id]) langCertsByStaff[row.staff_id] = [];
    langCertsByStaff[row.staff_id].push(row.language_id);
  });

  const staff = (board.staff||[]).map(s=>({
    id: s.id,
    name: s.name,
    tags: s.tags || '',
    active: s.active !== false,
    isTeamLead: !!s.is_team_lead,
    homeAreaId: s.home_area_id || null,
    supervisorId: s.supervisor_id || null,
    shiftHours: s.shift_hours_label || '',
    breakTimes: s.break_times_label || '',
    department: deptById[s.department_id] || '',
    flowId: s.flow_id || null,
    flowEnrolled: !!s.flow_enrolled,
    needsAccommodations: !!s.needs_accommodations,
    isSubcontractor: !!s.is_subcontractor,
    tdisNumber: s.tdis_number || '',
    counterCert: !!s.counter_cert,
    hireDate: s.hire_date || '',
    languageCerts: langCertsByStaff[s.id] || [],
  }));

  const assignments = {};
  (board.assignments||[]).forEach(row=>{
    assignments[row.staff_id] = row.area_id || null;
  });

  // board.staff only ever contains active=true rows (loadBoard()'s query
  // filters that server-side) — a callout row left behind for someone who
  // was since archived would otherwise become a "ghost" entry that
  // getStaffById() can't resolve, breaking anything that reads
  // state.callouts directly (the callout banner, "Assign coverage"
  // dashboard). archiveStaff() now cleans its own callout row up, but
  // filter here too as a backstop against any other way a stale one could
  // show up.
  const activeStaffIds = new Set((board.staff||[]).map(s=>s.id));
  const callouts = {};
  (board.callouts||[]).forEach(row=>{
    if(activeStaffIds.has(row.staff_id)) callouts[row.staff_id] = true;
  });

  const supervisors = (board.supervisors||[]).map(sv=>({ id: sv.id, name: sv.name, color: sv.color }));
  const shifts = (board.shifts||[]).map(sh=>({ id: sh.id, label: sh.label, start: sh.start_time, end: sh.end_time }));
  const languages = (board.languages||[]).map(l=>({ id: l.id, name: l.name }));
  const lunchTimes = (board.lunchTimes||[]).map(l=>({ id: l.id, label: l.label, sort_order: l.sort_order }));

  const stagesByFlow = {};
  (board.rotationFlowStages||[]).forEach(st=>{
    if(!stagesByFlow[st.flow_id]) stagesByFlow[st.flow_id] = [];
    stagesByFlow[st.flow_id].push({ id: st.id, areaId: st.area_id, label: st.label || '', requiredRotations: st.min_periods });
  });
  const rotationFlows = (board.rotationFlows||[]).map(f=>({ id: f.id, name: f.name, color: f.color, stages: stagesByFlow[f.id]||[] }));

  const timeOff = {};
  (board.timeOff||[]).forEach(row=>{
    if(!timeOff[row.staff_id]) timeOff[row.staff_id] = [];
    timeOff[row.staff_id].push({
      id: row.id, startDate: row.start_date, endDate: row.end_date, label: row.label || '',
      coverageStaffId: row.covering_staff_id || undefined,
    });
  });

  const blocks = (board.blockedPairs||[]).map(bp=>({ id: bp.id, a: bp.staff_a_id, b: bp.staff_b_id }));

  const coverage = {};
  (board.coverageAssignments||[]).forEach(row=>{
    coverage[row.staff_id] = { returnToAreaId: row.return_to_area_id || null, date: row.started_date };
  });

  return { areas, staff, assignments, callouts, supervisors, shifts, languages, lunchTimes, rotationFlows, timeOff, blocks, coverage };
}

// Coverage auto-returns the next day (assignCoverage()'s "returns
// automatically tomorrow" promise) — this is what actually keeps that
// promise now that coverage is synced: run once after each fresh
// Supabase board load, so it reconciles against the real started_date
// rather than whatever this one device happened to have cached.
function reconcileStaleCoverage(){
  const today = todayLabel();
  Object.keys(state.coverage||{}).forEach(sid=>{
    const cov = state.coverage[sid];
    if(!cov.date || cov.date===today) return;
    state.assignments[sid] = cov.returnToAreaId || null;
    delete state.coverage[sid];
    syncBoardWrite(()=>window.RC.returnFromCoverage({
      staffId: sid, returnToAreaId: cov.returnToAreaId||null, actingAccountId: authState.account.id,
      staffName: getStaffById(sid)?.name,
    }), 'coverage return');
  });
}

// Shared by the initial boot load and every realtime-triggered refresh
// below, so both apply a fresh loadBoard() the same way.
function applyMappedBoard(mapped){
  state.areas = mapped.areas;
  state.staff = mapped.staff;
  state.supervisors = mapped.supervisors;
  state.shifts = mapped.shifts;
  state.lunchTimes = mapped.lunchTimes;
  state.languages = mapped.languages;
  state.rotationFlows = mapped.rotationFlows;
  state.assignments = mapped.assignments;
  state.callouts = mapped.callouts;
  state.timeOff = mapped.timeOff;
  state.blocks = mapped.blocks;
  state.coverage = mapped.coverage;
}

// Runs the existing localStorage/seed boot path (for everything Step 3+
// still owns), then — if a real Supabase board load succeeds — overwrites
// state.areas/state.staff/state.assignments/state.callouts with the live
// Supabase data. Callouts written via setCallout()/clearCallout() land in
// the real `callouts` table (Step 3), so this read-back is what makes a
// mark-out actually survive a page refresh — without it the write would
// silently persist to the database while the UI kept showing whatever
// loadState() produced locally.
async function bootApp(){
  await loadState(); // sets state.loaded=true, calls render() itself

  try{
    if(window.RC && typeof window.RC.loadBoard==='function'){
      const board = await window.RC.loadBoard();
      applyMappedBoard(mapSupabaseBoard(board));
      boardLoadedFromServer = true;
      reconcileStaleCoverage();
      render();
      if(typeof window.RC.subscribeToBoardChanges==='function'){
        window.RC.subscribeToBoardChanges(scheduleRealtimeRefresh);
      }
    }
  }catch(e){
    console.warn('Could not load board data from Supabase — showing local data instead.', e && e.message);
  }

  // Step 4: rotation history — same pattern as the board load above.
  try{
    if(window.RC && typeof window.RC.fetchRotationHistory==='function'){
      state.history = await window.RC.fetchRotationHistory();
      render();
    }
  }catch(e){
    console.warn('Could not load rotation history from Supabase — showing local data instead.', e && e.message);
  }
}

// ============ LIVE SYNC (Supabase Realtime) ============
// Any write anyone makes lands in Postgres; subscribeToBoardChanges() gets
// notified on every insert/update/delete across the board-relevant tables
// (see migration 0010) and calls scheduleRealtimeRefresh() below, which
// just re-runs loadBoard() + applyMappedBoard() — simplest correct option:
// a full board is cheap for this app's scale, and re-deriving state from a
// fresh read sidesteps any risk of subtly misapplying a partial payload.
// Debounced so a burst of changes (e.g. someone dragging several people in
// a row) collapses into one refresh instead of one per row.
let _realtimeRefreshTimer = null;
function scheduleRealtimeRefresh(){
  if(_realtimeRefreshTimer) clearTimeout(_realtimeRefreshTimer);
  _realtimeRefreshTimer = setTimeout(runRealtimeRefresh, 500);
}
async function runRealtimeRefresh(){
  _realtimeRefreshTimer = null;
  // Applying mid-drag would replace the DOM under an in-progress native
  // drag; applying while a modal is open risks wiping unsaved form input
  // (render() rebuilds innerHTML from state, not from live DOM values).
  // Neither is destructive to skip — just try again shortly instead.
  if(activeModal !== null || boardInteractionInProgress){
    _realtimeRefreshTimer = setTimeout(runRealtimeRefresh, 1500);
    return;
  }
  try{
    const board = await window.RC.loadBoard();
    applyMappedBoard(mapSupabaseBoard(board));
    reconcileStaleCoverage();
    saveState();
    render();
  }catch(e){
    console.warn('Realtime board refresh failed:', e && e.message);
  }
}

// ============ INIT ============
(async function initAuth(){
  await waitForRC();
  try{
    if(window.RC && typeof window.RC.getCurrentAccount==='function'){
      const account = await window.RC.getCurrentAccount();
      if(account){
        authState.account = account;
        authState.status = 'signed-in';
        await bootApp();
        return;
      }
    }
  }catch(e){
    console.warn('Session check failed:', e && e.message);
  }
  authState.status = 'signed-out';
  render();
})();
</script>
