  /* Covered */
  .cd-covered-bar{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px 14px;background:#F0FFF4;
  }
  .cd-cov-check{font-size:20px;color:#34C759;font-weight:700;flex-shrink:0;}
  .cd-cov-text{flex:1;min-width:0;}
  .cd-cov-name{font-size:14px;font-weight:700;color:#166534;}
  .cd-cov-sub{font-size:11px;color:#15803D;margin-top:1px;}
  .cd-undo-btn{
    background:none;border:1px solid rgba(255,59,48,.25);
    border-radius:6px;padding:4px 9px;
    font-size:12px;color:var(--c-red);cursor:pointer;flex-shrink:0;
  }

  /* No area */
  .cd-no-area{padding:8px 16px 12px;font-size:12px;color:var(--c-text-3);font-style:italic;}

  /* Candidate cards */
  .cd-cands{padding:0 12px 0;}
  .cd-cand{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;
    border:1.5px solid var(--c-border);
    border-radius:var(--r-md);
    margin-bottom:6px;
    cursor:pointer;
    background:#fff;
    transition:border-color .12s,background .12s;
    position:relative;
  }
  .cd-cand:hover{border-color:var(--c-accent);background:#F5F8FF;}
  .cd-cand.sel{border-color:var(--c-accent);background:#EEF3FC;}
  .cd-cand.best{border-color:#34C759;}
  .cd-cand.best.sel{border-color:var(--c-accent);}
  .cd-cand-av{
    width:36px;height:36px;border-radius:50%;
    background:var(--c-surface-3);color:var(--c-text);
    font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .cd-cand.sel .cd-cand-av{background:var(--c-accent);color:#fff;}
  .cd-cand-body{flex:1;min-width:0;}
  .cd-cand-name{font-size:14px;font-weight:600;color:var(--c-text);letter-spacing:-.01em;}
  .cd-cand-sub{font-size:11px;color:var(--c-text-2);margin-top:2px;}
  .cd-best-tag{
    font-size:10px;font-weight:700;
    background:#E8F5E9;color:#1B5E20;
    padding:2px 7px;border-radius:99px;
    flex-shrink:0;
  }
  .cd-sel-check{font-size:16px;color:var(--c-accent);font-weight:700;flex-shrink:0;}

  /* More toggle */
  .cd-more{padding:0;margin-bottom:6px;}
  .cd-more summary{
    font-size:12px;font-weight:600;color:var(--c-accent);
    padding:6px 2px;cursor:pointer;list-style:none;
  }
  .cd-more summary::-webkit-details-marker{display:none;}

  /* Assign bar */
  .cd-assign-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px 14px;
    gap:10px;
  }
  .cd-assign-who{font-size:13px;color:var(--c-text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cd-assign-btn{flex-shrink:0;}
  .cd-assign-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ── Coverage confirmation screen ── */
  .confirm-cov-avatar{
    width:56px;height:56px;border-radius:50%;
    background:var(--c-accent);color:#fff;
    font-size:22px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
  }
  .confirm-cov-name{font-size:20px;font-weight:700;color:var(--c-text);margin-bottom:6px;letter-spacing:-.02em;}
  .confirm-cov-desc{font-size:15px;color:var(--c-text);line-height:1.5;margin-bottom:4px;}
  .confirm-cov-sub{font-size:12px;color:var(--c-text-2);margin-top:8px;}

  /* ── Callout dashboard ── */
  .dash-person-section{
    margin-bottom:16px;
    border:1px solid var(--c-border);
    border-radius:var(--r-md);
    overflow:hidden;
  }
  .dash-person-section.is-covered{border-color:#34C759;}
  .dash-person-section.needs-cover{border-color:#FF9500;}
  .dash-person-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;
    background:var(--c-surface-2);
    border-bottom:1px solid var(--c-border);
    gap:8px;
  }
  .dash-person-info{display:flex;align-items:baseline;gap:6px;}
  .dash-person-name{font-size:15px;font-weight:700;color:var(--c-text);}
  .dash-person-area{font-size:12px;color:var(--c-text-2);}
  .dash-covered-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    background:#F0FFF4;
  }
  .dash-covered-icon{font-size:18px;color:#34C759;font-weight:700;flex-shrink:0;}
  .dash-covered-text{flex:1;min-width:0;}
  .dash-covered-name{font-size:14px;font-weight:600;color:#166534;display:block;}
  .dash-covered-sub{font-size:12px;color:#15803D;display:block;}
  .dash-pick-label{
    padding:8px 14px 4px;
    font-size:12px;font-weight:600;
    color:var(--c-text-2);letter-spacing:.02em;
  }
  .dash-pick-badge{
    font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:99px;
    flex-shrink:0;
  }
  .dash-pick-badge.best{background:#E0F2FE;color:#0369A1;}
  .dash-pick-badge.warn{background:#FEF3C7;color:#92400E;}


  /* ── Quick callout dot on chip ── */
  .chip-quick-out{
    background:none;border:none;
    font-size:15px;line-height:1;
    width:28px;height:28px;
    padding:0;cursor:pointer;
    color:var(--c-text-3,#AEAEB2);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:color .15s,background .12s;flex-shrink:0;
  }
  .chip-quick-out:hover{background:var(--c-surface-2);color:var(--c-text-2);}
  .chip-quick-out.is-out{color:var(--c-accent,#2F5FA8);}
  .chip-quick-out:hover{color:#FF9500;background:rgba(255,149,0,.1);}
  .chip-quick-out.is-out{color:#FF3B30;}
  .chip-quick-out.is-out:hover{color:#FF3B30;background:rgba(255,59,48,.12);}


  .pool-count-badge{
    display:inline-flex;align-items:center;justify-content:center;
    background:#FF3B30;color:#fff;
    font-size:11px;font-weight:700;
    min-width:18px;height:18px;
    border-radius:9px;padding:0 5px;
    margin-left:6px;vertical-align:middle;
    line-height:1;
  }

  .chip-last-area{font-size:10px;color:var(--c-text-3);margin-top:0;letter-spacing:-.01em;line-height:1.2;}
  .chip.covering{border-color:#F59E0B;border-width:1.5px;}
  .chip.covering .chip-name::after{content:' ↩';font-size:10px;color:#F59E0B;font-weight:700;}


  /* ── Time-off filter tabs ── */
  .to-toolbar-row2 .to-filter-tab{
    flex:1;
    background:var(--c-surface-3);
    border:none;border-radius:8px;
    padding:6px 0;
    font-family:inherit;font-size:12px;font-weight:500;
    color:var(--c-text-2);cursor:pointer;
    text-align:center;
    transition:background .12s,color .12s,box-shadow .12s;
  }
  .to-toolbar-row2 .to-filter-tab.active{
    background:#fff;color:var(--c-accent);font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }
  /* keep old to-filter-tabs for any other uses */
  .to-filter-tabs{display:flex;gap:2px;background:var(--c-surface-3);border-radius:8px;padding:2px;}
  .to-filter-tab{
    background:none;border:none;
    padding:3px 8px;border-radius:6px;
    font-family:inherit;font-size:12px;font-weight:500;
    color:var(--c-text-2);cursor:pointer;
    transition:background .12s,color .12s;
    white-space:nowrap;
  }
  .to-filter-tab.active{background:#fff;color:var(--c-text);box-shadow:0 1px 3px rgba(0,0,0,.1);}


  .cell-select select,.roster-select{
    font-family:inherit;font-size:12px;
    border:none;background:transparent;
    padding:2px 4px;cursor:pointer;
    max-width:110px;color:var(--c-text);
  }
  .cell-center{text-align:center;}
  .cert-toggle-btn{
    background:none;border:none;cursor:pointer;
    font-size:16px;padding:2px;
    transition:transform .1s;
  }
  .cert-toggle-btn:hover{transform:scale(1.2);}
  .cert-toggle-btn.on{filter:none;}
  .lang-pill-sm{
    display:inline-block;
    background:#E0F2FE;color:#0369A1;
    font-size:10px;font-weight:600;
    padding:1px 5px;border-radius:99px;
    margin:1px;
  }
  .cell-langs-col{white-space:nowrap;}



  /* ── Move / selection banner ── */
  .selection-banner{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    background:#EEF3FC;
    border-bottom:2px solid var(--c-accent,#2F5FA8);
    gap:12px;
    flex-shrink:0;
    animation:banner-slide-down .2s ease-out;
  }
  @keyframes banner-slide-down{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .selection-banner-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .selection-banner-icon{
    font-size:20px;flex-shrink:0;
    background:var(--c-accent);color:#fff;
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;
  }
  .selection-banner-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .selection-banner-title{font-size:13px;font-weight:700;color:#1E3A6E;letter-spacing:-.01em;}
  .selection-banner-sub{font-size:11px;color:#2F5FA8;}
  .selection-cancel-btn{
    flex-shrink:0;
    background:#fff;
    border:1.5px solid rgba(47,95,168,.25);
    border-radius:8px;
    padding:6px 12px;
    font-family:inherit;font-size:12px;font-weight:700;
    color:var(--c-accent);cursor:pointer;
    transition:background .12s;white-space:nowrap;
  }
  .selection-cancel-btn:hover{background:#EEF3FC;}

  /* Highlight valid drop areas when in move mode */
  .area-drop.tap-target,.pool-zone.tap-target{
    outline:2px dashed var(--c-accent);
    outline-offset:-2px;
    background:rgba(47,95,168,.05);
    border-radius:10px;
  }
  .tap-target-btn{
    display:block;width:100%;
    background:var(--c-accent);color:#fff;
    border:none;border-radius:10px;
    padding:10px 12px;margin-bottom:8px;
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.01em;
    cursor:pointer;text-align:center;
    box-shadow:0 1px 4px rgba(47,95,168,.35);
    transition:opacity .12s var(--ease-out),transform .12s var(--ease-out);
  }
  .tap-target-btn:hover{opacity:.9;}
  .tap-target-btn:active{transform:scale(.97);}

  /* ── Swap banner ── */
  .swap-banner{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    background:#FFF7E6;
    border-bottom:2px solid #F59E0B;
    gap:12px;
    flex-shrink:0;
    animation:banner-pulse-amber 1.5s ease-in-out infinite;
  }
  @keyframes banner-pulse-amber{
    0%,100%{background:#FFF7E6;}
    50%{background:#FEF3C7;}
  }
  .swap-banner-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .swap-banner-icon{font-size:20px;flex-shrink:0;}
  .swap-banner-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .swap-banner-title{font-size:13px;font-weight:700;color:#92400E;letter-spacing:-.01em;}
  .swap-banner-sub{font-size:11px;color:#B45309;}
  .swap-cancel-btn{
    background:#fff;border:1px solid rgba(0,0,0,.15);
    border-radius:8px;padding:6px 12px;
    font-family:inherit;font-size:12px;font-weight:600;
    color:#374151;cursor:pointer;flex-shrink:0;
    transition:background .12s;
  }
  .swap-cancel-btn:hover{background:#F5F5F7;}
  /* Highlight swap targets on the board */
  .chip.swap-target{
    outline:2px dashed #F59E0B;
    outline-offset:2px;
    cursor:pointer;
  }
  .swap-here-hint{
    font-size:10px;font-weight:700;color:#D97706;
    background:#FEF3C7;padding:2px 6px;border-radius:4px;
  }


  /* ── Scheduled time-off chip states ── */
  /* "📅 Off · No coverage" — red, pulsing */
  .chip-out-scheduled{
    background:rgba(255,59,48,.12) !important;
    color:#FF3B30 !important;
    animation:pulse-red 1.8s ease-in-out infinite;
  }
  @keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:.6;}}

  /* "📅 Off · Covered" — green, calm */
  .chip-out-covered{
    background:rgba(52,199,89,.12) !important;
    color:#34C759 !important;
  }

  /* Covering row inside chip */
  .chip-covering-row{
    display:flex;align-items:center;gap:5px;
    margin-top:2px;
    padding:3px 6px;
    background:rgba(245,158,11,.08);
    border-radius:6px;
    border:1px solid rgba(245,158,11,.2);
  }
  .chip-covering-tag{
    font-size:10px;font-weight:700;
    color:#D97706;letter-spacing:.01em;
    flex-shrink:0;
  }
  .chip-covering-hint{
    font-size:10px;color:var(--c-text-2);
    flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip-return-btn{
    background:none;border:none;cursor:pointer;
    font-size:12px;padding:1px 4px;
    color:#D97706;border-radius:4px;flex-shrink:0;
    transition:background .1s;
  }
  .chip-return-btn:hover{background:rgba(245,158,11,.15);}

  /* Chip border when covering — amber */
  .chip.covering{border-color:#F59E0B !important;border-width:1.5px;}


  /* ── Seniority & late-start chip elements ── */
  .chip-late-tag{
    display:inline-flex;align-items:center;
    font-size:10px;font-weight:700;
    color:#D97706;background:rgba(245,158,11,.12);
    padding:0 4px;border-radius:3px;margin-right:3px;
  }
  .chip-vet-badge,.chip-senior-badge{font-size:11px;vertical-align:middle;cursor:help;}


  /* ── Position change request rows ── */
  .pos-req-row{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;
    padding:7px 10px;border-radius:var(--r-sm);
    border:1px solid var(--c-border);
    margin-bottom:5px;font-size:12px;
    background:var(--c-surface-2);
  }
  .pos-req-pending{border-color:#F59E0B;background:rgba(245,158,11,.05);}
  .pos-req-approved{border-color:#34C759;background:rgba(52,199,89,.05);}
  .pos-req-denied{border-color:var(--c-border);opacity:.6;}
  .pos-req-date{font-size:10px;color:var(--c-text-3);flex-shrink:0;}
  .pos-req-areas{font-weight:700;color:var(--c-text);flex:1;}
  .pos-req-reason{font-size:11px;color:var(--c-text-2);flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .pos-req-status{font-size:11px;font-weight:600;flex-shrink:0;}
  .pos-req-approve-btn,.pos-req-deny-btn{
    border:none;border-radius:6px;cursor:pointer;
    font-size:11px;font-weight:700;padding:3px 8px;
  }
  .pos-req-approve-btn{background:rgba(52,199,89,.15);color:#166534;}
  .pos-req-deny-btn{background:rgba(255,59,48,.1);color:#DC2626;}


  /* ══════════════════════════════════════════════
     Report Preview Modal
     ══════════════════════════════════════════════ */
  .rp-layout{display:flex;gap:0;flex:1;min-height:0;overflow:hidden;max-height:none;}

  /* Sidebar */
  .rp-sidebar{
    width:220px;flex-shrink:0;
    border-right:1px solid var(--c-border);
    overflow-y:auto;
    padding:12px 10px 16px;
    display:flex;flex-direction:column;gap:4px;
    background:var(--c-surface-2);
  }
  @media(max-width:600px){
    .rp-layout{flex-direction:column;}
    .rp-sidebar{
      width:100%;border-right:none;
      border-bottom:1px solid var(--c-border);
      flex-direction:row;flex-wrap:nowrap;
      overflow-x:auto;overflow-y:hidden;
      padding:8px;gap:6px;
      max-height:none;flex-shrink:0;
    }
    .rp-sidebar-head,.rp-sidebar-divider,.rp-format-row,.rp-format-check{display:none;}
    .rp-section-toggle{
      flex-direction:column;align-items:center;justify-content:center;
      min-width:70px;flex-shrink:0;padding:8px 6px;gap:4px;
    }
    .rp-section-left{flex-direction:column;align-items:center;gap:3px;}
    .rp-section-label{font-size:10px;text-align:center;white-space:normal;}
    .rp-preview-btn{display:none;}
    .rp-check-box{width:14px;height:14px;font-size:9px;}
    .rp-preview-pane{flex:1;min-height:0;}
  }
  .rp-sidebar-head{
    font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.07em;
    color:var(--c-text-3);
    padding:4px 6px 2px;
  }
  .rp-sidebar-divider{height:1px;background:var(--c-border);margin:8px 0;}

  /* Section toggle rows */
  .rp-section-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px 8px 8px;
    border-radius:var(--r-sm);
    cursor:pointer;
    border:1.5px solid transparent;
    transition:background .12s, border-color .12s;
    gap:6px;
  }
  .rp-section-toggle:hover{background:var(--c-surface-3);}
  .rp-section-toggle.on{
    background:rgba(47,95,168,.07);
    border-color:rgba(47,95,168,.2);
  }
  .rp-section-toggle.previewing{
    border-color:var(--c-accent);
    background:rgba(47,95,168,.1);
  }
  .rp-section-left{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
  .rp-check-box{
    width:16px;height:16px;border-radius:4px;flex-shrink:0;
    border:1.5px solid var(--c-border);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:var(--c-accent);
    background:var(--c-surface);
    transition:border-color .12s;
  }
  .rp-section-toggle.on .rp-check-box{
    background:var(--c-accent);color:#fff;border-color:var(--c-accent);
  }
  .rp-section-info{display:flex;align-items:center;gap:5px;min-width:0;}
  .rp-section-icon{font-size:14px;flex-shrink:0;}
  .rp-section-label{
    font-size:12px;font-weight:600;
    color:var(--c-text);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .rp-section-toggle.off .rp-section-label{color:var(--c-text-3);}

  /* Preview eye button */
  .rp-preview-btn{
    background:none;border:none;cursor:pointer;
    font-size:14px;padding:2px 4px;
    opacity:.4;transition:opacity .12s;
    flex-shrink:0;border-radius:4px;
  }
  .rp-preview-btn:hover{opacity:1;background:var(--c-surface-3);}
  .rp-section-toggle.previewing .rp-preview-btn{opacity:1;color:var(--c-accent);}

  /* Format options */
  .rp-format-row{display:flex;gap:6px;margin:4px 0;}
  .rp-format-opt{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:6px 4px;border-radius:var(--r-sm);
    border:1.5px solid var(--c-border);
    font-size:11px;font-weight:600;cursor:pointer;
    color:var(--c-text-2);transition:border-color .12s var(--ease-out),color .12s var(--ease-out);
  }
  .rp-format-opt.active{
    border-color:var(--c-accent);
    background:rgba(47,95,168,.07);
    color:var(--c-accent);
  }
  .rp-format-check{
    display:flex;flex-direction:column;gap:6px;
    padding:4px 2px;
  }
  .rp-format-check label{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--c-text-2);cursor:pointer;
  }
  .rp-format-check input[type=checkbox]{
    width:14px;height:14px;accent-color:var(--c-accent);cursor:pointer;
  }

  /* Preview pane */
  .rp-preview-pane{
    flex:1;min-width:0;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .rp-preview-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;
    border-bottom:1px solid var(--c-border);
    background:var(--c-surface-2);
    flex-shrink:0;
  }
  .rp-preview-label{
    font-size:12px;font-weight:700;color:var(--c-text);
  }
  .rp-close-preview-btn{
    background:none;border:none;cursor:pointer;
    font-size:11px;color:var(--c-text-2);padding:3px 8px;
    border-radius:4px;
  }
  .rp-close-preview-btn:hover{background:var(--c-surface-3);}

  .rp-preview-frame{flex:1;overflow:hidden;background:#f0f0f0;padding:12px;}
  .rp-preview-frame iframe{
    width:100%;height:100%;
    border:none;border-radius:6px;
    background:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
  }

  /* Empty state */
  .rp-preview-empty{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;
    padding:24px 20px;gap:8px;overflow-y:auto;
  }
  .rp-preview-empty-icon{font-size:36px;}
  .rp-preview-empty-title{font-size:16px;font-weight:700;color:var(--c-text);}
  .rp-preview-empty-sub{font-size:13px;color:var(--c-text-2);text-align:center;max-width:260px;line-height:1.5;margin-bottom:12px;}

  /* Summary cards grid */
  .rp-summary-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    width:100%;margin-top:4px;
  }
  .rp-summary-card{
    padding:10px 12px;border-radius:var(--r-sm);
    border:1.5px solid var(--c-border);
    display:flex;flex-direction:column;gap:2px;
    transition:border-color .12s,background .12s;
  }
  .rp-summary-card.on{border-color:rgba(47,95,168,.3);background:rgba(47,95,168,.04);}
  .rp-summary-card.off{opacity:.45;}
  .rp-summary-icon{font-size:18px;}
  .rp-summary-name{font-size:12px;font-weight:700;color:var(--c-text);}
  .rp-summary-desc{font-size:10px;color:var(--c-text-2);line-height:1.4;}
  .rp-summary-check{font-size:11px;font-weight:700;color:var(--c-accent);margin-top:2px;}
  .rp-summary-x{font-size:11px;color:var(--c-text-3);margin-top:2px;}

  /* Footer note */
  .rp-foot-note{
    font-size:11px;color:var(--c-text-3);
    margin-right:auto;
  }

  /* Make report preview modal wider */
  .modal-overlay:has(.rp-layout){align-items:center;}
  .rp-layout ~ .modal-foot,
  div:has(.rp-layout){max-width:760px !important;}


  /* ── Report live view ── */
  .rp-view-tabs{display:flex;gap:4px;background:var(--c-surface-2);border-radius:10px;padding:3px;}
  .rp-view-tab{
    background:none;border:none;cursor:pointer;
    padding:5px 12px;border-radius:7px;
    font-family:inherit;font-size:12px;font-weight:600;
    color:var(--c-text-2);transition:background .12s,color .12s;
  }
  .rp-view-tab.active{background:var(--c-surface);color:var(--c-text);box-shadow:var(--shadow-sm);}

  .rp-live-view{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
  .rp-live-toolbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:8px 14px;border-bottom:1px solid var(--c-border);
    background:var(--c-surface-2);flex-shrink:0;
  }
  .rp-live-info{font-size:11px;color:var(--c-text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rp-live-opt{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c-text-2);cursor:pointer;white-space:nowrap;}
  .rp-live-opt input{accent-color:var(--c-accent);width:13px;height:13px;}
  .rp-live-frame{flex:1;overflow:hidden;background:#e8e8e8;padding:10px;}
  .rp-live-frame iframe{
    width:100%;height:100%;border:none;
    border-radius:6px;background:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }

  /* ── Callout banner ── */
  .callout-banner{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    background:#FFF7E6;
    border-bottom:2px solid #F59E0B;
    gap:12px;
    flex-shrink:0;
  }
  /* RED — nobody assigned yet */
  .callout-banner.needs-coverage{
    background:#FEF2F2;
    border-bottom-color:#EF4444;
    animation:banner-pulse 2s ease-in-out infinite;
  }
  @keyframes banner-pulse{
    0%,100%{background:#FEF2F2;}
    50%{background:#FFE4E4;}
  }
  /* YELLOW — partial coverage */
  .callout-banner.partial-coverage{
    background:#FFFBEB;
    border-bottom-color:#F59E0B;
  }
  /* GREEN — all covered */
  .callout-banner.all-covered{
    background:#F0FFF4;
    border-bottom-color:#34C759;
    animation:banner-green-pulse 1s ease-out 1;
  }
  @keyframes banner-green-pulse{
    0%{background:#DCFCE7;}
    100%{background:#F0FFF4;}
  }
  .callout-banner-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .callout-banner-icon{font-size:20px;flex-shrink:0;line-height:1;}
  .callout-banner-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .callout-banner-title{
    font-size:13px;font-weight:700;
    color:#92400E;letter-spacing:-.01em;
  }
  .callout-banner.needs-coverage .callout-banner-title{color:#991B1B;}
  .callout-banner-names{
    font-size:12px;color:#B45309;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .callout-banner.needs-coverage .callout-banner-names{color:#B91C1C;}
  .callout-banner-btn{
    flex-shrink:0;
    background:#F59E0B;color:#fff;
    border:none;border-radius:8px;
    padding:7px 14px;
    font-family:inherit;font-size:13px;font-weight:700;
    cursor:pointer;white-space:nowrap;
    transition:background .15s,transform .1s;
    letter-spacing:-.01em;
  }
  .callout-banner-btn:active{transform:scale(.97);}
  .callout-banner-btn:hover{background:#D97706;}
  .callout-banner.needs-coverage .callout-banner-btn{background:#EF4444;}
  .callout-banner.needs-coverage .callout-banner-btn:hover{background:#DC2626;}
  .callout-banner.partial-coverage .callout-banner-btn{background:#D97706;}
  .callout-banner.all-covered .callout-banner-btn,.all-covered-btn{background:#34C759;}
  .callout-banner.all-covered .callout-banner-btn:hover{background:#2DB34A;}
  @media(max-width:420px){
    .callout-banner{padding:8px 12px;gap:8px;}
    .callout-banner-icon{font-size:16px;}
    .callout-banner-btn{padding:6px 10px;font-size:12px;}
    .callout-banner-title{font-size:12px;}
  }

  /* ── Search bar ── */
  .search-box-wrap{
    position:relative;
    display:flex;align-items:center;
    flex-shrink:1;min-width:0;
  }
  .search-icon{
    position:absolute;left:9px;
    font-size:12px;color:#9CA3AF;
    pointer-events:none;z-index:1;
    line-height:1;
    width:16px;text-align:center;
  }
  .search-box{
    padding:7px 26px 7px 32px;
    border:1px solid var(--c-border,rgba(0,0,0,.1));
    border-radius:var(--r-pill,999px);
    background:var(--c-surface-2,#F5F5F7);
    font-family:inherit;font-size:14px;
    color:var(--c-text,#1D1D1F);
    width:130px;min-width:0;
    transition:border-color .15s,width .2s,box-shadow .15s;
    -webkit-appearance:none;
  }
  .search-box:focus{
    outline:none;
    border-color:var(--c-accent,#2F5FA8);
    box-shadow:0 0 0 3px rgba(47,95,168,.12);
    width:175px;background:#fff;
  }
  .search-clear{
    position:absolute;right:8px;
    background:none;border:none;
    cursor:pointer;color:#9CA3AF;
    font-size:11px;padding:2px;line-height:1;
  }

  /* ── Buttons ── */
  .btn{
    font-family:inherit;
    font-size:14px;font-weight:700;letter-spacing:-.01em;
    padding:11px 20px;min-height:44px;
    border-radius:12px;border:none;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    white-space:nowrap;
    transition:opacity .15s,filter .15s,transform .1s;
    box-sizing:border-box;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--c-accent);color:#fff;font-weight:600;}
  .btn-primary:hover{opacity:.88;}
  .btn-light{background:var(--c-surface-3);color:var(--c-text);border:1px solid var(--c-border);}
  .btn-light:hover{background:#E0E0E8;}
  .btn-ghost{background:none;color:var(--c-accent);}
  .btn-ghost:hover{background:rgba(47,95,168,.06);}
  .btn-danger{background:none;color:var(--c-red);border:1px solid rgba(255,59,48,.22);}
  .btn-danger:hover{background:rgba(255,59,48,.05);}
  .btn-sm{font-size:13px;font-weight:700;letter-spacing:-.01em;padding:8px 14px;min-height:40px;border-radius:8px;}

  /* ── Inputs ── */
  input[type=text],input[type=date],input[type=number],input[type=email],textarea,select{
    font-family:inherit;
    font-size:15px;
    color:var(--c-text);
    background:var(--c-surface);
    border:1px solid var(--c-border);
    border-radius:var(--r-sm);
    padding:9px 12px;
    width:100%;
    box-sizing:border-box;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--c-accent);
    box-shadow:0 0 0 3px rgba(47,95,168,.12);
  }
  select{
    background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236E6E73' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:32px;
  }
  label{font-size:12px;font-weight:600;color:var(--c-text-2);display:block;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
  .field{margin-bottom:16px;}

  /* ── Modal ── */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    animation:backdrop-in .18s var(--ease-out) both;
  }
  @keyframes backdrop-in{from{opacity:0;}to{opacity:1;}}
  @media(prefers-reduced-motion:reduce){
    .modal-backdrop{animation:none;}
    .modal{animation:none;}
  }
  .modal{
    background:var(--c-surface);
    border-radius:var(--r-xl);
    box-shadow:var(--shadow-md);
    max-width:min(760px,calc(100vw - 32px));width:100%;
    max-height:90vh;
    display:flex;flex-direction:column;
    overflow:hidden;
    animation:modal-pop .22s cubic-bezier(.34,1.2,.64,1);
    transform-origin:center bottom;
  }
  @keyframes modal-pop{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @media(max-width:600px){
    .modal{
      border-radius:20px 20px 0 0;
      max-width:100%;
      animation:modal-sheet .26s cubic-bezier(.32,1,.45,1);
    }
    @keyframes modal-sheet{
      from{transform:translateY(50%);opacity:.7}
      to{transform:translateY(0);opacity:1}
    }
    .modal-overlay{align-items:flex-end;padding:0;}
  }
  .modal-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:16px 18px 12px;
    border-bottom:1px solid var(--c-border);
  }
  @media(max-width:600px){.modal-head{padding:12px 16px 10px;}}
  .modal-head h2{font-size:18px;font-weight:700;color:var(--c-text);letter-spacing:-.025em;margin:0 0 3px;}
  .modal-head p{font-size:13px;color:var(--c-text-2);margin:0;}
  .field-hint{font-size:11px;font-weight:400;color:var(--c-text-3);margin-left:4px;}
  .modal-close{
    background:var(--c-surface-3);border:none;border-radius:50%;
    width:28px;height:28px;font-size:14px;font-weight:600;
    color:var(--c-text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-left:12px;margin-top:2px;
    transition:background .15s;
  }
  .modal-close:hover{background:var(--c-surface-3);color:var(--c-text);}
  .modal-body{flex:1;overflow-y:auto;padding:18px 22px;min-height:0;}
  /* Report modal: wider + constrained height */
  .report-modal{
    max-width:min(820px, calc(100vw - 32px)) !important;
    max-height:min(720px, 90vh) !important;
    height:min(720px, 90vh);
  }
  .report-modal .modal-body{padding:0;overflow:hidden;display:flex;flex-direction:column;}
  .modal-foot{
    padding:12px 16px;
    border-top:1px solid var(--c-border);
    display:flex;align-items:center;gap:8px;
    background:var(--c-surface);
    flex-shrink:0;
  }
  /* Primary fill, danger stays small on the right */
  .modal-foot .btn-primary{flex:1;}
  .modal-foot .btn-danger{
    flex:0 0 auto;
    background:none;
    color:var(--c-red);
    border:none;
    font-size:13px;
    font-weight:600;
    padding:6px 10px;
    text-decoration:none;
    opacity:.85;
  }
  .modal-foot .btn-danger:hover{opacity:1;background:rgba(255,59,48,.06);}

  /* ── Option cards ── */
  .option-card{
    background:var(--c-surface);
    border:1px solid var(--c-border);
    border-radius:var(--r-md);
    padding:12px 14px;margin-bottom:8px;
    cursor:pointer;display:flex;align-items:center;
    transition:background .15s;
  }
  .option-card:hover{background:var(--c-surface-2);}
  .oc-name{font-size:15px;font-weight:590;color:var(--c-text);}
  .oc-sub{font-size:12px;color:var(--c-text-2);margin-top:2px;}

  /* ── App bar & layout ── */
  .topbar{
    background:rgba(255,255,255,.92)!important;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--c-border)!important;
    box-shadow:none!important;
  }
  .layout{background:var(--c-bg);}
  .board-wrap{background:var(--c-bg);}

  /* ── Area columns ── */
    .area-col{
    background:var(--c-surface);border:1px solid var(--c-border);
    border-radius:var(--r-md);
    width:320px;min-width:280px;max-width:420px;
    flex-shrink:0;flex-grow:0;
    display:flex;flex-direction:column;
    height:calc(100vh - 148px);max-height:calc(100vh - 148px);
    overflow:hidden;
  }
  @media(min-width:1200px){
    .area-col{min-width:280px;max-width:420px;}
  }
  .area-count.over{background:#FFF1F0;color:#FF3B30;}
  .area-count.under{background:#FFFBEB;color:#D97706;}
  .area-count.ok{background:#F0FFF4;color:#166534;}
  .area-count.over{background:#FFE4E4;color:var(--c-red);}
  .area-drop{padding:8px;background:var(--c-bg);}
  .area-empty-hint{color:var(--c-text-3);font-size:13px;text-align:center;padding:20px 0;font-style:italic;}

  /* ── Sidebar ── */
  .sidebar-wrap{background:var(--c-surface);border-right:1px solid var(--c-border);}

  /* ── Nav drawer ── */
  .nav-drawer{background:var(--c-surface);box-shadow:var(--shadow-md);}
  .nav-drawer-header{font-size:17px;font-weight:700;color:var(--c-text);letter-spacing:-.02em;}
  .nav-item{font-size:15px;font-weight:500;color:var(--c-text);border-radius:var(--r-sm);margin:1px 8px;width:calc(100% - 16px);}
  .nav-item:hover{background:var(--c-surface-3);}
  .nav-drawer-section,.nav-section-label{
    font-family:inherit;font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    color:var(--c-text-3,#AEAEB2);
    padding:20px 14px 4px;
    margin:0;
  }

  /* ── Toast ── */
  .toast{
    font-family:inherit;font-size:14px;font-weight:500;
    background:rgba(28,28,30,.92);backdrop-filter:blur(12px);
    color:#fff;border-radius:var(--r-pill);
    padding:10px 20px;box-shadow:var(--shadow-md);
    letter-spacing:-.01em;
    animation:toast-in .28s var(--ease-out) both;
  }
  .toast.leaving{
    animation:toast-out .22s var(--ease-in-out) both;
  }
  @keyframes toast-in{
    from{opacity:0;transform:translateY(8px) scale(.96);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes toast-out{
    from{opacity:1;transform:translateY(0) scale(1);}
    to{opacity:0;transform:translateY(4px) scale(.98);}
  }
  @media(prefers-reduced-motion:reduce){
    .toast{animation:none;}
    .toast.leaving{animation:none;opacity:0;transition:opacity .12s linear;}
  }

  /* ── Misc ── */
  .small-muted{font-size:12px;color:var(--c-text-2);}
  .dept-label{
    font-size:var(--text-xs);font-weight:700;color:var(--c-text-2);
    letter-spacing:.07em;text-transform:uppercase;
    margin-bottom:8px;padding-left:10px;
    border-left:3px solid var(--dept-accent,var(--c-border));
    display:flex;align-items:center;gap:6px;
  }

  /* ── Tab bar: Apple-style ── */
  .tab-bar{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    display:flex;
    height:56px;
    flex-shrink:0;
    border-bottom:1px solid rgba(0,0,0,.08);
    position:relative;
    z-index:9;
    padding:0 var(--md-space-2);
  }
  .tab-btn{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex:1 1 0;
    min-width:0;
    padding:0 var(--md-space-3);
    background:none;
    border:none;
    color:var(--md-sys-color-on-surface-variant);
    font-family:-apple-system,BlinkMacSystemFont,var(--sans);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    position:relative;
    transition:color .15s;
    border-radius:10px;
    letter-spacing:-0.01em;
  }
  .tab-btn:hover{background:rgba(0,0,0,.04);}
  .tab-btn.active{
    color:var(--c-accent,#2F5FA8);
    font-weight:600;
  }
  .tab-btn.active .tab-icon svg{
    stroke:var(--c-accent,#2F5FA8);
  }
  /* pill underline indicator */
  .tab-btn.active::after{
    content:'';
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:36px;
    height:3px;
    background:var(--c-accent,#2F5FA8);
    border-radius:3px 3px 0 0;
  }
  .tab-icon{
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    opacity:.7;
    transition:opacity .15s;
  }
  .tab-btn.active .tab-icon{opacity:1;}
  .tab-icon svg{display:block;}
  .tab-label{
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* on narrow screens: icon only */
  @media(max-width:640px){
    .tab-btn{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;}
    .tab-label{font-size:10px;letter-spacing:0;}
  }

  /* ── Navigation Drawer (M3 modal drawer spec) ── */
  .nav-drawer{
    position:fixed;
    top:0; right:0; bottom:0;
    width:280px;
    background:var(--c-surface);
    box-shadow:-4px 0 24px rgba(0,0,0,.15);
    z-index:50;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    padding-top:0;
    overflow-y:auto;
  }
  .nav-drawer.open{transform:translateX(0);}
  /* Drawer header: brand identity so you know what app you're in */
  .nav-drawer-header{
    height:56px;
    display:flex;
    align-items:center;
    padding:0 var(--md-space-5);
    font-family:var(--md-ref-typeface-brand);
    font-size:var(--md-sys-typescale-title-large-size);
    font-weight:var(--md-sys-typescale-title-large-weight);
    color:var(--md-sys-color-on-surface);
    letter-spacing:-0.01em;
    flex-shrink:0;
    border-bottom:1px solid var(--md-sys-color-outline-variant);
    margin-bottom:var(--md-space-2);
  }
  .nav-scrim{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.32); /* M3 uses 32% opacity scrim */
    z-index:49;
    display:none;
  }
  .nav-scrim.visible{display:block;}
  /* M3 drawer section header: Label Large, on-surface-variant */
  .nav-drawer-section{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-3,#AEAEB2);padding:20px 14px 4px;}
  /* M3 drawer nav item: 56dp tall, active indicator is full-width pill with secondary-container */
  .nav-item{
    display:flex;
    align-items:center;
    gap:var(--md-space-3);
    padding:0 var(--md-space-3);
    height:56px;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    font-family:var(--sans);
    font-size:var(--md-sys-typescale-label-large-size);
    font-weight:500;
    color:var(--md-sys-color-on-surface-variant);
    border-radius:var(--md-sys-shape-corner-full);
    cursor:pointer;
    transition:background .15s, color .15s;
    margin:2px var(--md-space-3);
    width:calc(100% - 24px);
  }
  .nav-item:hover{
    background:color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
    color:var(--md-sys-color-on-surface);
  }
  .nav-item-icon{
    font-size:22px;
    width:24px;
    text-align:center;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .nav-divider{
    height:1px;
    background:var(--md-sys-color-outline-variant);
    margin:var(--md-space-2) var(--md-space-4);
  }

  /* nav toggle (hamburger) in app bar */
  .nav-toggle-btn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--md-sys-color-on-surface);
    padding:var(--md-space-2);
    border-radius:var(--md-sys-shape-corner-full);
    min-width:40px;
    min-height:40px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .nav-toggle-btn:hover{background:var(--md-sys-color-surface-container-high);}
  .brand{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.025em;color:var(--c-text);white-space:nowrap;}
  .brand .dot{display:none;}
  .period-pill{
    font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:12px;font-weight:600;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(0,0,0,.06);
    color:var(--c-text-2,#6E6E73);
    white-space:nowrap;
    letter-spacing:-.01em;
    flex-shrink:0;
    cursor:default;
  }
  .period-pill b{color:inherit;font-weight:inherit;}
  .period-pill-sub{opacity:.6;font-weight:500;margin-left:2px;}
  .topbar-right{display:flex;gap:var(--md-space-2);flex-wrap:wrap;align-items:center;}



  /* buttons (md.comp.button: filled / outlined / text / filled-tonal) */
  button{font-family:var(--sans);cursor:pointer;}
  /* old md-sys .btn block removed */
  .btn:active{box-shadow:none;}
  .btn-primary{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);box-shadow:var(--md-sys-elevation-0);}
  .btn-primary:hover{box-shadow:var(--md-sys-elevation-1);}
  .btn-danger{background:var(--md-sys-color-error);color:var(--md-sys-color-on-error);}
  .btn-danger:hover{box-shadow:var(--md-sys-elevation-1);}
  .btn-ghost{background:transparent;color:var(--md-sys-color-on-surface);border-color:var(--md-sys-color-outline);}
  .btn-ghost:hover{background:var(--md-sys-color-surface-container-high);}
  .btn-light{background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface);border-color:transparent;}
  .btn-light:hover{background:var(--md-sys-color-surface-container-highest);}
    .btn-sm{font-size:13px;font-weight:700;letter-spacing:-.01em;padding:8px 14px;min-height:40px;border-radius:8px;}
  .btn:disabled{opacity:.38;cursor:not-allowed;}

  /* ---------- layout ---------- */
  .layout{display:flex;height:calc(100vh - 136px);}
  .sidebar{
    width:240px;
    background:var(--md-sys-color-surface-container-low);
    color:var(--md-sys-color-on-surface);
    border-right:1px solid var(--md-sys-color-outline-variant);
    overflow-y:auto;
    flex-shrink:0;
    padding:var(--md-space-4) var(--md-space-3) var(--md-space-8);
  }
  .sidebar h3{
    font-size:var(--md-sys-typescale-label-medium-size);
    text-transform:uppercase;
    letter-spacing:var(--md-sys-typescale-label-medium-tracking);
    color:var(--md-sys-color-on-surface-variant);
    margin:var(--md-space-5) var(--md-space-1) var(--md-space-2);
    font-weight:700;
  }
  .sidebar h3:first-child{margin-top:var(--md-space-1);}
  .pool-zone{
    min-height:48px;
    border:1.5px dashed var(--md-sys-color-outline);
    border-radius:var(--md-sys-shape-corner-medium);
    padding:var(--md-space-2);
    display:flex;
    flex-direction:column;
    gap:var(--md-space-2);
  }
  .pool-zone.dragover{border-color:var(--md-sys-color-tertiary);background:var(--md-sys-color-tertiary-container);}
  .pool-empty{font-size:var(--md-sys-typescale-body-medium-size);color:var(--md-sys-color-on-surface-variant);text-align:center;padding:var(--md-space-4) var(--md-space-1);font-style:italic;}

  .sidebar-actions{display:flex;flex-direction:column;gap:var(--md-space-2);margin-top:var(--md-space-1);}
  .sidebar-actions .btn{width:100%;text-align:left;}

  .board-wrap{flex:1;overflow-x:auto;overflow-y:visible;padding:12px 16px 24px;background:var(--c-bg);max-width:100%;}
  .dept-board{
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:8px 0 16px;
  }
  .board{
    display:flex;
    gap:10px;
    align-items:flex-start;
    overflow-x:auto;
    padding-bottom:8px;
  }

  /* ---------- area column (md.comp.card, elevated) ---------- */
  .area-col{
    background:var(--c-surface,#fcfcfc);
    border-radius:12px;
    width:320px;min-width:280px;max-width:420px;
    flex-shrink:0;flex-grow:0;
    border:1px solid var(--c-border,#efefef);
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    display:flex;flex-direction:column;
    height:auto;max-height:min(52vh, 440px);
    overflow:hidden;
    position:relative;
  }
  .area-head{
    padding:var(--md-space-3) var(--md-space-4) var(--md-space-2);
    border-bottom:3px solid var(--area-color, var(--md-sys-color-primary));
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:var(--md-space-2);
    flex-wrap:wrap;
  }
  .area-name{
    font-weight:var(--md-sys-typescale-title-medium-weight);
    font-size:var(--md-sys-typescale-title-medium-size);
    letter-spacing:var(--md-sys-typescale-title-medium-tracking);
    display:flex;
    align-items:center;
    gap:var(--md-space-2);
    flex:1 1 auto;
    min-width:90px;
    color:var(--md-sys-color-on-surface);
  }
  .area-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .area-count{
    font-family:var(--mono);
    font-size:var(--md-sys-typescale-label-medium-size);
    color:var(--md-sys-color-on-surface-variant);
    background:var(--md-sys-color-surface-container-highest);
    padding:var(--md-space-1) var(--md-space-2);
    border-radius:var(--md-sys-shape-corner-full);
    flex-shrink:0;
    font-weight:600;
  }
  .area-count.over{color:var(--md-sys-color-on-error-container);background:var(--md-sys-color-error-container);font-weight:700;}
  .area-menu-btn{
    background:none;border:none;color:var(--md-sys-color-on-surface-variant);font-size:16px;padding:var(--md-space-1) var(--md-space-2);border-radius:var(--md-sys-shape-corner-full);line-height:1;
  }
  .area-menu-btn:hover{background:var(--md-sys-color-surface-container-highest);}
  .area-drop{
    flex:1;
    overflow-y:auto;
    padding:var(--md-space-2) var(--md-space-2) 20px;
    display:flex;
    flex-direction:column;
    gap:var(--md-space-2);
    min-height:68px;
    background:var(--md-sys-color-surface-container-lowest);
  }
  .area-drop.dragover{background:var(--md-sys-color-primary-container);}
  .area-col-more-cue{
    position:absolute;left:0;right:0;bottom:0;height:26px;
    background:linear-gradient(to bottom, transparent, var(--md-sys-color-surface-container-lowest));
    pointer-events:none;border-radius:0 0 12px 12px;
    opacity:0;transition:opacity .15s;
  }
  .area-col.has-more .area-col-more-cue{opacity:1;}
  .area-empty-hint{
    font-size:var(--md-sys-typescale-body-medium-size);
    color:var(--md-sys-color-on-surface-variant);
    text-align:center;
    padding:var(--md-space-4) var(--md-space-2);
    border:1.5px dashed var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-small);
  }
  .add-area-col{
    width:150px;
    flex-shrink:0;
    border:1.5px dashed var(--md-sys-color-outline);
    border-radius:var(--md-sys-shape-corner-medium);
    color:var(--md-sys-color-on-surface-variant);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:var(--md-sys-typescale-label-large-size);
    font-weight:600;
    min-height:88px;
    height:fit-content;
  }
  .add-area-col:hover{border-color:var(--md-sys-color-tertiary);color:var(--md-sys-color-tertiary);}

  /* ---------- overview (dense glance view) ---------- */
  /* ── Overview ── */
  .overview-wrap{
    flex:1;overflow-y:auto;
    padding:0;
    background:var(--c-surface-2);
    display:flex;flex-direction:column;
  }
  .overview-toolbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;flex-wrap:wrap;
    padding:10px 14px 8px;
    border-bottom:1px solid var(--c-border);
    background:var(--c-surface);
    flex-shrink:0;
  }
  .overview-legend{
    display:flex;gap:12px;font-size:11px;
    color:var(--c-text-2);flex-wrap:wrap;
  }
  .overview-legend span{display:inline-flex;align-items:center;gap:4px;}
  .ov-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  /* Department section */
  .ov-dept{margin-bottom:0;}
  .ov-dept-head{
    font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.07em;
    color:var(--c-text-2);
    padding:10px 14px 6px;
    background:var(--c-surface-2);
    border-bottom:1px solid var(--c-border);
    position:sticky;top:0;z-index:1;
  }

  /* Responsive area grid — fills all available width */
  .ov-areas-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(170px, calc(50% - 5px)), 1fr));
    gap:10px;
    padding:10px 12px 14px;
    background:var(--c-surface-2);
  }
  @media(min-width:1200px){
    .ov-areas-grid{
      grid-template-columns:repeat(auto-fill, minmax(min(200px, 100%), 1fr));
      gap:12px;
      padding:12px 16px 16px;
    }
  }

  /* Area card */
  .ov-area{
    background:var(--c-surface);
    border-radius:var(--r-md);
    border:1px solid var(--c-border);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:box-shadow .12s;
  }
  .ov-area:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .ov-area-head{
    display:flex;align-items:center;gap:6px;
    padding:8px 10px 6px;
    border-bottom:1px solid var(--c-border);
  }
  .ov-area-name{
    font-weight:700;font-size:12px;flex:1;
    color:var(--c-text);letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ov-empty{
    font-size:11px;color:var(--c-text-3);font-style:italic;
    padding:6px 10px 8px;
  }
  .ov-row{
    padding:4px 8px;
    font-size:12px;
    cursor:pointer;
    border-bottom:1px solid var(--md-sys-color-outline-variant);
    cursor:pointer;
    border-radius:var(--md-sys-shape-corner-extra-small);
  }
  .ov-row:hover{background:var(--md-sys-color-surface-container-high);}
  .ov-row:last-child{border-bottom:none;}
  .ov-row.out{opacity:0.55;}
  .ov-row.flagged{background:var(--md-sys-color-tertiary-container);}
  .ov-name{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-text);display:block;}
  .ov-hours{font-size:10px;color:var(--c-text-2);}
  .ov-break{font-size:10px;color:var(--c-text-2);}
  .ov-flag{
    grid-column:1/-1;
    font-size:var(--md-sys-typescale-label-small-size);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--md-sys-color-error);
    padding-left:var(--md-space-3);
  }
  .ov-flag.out{color:var(--md-sys-color-error);}

  /* ---------- roster (spreadsheet-style table) ---------- */
  .roster-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--c-surface);}

  .roster-search{
    border:1px solid var(--md-sys-color-outline);
    border-radius:var(--md-sys-shape-corner-extra-small);
    padding:var(--md-space-2) var(--md-space-3);
    font-size:var(--md-sys-typescale-label-large-size);
    font-family:var(--sans);
    background:var(--md-sys-color-surface-container-lowest);
    color:var(--md-sys-color-on-surface);
    width:280px;
    flex-shrink:0;
  }
  .roster-search:focus{outline:2px solid var(--md-sys-color-primary);outline-offset:-1px;border-color:var(--md-sys-color-primary);}
  .roster-table-scroll{
    border:1px solid var(--md-sys-color-outline-variant);
    border-radius:var(--md-sys-shape-corner-medium);
    overflow:auto;
    background:var(--md-sys-color-surface-container-lowest);
    box-shadow:var(--md-sys-elevation-1);
  }

  /* ── Roster mobile card view (< 700px) ── */
  @media(max-width:700px){
    .roster-table-scroll{display:none;}
    .roster-cards{display:flex;flex-direction:column;gap:0;}
  }
  @media(min-width:701px){
    .roster-cards{display:none !important;}
  }
  .roster-card{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--c-border);
    background:var(--c-surface);
    transition:background .1s;
  }
  .roster-card:active{background:var(--c-surface-2);}
  .roster-card-avatar{
    width:38px;height:38px;border-radius:50%;
    font-size:14px;font-weight:700;color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .roster-card-body{flex:1;min-width:0;}
  .roster-card-name{
    font-size:14px;font-weight:600;color:var(--c-text);
    letter-spacing:-.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .roster-card-meta{
    font-size:12px;color:var(--c-text-2);
    margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .roster-card-right{
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
    flex-shrink:0;
  }
  .roster-card-shift{font-size:12px;color:var(--c-text-2);font-weight:500;}
  .roster-card-badges{display:flex;gap:4px;align-items:center;}
  .roster-card-cert{
    display:inline-block;font-size:10px;font-weight:700;
    background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;
    padding:1px 6px;border-radius:99px;margin:1px;
  }
  .roster-card-out{
    font-size:10px;font-weight:700;
    background:#FEF2F2;color:#DC2626;
    padding:1px 6px;border-radius:99px;
  }

  .ov-times{font-size:10px;color:var(--c-text-3);display:block;margin-top:1px;}
  .ov-out-tag{font-size:9px;font-weight:700;background:#FEF2F2;color:#DC2626;padding:1px 4px;border-radius:4px;margin-left:3px;}
  .ov-flag-dot{color:#F59E0B;font-size:10px;cursor:help;}
  /* ── Roster table ── */
  .roster-table{
    width:100%;
    min-width:680px;
    border-collapse:collapse;
    font-size:var(--text-footnote);
    table-layout:auto; /* auto layout so columns expand to fill */
  }
  @media(min-width:1200px){
    .roster-table{font-size:var(--text-sub);}
  }
  .roster-table td,.roster-table th{overflow:hidden;text-overflow:ellipsis;}
  .roster-table thead th{
    position:sticky;top:0;z-index:2;
    background:var(--c-surface-2);
    text-align:left;
    font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
    color:var(--c-text-2);
    padding:7px 5px 7px 8px;
    cursor:pointer;user-select:none;
    white-space:nowrap;
    border-bottom:2px solid var(--c-border);
  }
  .roster-table thead th:hover{background:var(--c-surface-3);}
  .roster-table thead th.sorted{color:var(--c-accent);}
  .roster-table tbody tr:hover td{background:#F8F8FB;}
  .roster-table tbody tr.roster-row-alt td{background:#FAFAFC;}
  .roster-table tbody tr.roster-row-alt:hover td{background:#F5F5F9;}
  .roster-group-row th.roster-group-th{
    background:var(--c-surface-3,#EFEFF2);
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--c-text-3,#9A9AA2);
    padding:4px 8px;text-align:center;
    border-bottom:1px solid var(--c-border);
  }
  .roster-sup-cell{display:flex;align-items:center;gap:5px;}
  .roster-sup-dot{width:8px;height:8px;border-radius:50%;border:1px solid transparent;flex-shrink:0;}
  .field-error{font-size:11px;color:#B91C1C;margin-top:3px;min-height:14px;}
  .tdis-badge{
    display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
    letter-spacing:.04em;background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;
    padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:middle;
  }
  .roster-table tbody tr.out td{opacity:.45;}
  .roster-table td{
    padding:3px 5px 3px 8px;
    border-bottom:1px solid var(--c-border);
    vertical-align:middle;
    white-space:nowrap;
    color:var(--c-text);
    font-size:0; /* collapse whitespace text nodes */
  }
  .roster-table td > *,.roster-table td select,.roster-table td input,.roster-table td button{
    font-size:13px; /* restore for actual content */
  }
  .roster-table tbody tr{height:42px;max-height:42px;}
  .roster-table tbody tr:last-child td{border-bottom:none;}

  /* Roster cell types */
  .cell-name{font-weight:700;cursor:pointer;font-size:13px;}
  .cell-name:hover{color:var(--c-accent);}
  .cell-dim{color:var(--c-text-2);font-size:12px;}
  .cell-select{padding:4px 6px 4px 10px;}
  .cell-center{text-align:center;padding:4px;}
  .cell-edit{cursor:text;min-width:70px;}
  .cell-edit:hover{background:var(--c-surface-3);}
  .cell-edit:empty::before{content:'—';color:var(--c-text-3);}
  .roster-cell-input{
    width:100%;border:none;outline:none;
    background:transparent;
    box-shadow:inset 0 0 0 2px var(--c-accent);
    border-radius:4px;
    padding:2px 6px;
    font-size:13px;font-family:inherit;
  }

  /* Roster name cell with avatar */
  .cell-name-block{display:flex;align-items:center;gap:5px;overflow:hidden;max-height:36px;}
  .roster-avatar{
    width:22px;height:22px;border-radius:50%;
    background:var(--c-accent);color:#fff;
    font-size:9px;font-weight:700;letter-spacing:0;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .roster-name-text{font-weight:600;font-size:var(--text-footnote);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;line-height:1.2;}
  .roster-sub-text{font-size:11px;color:var(--c-text-2);display:block;}

  /* Area cell with color dot */
  .cell-area-block{display:flex;align-items:center;gap:5px;}
  .roster-area-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    display:inline-block;
  }

  /* Dropdowns inside table */
  .roster-select{
    font-family:inherit;font-size:12px;
    border:none;background:transparent;
    padding:1px 0;cursor:pointer;
    color:var(--c-text);
    width:100%;
  }
  .roster-select:hover,.roster-select:focus{
    background:var(--c-surface-3);
    border-radius:4px;outline:none;
  }

  /* Supervisor select */
  .roster-sup-select{
    font-family:inherit;font-size:12px;
    border:none;background:transparent;
    padding:1px 0;cursor:pointer;
    color:var(--c-text-2);width:100%;
  }
  .roster-sup-select:focus{outline:none;}

  /* CA / AGS roster toggles — colored pill badges matching the ones used on
     board chips and the staff profile (.cert-badge/.roster-card-ags), so
     these read the same way in the dense roster table instead of a bare
     checkmark and an easy-to-miss checkbox. */
  .roster-tag-toggle{
    display:inline-flex;align-items:center;gap:2px;
    font-size:10px;font-weight:700;font-family:var(--mono);
    padding:3px 8px;border-radius:99px;
    border:1px dashed var(--c-border);
    cursor:pointer;background:none;color:var(--c-text-2);
    white-space:nowrap;transition:transform .1s;
  }
  .roster-tag-toggle:hover{transform:scale(1.05);}
  .roster-tag-toggle.ca.on{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;}
  .roster-tag-toggle.ags.on{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}

  /* Toolbar */
  .roster-toolbar{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px;
    border-bottom:1px solid var(--c-border);
    background:var(--c-surface);
    flex-shrink:0;
  }
  .roster-search-wrap{
    position:relative;flex:1;min-width:0;
    display:flex;align-items:center;
  }
  .roster-search-icon{
    position:absolute;left:9px;font-size:12px;
    color:var(--c-text-3);pointer-events:none;
  }
  .roster-search{
    width:100%;
    border:1px solid var(--c-border);
    border-radius:var(--r-pill);
    padding:5px 26px 5px 26px;
