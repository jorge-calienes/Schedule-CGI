function lastCompletedRotation(){
  if(state.history.length===0) return null;
  return state.history[state.history.length-1];
}

// area a staff member was in during the last completed rotation
function lastAreaFor(staffId){
  const last = lastCompletedRotation();
  if(!last) return null;
  return last.assignments[staffId] || null;
}

// all block partners for a staff id (mutual)
function blockPartnersOf(staffId){
  const partners = [];
  state.blocks.forEach(b=>{
    if(b.a===staffId) partners.push(b.b);
    if(b.b===staffId) partners.push(b.a);
  });
  return partners;
}

// who is currently (live) in a given area, excluding one staff id optionally
function staffInArea(areaId, excludeId){
  // Returns ALL assigned staff (including called-out) — used for chip rendering
  return state.staff.filter(s => state.assignments[s.id]===areaId && s.id!==excludeId);
}
function activeInArea(areaId, excludeId){
  // Returns only physically present staff (excludes callouts) — used for capacity checks
  return state.staff.filter(s =>
    state.assignments[s.id]===areaId &&
    s.id!==excludeId &&
    !state.callouts[s.id]
  );
}

// check block conflicts if we place staffId into areaId
function blockConflictsIn(staffId, areaId){
  const partners = new Set(blockPartnersOf(staffId));
  if(partners.size===0) return [];
  return staffInArea(areaId, staffId).filter(s=>partners.has(s.id));
}

// was staffId in areaId last rotation?
function isRepeatArea(staffId, areaId){
  const last = lastAreaFor(staffId);
  return last && last===areaId;
}

// count how many times staffId has worked areaId across all history (for best-fit ranking)
function timesWorkedArea(staffId, areaId){
  let n=0;
  state.history.forEach(h=>{ if(h.assignments[staffId]===areaId) n++; });
  return n;
}

function periodsSinceWorked(staffId, areaId){
  // returns number of periods ago they last worked this area, or Infinity if never
  for(let i=state.history.length-1;i>=0;i--){
    if(state.history[i].assignments[staffId]===areaId){
      return state.history.length-1-i;
    }
  }
  return Infinity;
}

// full per-area experience breakdown for one staff member, across every completed rotation
// plus their current live placement (if any). Sorted by times worked (most experienced first),
// then by most recent. Areas never worked are omitted entirely (only areas with real history show).
// full per-area experience breakdown for one staff member, across every completed rotation
// plus their current live placement (if any). Covers EVERY area in the operation, not just
// ones they've worked, so "never worked here" / "N rotations since" areas show up too.
// Sorted by times worked (most experienced first), then most recent. Also returns a
// best-fit verdict: the area (other than their current one) they're most qualified to cover.

// ============ PROFICIENCY HELPERS ============

const PROFICIENCY_LEVELS = [
  {min:0, max:0,   label:'Not rated',  color:'#9E9E9E', short:'—'},
  {min:1, max:1.9, label:'Beginner',   color:'#F44336', short:'1'},
  {min:2, max:2.9, label:'Developing', color:'#FF9800', short:'2'},
  {min:3, max:3.9, label:'Proficient', color:'#2196F3', short:'3'},
  {min:4, max:4.4, label:'Advanced',   color:'#4CAF50', short:'4'},
  {min:4.5,max:5,  label:'Expert',     color:'#9C27B0', short:'5'},
];

function getProficiencyLevel(rating){
  if(!rating) return PROFICIENCY_LEVELS[0];
  return PROFICIENCY_LEVELS.find(l=>rating>=l.min&&rating<=l.max) || PROFICIENCY_LEVELS[0];
}

// get latest composite rating for a staff member in a specific area
function getAreaRating(staffId, areaId){
  return state.proficiency?.[staffId]?.[areaId]?.rating || 0;
}

// get the full rating history for a staff member in an area
function getAreaRatingHistory(staffId, areaId){
  return state.proficiency?.[staffId]?.[areaId]?.ratings || [];
}

// save a new rating event for a staff member in an area
function saveAreaRating(staffId, areaId, {period, teamLeadRating, teamLeadId, teamLeadNote,
    supervisorRating, supervisorId, supervisorApproved, overrideReason}){
  if(!state.proficiency[staffId]) state.proficiency[staffId] = {};
  if(!state.proficiency[staffId][areaId]) state.proficiency[staffId][areaId] = {rating:0, ratings:[]};
  const entry = {period, teamLeadRating, teamLeadId, teamLeadNote: teamLeadNote||'',
    supervisorRating, supervisorId, supervisorApproved, overrideReason: overrideReason||''};
  state.proficiency[staffId][areaId].ratings.push(entry);
  // composite = average of both ratings if both exist, else the one that exists
  const scores = [teamLeadRating, supervisorRating].filter(r=>r>0);
  state.proficiency[staffId][areaId].rating = scores.length
    ? Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10
    : 0;
  saveState();
}

// should this staff member be blocked from advancing based on their latest rating?
// blocked if composite < 3 AND supervisor hasn't approved an override
function isProficiencyBlocked(staffId, areaId){
  const prof = state.proficiency?.[staffId]?.[areaId];
  if(!prof || prof.rating === 0) return false; // no rating yet = not blocked
  if(prof.rating >= 3) return false;
  const lastRating = prof.ratings[prof.ratings.length-1];
  return lastRating && !lastRating.supervisorApproved;
}

function staffExperienceBreakdown(staffId){
  const counts = {}; // areaId -> {timesWorked, lastPeriodIndex, lastPeriodLabel}
  state.history.forEach((h, idx)=>{
    const areaId = h.assignments[staffId];
    if(!areaId) return;
    if(!counts[areaId]) counts[areaId] = {timesWorked:0, lastPeriodIndex:-1, lastPeriodLabel:null};
    counts[areaId].timesWorked++;
    counts[areaId].lastPeriodIndex = idx;
    counts[areaId].lastPeriodLabel = h.period;
  });
  const totalCompletedRotations = state.history.length;
  const currentAreaId = state.assignments[staffId] || null;

  const rows = state.areas.map(area=>{
    const c = counts[area.id];
    const timesWorked = c ? c.timesWorked : 0;
    const periodsAgo = c ? (totalCompletedRotations - 1 - c.lastPeriodIndex) : Infinity;
    return {
      areaId: area.id, area,
      timesWorked,
      hasExperience: timesWorked > 0,
      periodsAgo,
    };
  });
  rows.sort((a,b)=>{
    if(a.timesWorked !== b.timesWorked) return b.timesWorked - a.timesWorked;
    if(a.periodsAgo !== b.periodsAgo) return a.periodsAgo - b.periodsAgo;
    return a.area.name.localeCompare(b.area.name);
  });

  // best fit: the most-experienced area that ISN'T where they currently are,
  // since "best fit to cover" implies somewhere other than their current spot.
  const bestFit = rows.find(r => r.hasExperience && r.areaId !== currentAreaId) || null;

  return { rows, totalCompletedRotations, currentAreaId, bestFit };
}

// rank candidate staff for filling an empty area slot (call-out reassignment)
// excludes: staff already in that area, staff currently out, blocked-conflicting staff (soft - still shown but flagged)
function rankCandidatesForArea(areaId, excludeStaffIds){
  const exclude = new Set(excludeStaffIds||[]);
  return state.staff
    .filter(s=>{
      if(s.active===false || exclude.has(s.id) || state.callouts[s.id]) return false;
      if(state.assignments[s.id]===areaId) return false;
      // staff permanently in a fixed area can't be pulled for coverage
      const homeArea = getAreaById(state.assignments[s.id]);
      if(homeArea && homeArea.fixed) return false;
      return true;
    })
    .map(s=>{
      const conflicts = blockConflictsIn(s.id, areaId);
      const repeat = isRepeatArea(s.id, areaId);
      const sinceWorked = periodsSinceWorked(s.id, areaId);
      const timesWorked = timesWorkedArea(s.id, areaId);
      const hasExperience = sinceWorked !== Infinity;
      const wouldDisplaceLead = isTeamLeadDisplaced(s.id, areaId);
      return {staff:s, conflicts, repeat, sinceWorked, timesWorked, hasExperience, currentArea: state.assignments[s.id], wouldDisplaceLead};
    })
    .sort((a,b)=>{
      // avoid pulling team leads off their own area first; then fewer conflicts;
      // then prefer staff who've actually worked this area before (most recent experience first,
      // then most times worked), since they need the least re-training to cover it well;
      // people who've never worked the area rank last.
      if((a.wouldDisplaceLead?1:0) !== (b.wouldDisplaceLead?1:0)) return (a.wouldDisplaceLead?1:0)-(b.wouldDisplaceLead?1:0);
      if(a.conflicts.length!==b.conflicts.length) return a.conflicts.length-b.conflicts.length;
      if(a.hasExperience !== b.hasExperience) return a.hasExperience ? -1 : 1;
      if(a.hasExperience && b.hasExperience){
        if(a.sinceWorked!==b.sinceWorked) return a.sinceWorked-b.sinceWorked; // smaller gap = worked it more recently = better fit
        if(a.timesWorked!==b.timesWorked) return b.timesWorked-a.timesWorked; // more times worked = more familiar
      }
      if((a.currentArea?1:0) !== (b.currentArea?1:0)) return (a.currentArea?1:0)-(b.currentArea?1:0);
      return a.staff.name.localeCompare(b.staff.name);
    });
}

// suggest valid areas for a staff member (used for new-staff placement & conflict modal alternatives)
function suggestAreasFor(staffId){
  return state.areas.map(area=>{
    const conflicts = blockConflictsIn(staffId, area.id);
    const repeat = isRepeatArea(staffId, area.id);
    const count = staffInArea(area.id).length;
    const over = count >= area.capacity;
    return {area, conflicts, repeat, count, over};
  }).sort((a,b)=>{
    const score = x => (x.conflicts.length*10) + (x.repeat?3:0) + (x.over?1:0);
    return score(a)-score(b);
  });
}

// is this staff member a team lead being moved out of their home/supervised area?
function isTeamLeadDisplaced(staffId, targetAreaId){
  const s = getStaffById(staffId);
  if(!s || !s.isTeamLead) return false;
  if(!s.homeAreaId) return false;
  return targetAreaId !== s.homeAreaId;
}

function areasByDepartment(){
  const map = {};
  // include ALL areas (fixed and non-fixed) so Fixed Positions row appears
  state.areas.forEach(a=>{
    const dept = a.department || 'Other';
    if(!map[dept]) map[dept] = [];
    map[dept].push(a);
  });
  const allDepts = Object.keys(map);
  const ordered  = state.departments.filter(d=>map[d]).concat(allDepts.filter(d=>!state.departments.includes(d)));
  return ordered.map(dept=>{
    let areas = map[dept];
    const ao  = (state.areaOrder||{})[dept];
    if(ao && ao.length){
      const inOrder = ao.map(id=>areas.find(a=>a.id===id)).filter(Boolean);
      const rest    = areas.filter(a=>!ao.includes(a.id));
      areas = [...inOrder, ...rest];
    }
    return {department:dept, areas};
  });
}

// ============ ROTATION FLOW LOGIC ============

function getFlowById(id){ return state.rotationFlows.find(f=>f.id===id); }

// for a staff member enrolled in a flow, returns which stage they're currently at
// and how many rotations they've completed at that stage.
// Stage is determined by: find the FIRST stage where timesWorked < requiredRotations.
// If all stages pass, they've completed the flow (experienced).
function getStaffFlowProgress(staffId){
  const s = getStaffById(staffId);
  if(!s || !s.flowId || !s.flowEnrolled) return null;
  const flow = getFlowById(s.flowId);
  if(!flow) return null;
  const stageProgress = flow.stages.map(stage=>{
    const worked = timesWorkedArea(staffId, stage.areaId);
    return { stage, worked, satisfied: worked >= stage.requiredRotations };
  });
  const currentStageIdx = stageProgress.findIndex(sp=>!sp.satisfied);
  const completed = currentStageIdx === -1;
  return {
    flow, stageProgress,
    currentStageIdx: completed ? flow.stages.length : currentStageIdx,
    currentStage: completed ? null : flow.stages[currentStageIdx],
    nextStage: completed ? null : (currentStageIdx+1 < flow.stages.length ? flow.stages[currentStageIdx+1] : null),
    completed,
  };
}

// computes what the rotation should suggest for every enrolled staff member.
// Returns an array of move suggestions: {staff, flow, from, to, reason, type}
// type: 'advance' (ready to move to next stage), 'stay' (not enough rotations yet),
//       'complete' (finished the whole flow, freed from path)
function computeFlowAdvancement(){
  const suggestions = [];
  state.staff.forEach(s=>{
    if(!s.flowId || !s.flowEnrolled) return;
    // staff permanently in a fixed area don't participate in rotation flow
    const currentAreaId = state.assignments[s.id];
    const homeArea = currentAreaId ? getAreaById(currentAreaId) : null;
    if(homeArea && homeArea.fixed) return;
    const progress = getStaffFlowProgress(s.id);
    if(!progress) return;
    const fromArea = currentAreaId ? getAreaById(currentAreaId) : null;
    if(progress.completed){
      suggestions.push({
        staff:s, flow:progress.flow,
        fromAreaId:currentAreaId, fromArea,
        toAreaId:null, toArea:null,
        type:'complete',
        reason:`Completed all ${progress.flow.stages.length} stages of the ${progress.flow.name} — now experienced and rotating freely.`,
      });
    } else {
      // currentStageIdx is the FIRST stage that is NOT yet satisfied (it's the current target)
      const sp = progress.stageProgress[progress.currentStageIdx];
      const needed = sp.stage.requiredRotations - sp.worked;
      const isAtCurrentStage = currentAreaId === sp.stage.areaId;

      // if they've done enough rotations at their current stage area, they're ready to advance
      // but they might not be in that area right now — "worked" is from history, not current
      if(sp.worked >= sp.stage.requiredRotations){
        // this shouldn't happen here since currentStageIdx only points to unsatisfied stages
        // but handle as advance just in case
        const nextStage = progress.nextStage;
        const toArea = nextStage ? getAreaById(nextStage.areaId) : null;
        suggestions.push({ staff:s, flow:progress.flow, fromAreaId:currentAreaId, fromArea,
          toAreaId:nextStage?.areaId||null, toArea, type:'advance',
          reason:`Ready to advance to ${nextStage?.label||'completion'}.` });
      } else {
        // Not enough rotations at this stage yet — suggest placing them at the current stage area
        const toArea = getAreaById(sp.stage.areaId);
        suggestions.push({
          staff:s, flow:progress.flow,
          fromAreaId:currentAreaId, fromArea,
          toAreaId:sp.stage.areaId, toArea,
          type:'stay',
          workedAtStage:sp.worked, requiredAtStage:sp.stage.requiredRotations,
          reason:`${sp.worked}/${sp.stage.requiredRotations} rotations at ${sp.stage.label} — needs ${needed} more before advancing.${!isAtCurrentStage?' Place them in their flow stage area.':''}`,
        });
      }
    }
  });

  // Check previous stage completion to surface 'advance' moves correctly:
  // Re-compute: someone is ready to ADVANCE if the previous stage (the one BEFORE currentStageIdx)
  // is satisfied and their currentStageIdx > 0. Actually — since currentStageIdx is already the
  // FIRST UNSATISFIED stage, they should be AT that stage area. But if the PREVIOUS stage was
  // the one they were just working (and it's now done), they should be moved TO currentStageIdx's area.
  // The STAY suggestions correctly capture this: stay means "keep working on stage at currentStageIdx".
  // But we want to distinguish: ADVANCE = they just finished the previous stage and this is their
  // FIRST rotation at the new stage. Let's enrich: if currentStageIdx > 0 and the previous stage
  // is satisfied and they're NOT yet at currentStage's area, that's an ADVANCE move.
  suggestions.forEach(sug=>{
    if(sug.type==='stay'){
      const progress = getStaffFlowProgress(sug.staff.id);
      if(progress && progress.currentStageIdx > 0){
        const prevSp = progress.stageProgress[progress.currentStageIdx - 1];
        if(prevSp.satisfied && sug.fromAreaId !== sug.toAreaId){
          sug.type = 'advance';
          sug.reason = `Finished ${prevSp.stage.label} (${prevSp.worked}/${prevSp.stage.requiredRotations}) → ready to move to ${progress.stageProgress[progress.currentStageIdx].stage.label} (${progress.stageProgress[progress.currentStageIdx].worked}/${progress.stageProgress[progress.currentStageIdx].stage.requiredRotations} so far).`;
        }
      }
    }
  });

  // enrich each 'advance' suggestion with proficiency gate info
  suggestions.forEach(sug=>{
    if(sug.type==='advance'){
      const rating = getAreaRating(sug.staff.id, sug.fromAreaId);
      const blocked = isProficiencyBlocked(sug.staff.id, sug.fromAreaId);
      sug.currentRating = rating;
      sug.proficiencyBlocked = blocked;
      sug.proficiencyLevel = getProficiencyLevel(rating);
      // check pending feedback for this staff+area combo
      const pending = state.pendingFeedback.find(
        f=>f.staffId===sug.staff.id && f.areaId===sug.fromAreaId && f.status!=='approved'
      );
      sug.hasPendingFeedback = !!pending;
      sug.pendingFeedback = pending || null;
    }
  });

  const order = {advance:0, stay:1, complete:2};
  suggestions.sort((a,b)=>order[a.type]-order[b.type]);
  return suggestions;
}

// ============ BREAK / LUNCH TIME PARSING ============
// breakTimes is free text like "10:30 / 1:00" (break / lunch) or "See Supervisor" (unparseable).
// Times have no AM/PM marker, so we infer it from the known shift bands:
//   7:15-4:00, 7:30-4:15, 7:45-4:30, 8:00-4:45 (all start AM, end PM, 8h45m apart).
// A bare hour like "10" or "10:30" during the work day is AM if >=7 and <12, otherwise PM
// for 12 and 1-6 (since lunch/end-of-shift times fall in that range for this operation).

function parseClockToken(token){
  const t = token.trim().replace(/\s+/g,' '); // tolerate stray spaces like "12: 00"
  const m = t.match(/^(\d{1,2}):?(\d{2})?\s*([AaPp][Mm])?$/);
  if(!m) return null;
  let hour = parseInt(m[1],10);
  const minute = m[2] ? parseInt(m[2],10) : 0;
  const ampm = m[3] ? m[3].toUpperCase() : null;
  if(ampm==='PM'){ if(hour!==12) hour += 12; }
  else if(ampm==='AM'){ if(hour===12) hour = 0; }
  else if(hour===12){ /* noon, keep as 12 */ }
  else if(hour>=1 && hour<=6){ hour += 12; } // 1:00-6:59 -> PM (lunch/shift end range)
  // 7-11 stay as-is (AM, shift start / break range)
  return hour*60 + minute; // minutes since midnight, for sorting/comparison
}

// Builds <option> tags for a lunch-time <select> from the state.lunchTimes
// catalog, pre-selecting by parsed clock time (not exact text) so this
// still recognizes records saved before lunch times became a manageable
// catalog — a bare "12:00" correctly shows the "12:00 PM" option as selected.
function renderLunchOptions(breakTimesRaw){
  const savedLunchRaw = breakTimesRaw ? breakTimesRaw.split('/')[1] : null;
  const savedLunchMins = savedLunchRaw ? parseClockToken(savedLunchRaw) : null;
  return state.lunchTimes.map(lt=>{
    const ltMins = parseClockToken(lt.label);
    const isSelected = savedLunchMins!=null && ltMins!=null && savedLunchMins===ltMins;
    return `<option value="${escapeHtml(lt.label)}" ${isSelected?'selected':''}>${escapeHtml(lt.label)}</option>`;
  }).join('');
}

function formatMinutesAsClock(mins){
  if(mins==null) return '';
  let h = Math.floor(mins/60);
  const m = mins%60;
  const ampm = h>=12 ? 'PM' : 'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

// parses a breakTimes string into {breakLabel, breakMins, lunchLabel, lunchMins, raw, parseable}
function parseBreakTimes(raw){
  const text = (raw||'').trim();
  if(!text) return {raw:text, parseable:false, breakLabel:null, lunchLabel:null, breakMins:null, lunchMins:null};
  const parts = text.split('/').map(p=>p.trim()).filter(Boolean);
  if(parts.length===0) return {raw:text, parseable:false, breakLabel:null, lunchLabel:null, breakMins:null, lunchMins:null};
  const breakRaw = parts[0];
  const lunchRaw = parts.length>1 ? parts[1] : null;
  const breakMins = parseClockToken(breakRaw);
  const lunchMins = lunchRaw ? parseClockToken(lunchRaw) : null;
  const parseable = breakMins!==null || lunchMins!==null;
  return {
    raw:text, parseable,
    breakLabel: breakMins!==null ? breakRaw.replace(/\s+/g,'') : null,
    lunchLabel: lunchMins!==null ? lunchRaw.replace(/\s+/g,'') : null,
    breakMins, lunchMins,
  };
}

// distinct break/lunch time labels actually present across current staff, for filter chips
function distinctBreakLunchLabels(){
  const breaks = new Map(); // label -> mins, for sorting
  const lunches = new Map();
  state.staff.forEach(s=>{
    const p = parseBreakTimes(s.breakTimes);
    if(p.breakLabel) breaks.set(p.breakLabel, p.breakMins);
    if(p.lunchLabel) lunches.set(p.lunchLabel, p.lunchMins);
  });
  const sortEntries = m => Array.from(m.entries()).sort((a,b)=>a[1]-b[1]).map(([label])=>label);
  return { breakLabels: sortEntries(breaks), lunchLabels: sortEntries(lunches) };
}

// returns staff whose break or lunch matches any of the selected labels (label-level match,
// not a live clock — this app has no real-time clock, it's a planning tool), optionally
// filtered to a set of area ids.
function staffOnBreakOrLunch(selectedBreakLabels, selectedLunchLabels, areaIds){
  const bSet = new Set(selectedBreakLabels||[]);
  const lSet = new Set(selectedLunchLabels||[]);
  const aSet = areaIds && areaIds.length ? new Set(areaIds) : null;
  return state.staff.filter(s=>{
    if(s.active===false) return false;
    const areaId = state.assignments[s.id];
    if(aSet && !aSet.has(areaId)) return false;
    const p = parseBreakTimes(s.breakTimes);
    const onBreak = p.breakLabel && bSet.has(p.breakLabel);
    const onLunch = p.lunchLabel && lSet.has(p.lunchLabel);
    if(bSet.size===0 && lSet.size===0) return false;
    return onBreak || onLunch;
  }).map(s=>({
    staff:s,
    areaId: state.assignments[s.id],
    parsed: parseBreakTimes(s.breakTimes),
  }));
}

  // Sync today's scheduled time-off on every render
  _applyTodayTimeOff();
  if(isTeamLeadRole() && viewMode!=='board') viewMode='board'; // team leads: board view only, no other tabs
  const dragModes = (viewMode==='board' || viewMode==='supervisors');
  const mainViews = {
    board: renderBoard,
    overview: renderOverview,
    roster: renderRoster,
    supervisors: renderSupervisorBoard,
    breaks: renderBreaksView,
    timeoff: renderTimeOffView,
  };
  // save scroll BEFORE innerHTML wipe — check multiple possible containers
  const _bwOld = document.querySelector('.board-wrap');
  const _boardScroll     = _bwOld?.scrollTop  || 0;
  const _boardScrollLeft = _bwOld?.scrollLeft || 0;

  const mainContent = (mainViews[viewMode] || renderBoard)();
  root.innerHTML = `
    ${renderNavDrawer()}
    ${renderTopbar()}
    ${isTeamLeadRole() ? '' : renderTabBar()}

    </div>` : ''}
    ${dragModes ? renderSelectionBanner() : ''}
    <div class="layout">
      ${dragModes && drawerOpen ? '<div class="drawer-scrim" id="drawer-scrim"></div>' : ''}
      ${viewMode==='board' ? renderSidebar() : ''}
      ${viewMode==='supervisors' ? renderSupervisorSidebar() : ''}
      ${mainContent}
    </div>
    ${activeModal ? renderModal() : ''}
  `;
  attachHandlers();

  // ── Only play the modal "pop-in" entrance animation when a genuinely new modal opens,
  //    not when the same modal re-renders internally (tab switch, toggle, search, etc.) ──
  if(activeModal){
    const modalEl = document.querySelector('#modal-backdrop .modal');
    if(modalEl){
      if(activeModal.type === _prevModalType) modalEl.classList.add('modal-no-anim');
      _prevModalType = activeModal.type;
    }
  }

  // restore scroll after DOM rebuild — use requestAnimationFrame for reliability
  const bw = document.querySelector('.board-wrap');
  if(bw && (_boardScroll || _boardScrollLeft)){
    bw.scrollTop  = _boardScroll;
    bw.scrollLeft = _boardScrollLeft;
    // double RAF ensures paint has happened before restoring
    requestAnimationFrame(()=>{
      const bw2 = document.querySelector('.board-wrap');
      if(bw2){ bw2.scrollTop = _boardScroll; bw2.scrollLeft = _boardScrollLeft; }
    });
  }
}

// Best-fit coverage suggestions for a given area and absent staff member
function suggestCoverageFor(areaId, absentStaffId){
  if(!areaId) return [];
  const ranked = rankCandidatesForArea(areaId, [absentStaffId]);
  return ranked.slice(0, 4).map(r => {
    const rating  = getAreaRating(r.staff.id, areaId);
    const lvl     = getProficiencyLevel(rating);
    let fitLabel, fitColor;
    if(r.timesWorked >= 3)       { fitLabel='Expert fit';   fitColor='#2E7D32'; }
    else if(r.timesWorked >= 1)  { fitLabel='Has exp.';     fitColor='#1565C0'; }
    else                         { fitLabel='No exp.';      fitColor='#9E9E9E'; }
    return { ...r, rating, lvl, fitLabel, fitColor };
  });
}

// Best-fit coverage picker for a scheduled time-off entry `r` ({staff, area, id, ...}).
// Shared between the Time Off tab's list and the "Coverage planning" modal
// so both surfaces show the same ranked picks instead of a plain A-Z list.

    <div class="to-sug-divider"></div>

function renderTimeOffView(){
  const today     = todayLabel();
  const monthStr  = timeOffMonth || today.slice(0,7);
  const [yr, mo]  = monthStr.split('-').map(Number);
  const monthLabel = new Date(yr, mo-1, 1).toLocaleString('default',{month:'long', year:'numeric'});
  const prevM = (() => { const d=new Date(yr,mo-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
  const nextM = (() => { const d=new Date(yr,mo,  1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();

  // flatten all entries with metadata
  const allOff = [];
  state.staff.forEach(s=>{
    ((state.timeOff||{})[s.id]||[]).forEach(r=>{
      const area     = getAreaById(state.assignments[s.id]);
      const covStaff = r.coverageStaffId ? getStaffById(r.coverageStaffId) : null;
      allOff.push({...r, staff:s, area, covStaff});
    });
  });
  const weekEnd = (() => { const d=new Date(); d.setDate(d.getDate()+6); return d.toISOString().slice(0,10); })();
  const filterFn = timeOffFilter==='today' ? r=>r.startDate<=today&&r.endDate>=today
    : timeOffFilter==='week' ? r=>r.startDate<=weekEnd&&r.endDate>=today
    : r=>r.endDate>=today;
  const upcoming = allOff.filter(filterFn).sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const total    = upcoming.length;
  const needsCov = upcoming.filter(r=>!r.covStaff).length;

  // ── CALENDAR ───────────────────────────────────────────────────────
  const renderCalendar = () => {
    const first   = new Date(yr, mo-1, 1);
    const last    = new Date(yr, mo, 0);
    const dowStart= first.getDay();
    const days    = last.getDate();

    // build day→entries map
    const dayMap = {};
    allOff.forEach(r=>{
      const s = new Date(Math.max(+new Date(r.startDate+'T12:00'), +first));
      const e = new Date(Math.min(+new Date(r.endDate  +'T12:00'), +last));
      for(const d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
        const k = d.toISOString().slice(0,10);
        if(!dayMap[k]) dayMap[k]=[];
        dayMap[k].push(r);
      }
    });

    const DAYS = ['S','M','T','W','T','F','S'];
    let cells = '';
    for(let i=0;i<dowStart;i++) cells+='<div class="cal-cell empty"></div>';
    for(let d=1;d<=days;d++){
      const ds  = yr+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const ents= dayMap[ds]||[];
      const isTod = ds===today;
      const isPast= ds<today;
      const isWE  = ((dowStart+d-1)%7===0)||((dowStart+d-1)%7===6);
      cells += `<div class="cal-cell${isTod?' today':''}${isPast?' past':''}${isWE?' weekend':''}" data-cal-date="${ds}">
        <div class="cal-day-num">${d}</div>
        <div class="cal-entries">
          ${(()=>{ const mx=window.innerWidth<500?2:4; const sh=ents.slice(0,mx); const ex=ents.length-mx;
            return sh.map(r=>`<div class="cal-pill" style="border-left:3px solid ${r.area?.color||'#aaa'};background:${r.area?.color||'#aaa'}18;" title="${escapeHtml(r.staff.name)}"><span class="cal-pill-dot" style="background:${r.area?.color||'#aaa'}"></span><span class="cal-pill-name">${escapeHtml(r.staff.name.split(' ')[0])}</span>${r.covStaff?'<span class="cal-pill-check">✓</span>':'<span class="cal-pill-warn">!</span>'}</div>`).join('')+(ex>0?`<div class="cal-more">+${ex}</div>`:''); })()}
        </div>
      </div>`;
    }
    // fill trailing cells to complete the last row
    const totalCells = dowStart + days;
    const rem = (7 - (totalCells % 7)) % 7;
    for(let i=0;i<rem;i++) cells+='<div class="cal-cell empty trailing"></div>';

    return `
    <div class="cal-grid-wrap">
      <div class="cal-header">
        <button class="cal-nav-btn" id="btn-cal-prev">‹</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="cal-nav-btn" id="btn-cal-next">›</button>
        <button class="cal-today-btn" id="btn-cal-today">Today</button>
        <input type="hidden" id="cal-prev-month" value="${prevM}"/>
        <input type="hidden" id="cal-next-month" value="${nextM}"/>
      </div>
      <div class="cal-legend">
        <span class="cal-legend-item"><span class="cal-legend-dot"></span>! = no coverage</span>
        <span class="cal-legend-item"><span class="cal-legend-dot green"></span>✓ = coverage set</span>
      </div>
      <div class="cal-grid">
        ${DAYS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;
  };

  // ── LIST ──────────────────────────────────────────────────────────
  const renderList = () => {
    const renderCard = (r) => {
      const isActive  = r.startDate<=today && r.endDate>=today;
      const areaColor = r.area?.color||'#aaa';
      return `
      <div class="to-list-card ${isActive?'active':''}">
        <div class="to-card-header">
          <div class="to-card-who">
            <span class="area-dot" style="background:${areaColor}"></span>
            <span class="to-list-name">${escapeHtml(r.staff.name)}</span>
            ${r.staff.tdisNumber?`<span class="chip-tdis-tag" title="TDIS Number">${escapeHtml(r.staff.tdisNumber)}</span>`:''}
            ${r.staff.isSubcontractor?'<span class="ags-badge-sm" title="AGS / Sub-contractor">AGS</span>':''}
            ${r.area?`<span class="to-entry-area" style="background:${areaColor}18;color:${areaColor};border:1px solid ${areaColor}40;">${escapeHtml(r.area.name)}</span>`:'<span class="to-entry-area unassigned">No area</span>'}
            ${isActive?'<span class="to-active-pill">● Now</span>':''}
          </div>
          <div class="to-card-meta">
            <span class="to-card-dates">${r.startDate===r.endDate?r.startDate:r.startDate+' → '+r.endDate}</span>
            ${r.label?`<span class="to-card-reason">${escapeHtml(r.label)}</span>`:''}
            <button class="to-card-edit btn btn-sm btn-light" data-to-edit-staff="${r.staff.id}" data-to-edit-id="${r.id}">Edit</button>
            <button class="to-card-del btn btn-sm btn-danger" data-to-delete-staff="${r.staff.id}" data-to-delete-id="${r.id}">✕</button>
          </div>
        </div>
        <div class="to-card-coverage">
          ${r.covStaff
            ? `<div class="to-cov-badge">
                <span class="to-cov-icon">✓</span>
                <span class="to-cov-name">${escapeHtml(r.covStaff.name)}</span>
                <span class="to-cov-label">covering</span>
                <button class="to-remove-cov btn btn-sm" data-to-remove-cov="${r.id}" data-to-staff="${r.staff.id}">Remove</button>
              </div>`
            : renderCoverageSuggestions(r)}
        </div>
      </div>`;
    };

    const needsCovList = upcoming.filter(r=>!r.covStaff);
    const hasCovList   = upcoming.filter(r=>!!r.covStaff);

    if(upcoming.length===0) return `
      <div class="to-empty-state">
        <div class="to-empty-icon">📅</div>
        <div class="to-empty-msg">No upcoming time off scheduled</div>
        <div class="small-muted">Click + Add to schedule absences in advance.</div>
      </div>`;

    return `
    <div class="to-list-wrap">
      ${needsCovList.length>0?`
        <div class="to-section-head warn">
          <span>⚠ ${needsCovList.length} need${needsCovList.length===1?'s':''} coverage</span>
        </div>
        ${needsCovList.map(renderCard).join('')}`:''}
      ${hasCovList.length>0?`
        <div class="to-section-head ok" style="margin-top:${needsCovList.length?'var(--md-space-5)':'0'};">
          <span>✓ ${hasCovList.length} covered</span>
        </div>
        ${hasCovList.map(renderCard).join('')}`:''}
    </div>`;
  };

  // ── COMBINED: Calendar left, List right ──────────────────────────
  return `
  <div class="view-container timeoff-view timeoff-split">
    <div class="timeoff-split-toolbar">
      <div class="to-toolbar-row1">
        <span class="to-toolbar-title">Time Off${total>0?` <span class="to-summary-pill ${needsCov>0?'warn':''}">${needsCov>0?'⚠ '+needsCov:'✓'}</span>`:''}</span>
        <button class="btn btn-primary to-add-btn" id="btn-to-add">+ Add</button>
      </div>
      <div class="to-toolbar-row2">
        <button class="to-filter-tab ${(timeOffFilter||'upcoming')==='today'?'active':''}" data-to-filter="today">Today</button>
        <button class="to-filter-tab ${(timeOffFilter||'upcoming')==='week'?'active':''}" data-to-filter="week">Week</button>
        <button class="to-filter-tab ${(timeOffFilter||'upcoming')==='upcoming'?'active':''}" data-to-filter="upcoming">All upcoming</button>
      </div>
    </div>
    <div class="timeoff-split-body">
      <div class="timeoff-split-cal">
        ${renderCalendar()}
      </div>
      <div class="timeoff-split-list">
        <div class="split-list-header">Coverage needed</div>
        ${renderList()}
      </div>
    </div>
  </div>`;
}

function renderCalloutBanner(){
  // getStaffById(id) can come back empty for a callout left behind by
  // someone who's since been removed — filter those out here too (on top
  // of the mapSupabaseBoard() filter) so a stale local copy of state can't
  // still show a "?" or crash the coverage dashboard below.
  const outIds = Object.keys(state.callouts).filter(id=>state.callouts[id] && getStaffById(id));
  if(outIds.length===0) return ''; // nobody out → no banner

  const coveredAreaIds = new Set(
    Object.keys(state.coverage||{})
      .map(cid => state.assignments[cid])
      .filter(Boolean)
  );

  // split into three groups
  const unassigned  = outIds.filter(id => !state.assignments[id]);           // out & no area
  const uncovered   = outIds.filter(id => {
    const aId = state.assignments[id];
    return aId && !coveredAreaIds.has(aId);
  });
  const covered     = outIds.filter(id => {
    const aId = state.assignments[id];
    return aId && coveredAreaIds.has(aId);
  });

  const allCovered  = uncovered.length === 0;  // everyone with an area has coverage
  const names       = outIds.slice(0,2).map(id=>getStaffById(id)?.name?.split(' ')[0]||'?').join(', ');
  const extra       = outIds.length > 2 ? ' +' + (outIds.length-2) + ' more' : '';

  // ── All covered: show confirmation banner then auto-hide after 8s ──────
  if(allCovered){
    if(window._bannerDismissed) return ''; // user dismissed, stay gone
    if(!window._bannerAllCoveredAt) window._bannerAllCoveredAt = Date.now();
    const elapsed = Date.now() - window._bannerAllCoveredAt;
    if(elapsed > 8000) return ''; // auto-hide after 8 seconds
    // schedule re-render to remove it
    if(!window._bannerTimer) window._bannerTimer = setTimeout(()=>{ window._bannerAllCoveredAt=null; window._bannerTimer=null; render(); }, 8000 - elapsed);
    return `<div class="callout-banner all-covered">
      <div class="callout-banner-left">
        <span class="callout-banner-icon">✅</span>
        <div class="callout-banner-text">
          <span class="callout-banner-title">All positions covered</span>
          <span class="callout-banner-names">${escapeHtml(names)}${extra} — coverage confirmed</span>
        </div>
      </div>
      <button class="callout-banner-btn all-covered-btn" id="btn-banner-dismiss">Dismiss</button>
    </div>`;
  }

  // reset the "all covered" timer and dismissed flag when coverage is needed again
  window._bannerDismissed = false;
  window._bannerAllCoveredAt = null;
  if(window._bannerTimer){ clearTimeout(window._bannerTimer); window._bannerTimer=null; }

  // ── Some uncovered: RED ─────────────────────────────────────────────────
  if(uncovered.length > 0 && covered.length === 0){
    return `<div class="callout-banner needs-coverage">
      <div class="callout-banner-left">
        <span class="callout-banner-icon">🚨</span>
        <div class="callout-banner-text">
          <span class="callout-banner-title">${uncovered.length} position${uncovered.length>1?'s':''} need coverage</span>
          <span class="callout-banner-names">${escapeHtml(names)}${extra}</span>
        </div>
      </div>
      ${isTeamLeadRole() ? '' : '<button class="callout-banner-btn" id="btn-open-callout-dash">⚡ Assign coverage</button>'}
    </div>`;
  }

  // ── Mixed: some covered, some not: YELLOW ──────────────────────────────
  return `<div class="callout-banner partial-coverage">
    <div class="callout-banner-left">
      <span class="callout-banner-icon">⚠️</span>
      <div class="callout-banner-text">
        <span class="callout-banner-title">${uncovered.length} still need${uncovered.length===1?'s':''} coverage · ${covered.length} covered</span>
        <span class="callout-banner-names">${escapeHtml(names)}${extra}</span>
      </div>
    </div>
    ${isTeamLeadRole() ? '' : '<button class="callout-banner-btn partial-btn" id="btn-open-callout-dash">Continue →</button>'}
  </div>`;
}

function renderChip(s){
  const areaId   = state.assignments[s.id];
  const area     = areaId ? getAreaById(areaId) : null;
  const isOut    = !!state.callouts[s.id];
  const isFixed  = !!(area?.fixed);  // fixed areas never rotate — no flags
  const repeat   = !isFixed && areaId && isRepeatArea(s.id, areaId);
  const conflicts= !isFixed && areaId ? blockConflictsIn(s.id, areaId) : [];
  const displaced= !isFixed && areaId && isTeamLeadDisplaced(s.id, areaId);
  const flagged  = repeat || conflicts.length>0 || displaced;
  const trail    = lastTrail(s.id);
  const isSelected = selectedStaffId === s.id;
  const isSwapFirst = swapMode && swapMode.staffId===s.id;
  const isSwapTarget= swapMode && swapMode.staffId!==s.id && areaId && areaId!==state.assignments[swapMode.staffId];
  const streak   = getRepeatStreak(s.id);
  // search highlight
  const searched = boardSearch && s.name.toLowerCase().includes(boardSearch.toLowerCase());
  const dimmed   = boardSearch && !searched;
  const isCovering  = !!(state.coverage&&state.coverage[s.id]);
  const today       = todayLabel();
  const timeOffRec  = ((state.timeOff||{})[s.id]||[]).find(r=>today>=r.startDate&&today<=r.endDate);
  const isScheduled = !!timeOffRec;                // has a scheduled time-off record today
  const hasCoverage = !!(timeOffRec?.coverageStaffId); // coverage person has been assigned
  const readOnly = isTeamLeadRole();
  return `
  <div class="chip ${flagged?'flagged':''} ${(isOut||isScheduled)?'out':''} ${s.isTeamLead?'lead':''} ${isSelected?'selected-for-move':''} ${isSwapFirst?'swap-first':''} ${isSwapTarget?'swap-target':''} ${dimmed?'search-dim':''} ${searched?'search-match':''} ${isCovering?'covering':''}" draggable="${readOnly?'false':'true'}" data-staff-id="${s.id}" title="${escapeHtml(s.name)}${s.tdisNumber?' · TDIS '+escapeHtml(s.tdisNumber):''}">

      </div>
      <!-- Status badges + mobile controls flush right -->
      <div class="chip-status-badges">
        ${streak>=2&&!area?.fixed?`<span class="streak-badge" title="${streak} rotations in a row">🔥${streak}</span>`:''}
        ${isScheduled&&!hasCoverage?'<span class="chip-out-tag chip-out-scheduled">📅</span>':isScheduled&&hasCoverage?'<span class="chip-out-tag chip-out-covered">✓</span>':isOut?'<span class="chip-out-tag">Out</span>':''}
      </div>
      ${readOnly ? '' : `
      <!-- Mobile only: ○ + ··· -->
      <div class="chip-actions-mobile">
        <button class="chip-quick-out ${isOut?'is-out':''}" data-quick-out="${s.id}" title="${isOut?'Mark back in':'Call out'}">${isOut?'●':'○'}</button>
        <button class="chip-menu-btn ${chipMenuOpen===s.id?'active':''}" data-chip-menu="${s.id}">···</button>
      </div>`}
    </div>
    ${readOnly ? '' : `
    <!-- Desktop only: action pills on their own row below the name -->
    <div class="chip-actions-desktop">
      <button class="chip-act move" data-move="${s.id}">Move</button>
      <button class="chip-act swap" data-swap="${s.id}">Swap</button>
      <button class="chip-act ${isOut?'markin':'callout'}" data-quick-out="${s.id}">${isOut?'Mark in':'Out'}</button>
      <button class="chip-act edit" data-show-profile="${s.id}">Edit</button>
      ${isSwapTarget?'<span class="swap-here-hint" style="margin-left:auto">↕ Swap here</span>':''}
    </div>`}
    ${s.tags ? `<div class="chip-tags">${escapeHtml(s.tags)}</div>` : ''}
    ${(()=>{
      const certs=[];
      if(s.counterCert) certs.push('<span class="cert-badge cert-counter">✅ CA Cert</span>');
      (s.languageCerts||[]).forEach(lid=>{const l=state.languages.find(x=>x.id===lid);if(l) certs.push('<span class="cert-badge cert-lang">🌐 '+l.name+'</span>');});

      return certs.length?'<div class="chip-certs">'+certs.join('')+'</div>':'';
    })()}
    ${(()=>{
      const shiftDisplay = s.lateStart
        ? `<span class="chip-late-tag" title="Late start / partial day">⏰ ${escapeHtml(s.lateStart)}</span> ${escapeHtml(s.shiftHours||'')}`
        : escapeHtml(s.shiftHours||'');
      const brk = s.breakTimes ? ' · ' + escapeHtml(s.breakTimes) : '';
      const vet = isVeteran(s) ? ' <span class="chip-vet-badge" title="'+seniorityLabel(s)+' veteran">🏅</span>' : isSenior(s) ? ' <span class="chip-senior-badge" title="'+seniorityLabel(s)+' seniority">⭐</span>' : '';
      return (shiftDisplay||brk||vet) ? `<div class="chip-hours">${shiftDisplay}${brk}${vet}</div>` : '';
    })()}
    ${(()=>{
      if(area&&area.fixed) return ''; // fixed staff don't rotate, no "was in" needed
      const lastH=(state.history||[]).slice().reverse().find(h=>h.assignments&&h.assignments[s.id]&&h.assignments[s.id]!==state.assignments[s.id]);
      const la=lastH?getAreaById(lastH.assignments[s.id]):null;

    ${(()=>{

// returns up to 2 dot descriptors for last two rotations this person worked
function lastTrail(staffId){
  const dots = [];
  for(let i=state.history.length-1; i>=0 && dots.length<2; i--){
    const aId = state.history[i].assignments[staffId];
    if(aId){
      const area = getAreaById(aId);
      dots.push({color: area?area.color:'#999', label:(area?area.name:'?') + ' (' + state.history[i].period + ')'});
    }
  }
  return dots;
}

function renderAreaCol(area){
  // members drives which chips render (out + covering + regular, so you
  // can still see who's out and who stepped in); the count badge uses
  // activeInArea() instead — physically-present headcount, excluding
  // whoever's out — so a callout + their coverer no longer double-counts
  // against capacity (was showing e.g. "4/3" when only 3 were really there).
  const members = staffInArea(area.id);
  const present = activeInArea(area.id).length;
  const over = present > area.capacity;
  const under = isUnderStaffed(area.id);
  const readOnly = isTeamLeadRole();
  const isTapTarget = !readOnly && !!selectedStaffId && state.assignments[selectedStaffId] !== area.id && !area.fixed;
  return `
  <div class="area-col ${under?'understaffed':''}" style="--area-color:${area.color}">
    <div class="area-head" draggable="${readOnly?'false':'true'}" data-drag-area="${area.id}" data-drag-dept="${area.department}" title="${readOnly?'':'Drag to reorder'}">
      <div class="area-name"><span class="area-drag-handle">⠿</span><span class="area-swatch" style="background:${area.color}"></span>${escapeHtml(area.name)}${area.fixed?'<span class="area-fixed-badge">Fixed</span>':''}${under?'<span class="coverage-gap-badge" title="Coverage gap">⚠</span>':''}</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="area-count ${over?'over':under?'under':present>0?'ok':''}">${present}/${area.capacity}</span>
        ${readOnly ? '' : `<button class="area-menu-btn" data-edit-area="${area.id}">⋯</button>`}
      </div>
    </div>
    <div class="area-drop ${isTapTarget?'tap-target':''}" data-dropzone="area" data-area-id="${area.id}">
      ${isTapTarget?`<button class="tap-target-btn" data-tap-place-area="${area.id}">Move here</button>`:''}
      ${members.length===0 ? '<div class="area-empty-hint">Drop staff here</div>' : members.map(s=>renderChip(s)).join('')}
    </div>
    <div class="area-col-more-cue"></div>
  </div>`;
}

let rosterFilter = '';
let rosterSort = {col:'name', dir:1};

function rosterRows(){
  let rows = state.staff.slice();
  if(rosterFilter.trim()){
    const q = rosterFilter.trim().toLowerCase();
    rows = rows.filter(s=>
      s.name.toLowerCase().includes(q) ||
      (s.tdisNumber||'').toLowerCase().includes(q) ||
      (s.department||'').toLowerCase().includes(q) ||
      (s.tags||'').toLowerCase().includes(q) ||
      (getAreaById(state.assignments[s.id])?.name||'').toLowerCase().includes(q) ||
      (getSupervisorById(s.supervisorId)?.name||'').toLowerCase().includes(q)
    );
  }
  const col = rosterSort.col, dir = rosterSort.dir;
  rows.sort((a,b)=>{
    let av, bv;
    if(col==='area'){ av = getAreaById(state.assignments[a.id])?.name||''; bv = getAreaById(state.assignments[b.id])?.name||''; }
    else if(col==='supervisorId'){ av = getSupervisorById(a.supervisorId)?.name||''; bv = getSupervisorById(b.supervisorId)?.name||''; }
    else { av = a[col]||''; bv = b[col]||''; }
    return String(av).localeCompare(String(bv)) * dir;
  });
  return rows;
}

// ============ BREAKS VIEW (filter by area + break/lunch time) ============

let breaksFilter = { areaIds: [], breakLabels: [], lunchLabels: [] };

function renderBreaksView(){
  const { breakLabels, lunchLabels } = distinctBreakLunchLabels();
  const hasFilter = breaksFilter.breakLabels.length>0 || breaksFilter.lunchLabels.length>0;
  const results = hasFilter ? staffOnBreakOrLunch(breaksFilter.breakLabels, breaksFilter.lunchLabels, breaksFilter.areaIds) : [];

  // group results by area for the coverage-impact summary
  const byArea = {};
  results.forEach(r=>{
    const key = r.areaId || '_unassigned';
    if(!byArea[key]) byArea[key] = [];
    byArea[key].push(r);
  });

  const unparseableCount = state.staff.filter(s=>{
    if(breaksFilter.areaIds.length && !breaksFilter.areaIds.includes(state.assignments[s.id])) return false;
    const p = parseBreakTimes(s.breakTimes);
    return s.breakTimes && !p.parseable;
  }).length;

  return `
  <div class="view-container breaks-wrap">
    <div class="breaks-filters">
      <div class="breaks-filter-group">
        <div class="breaks-filter-label">Area</div>
        <div class="filter-chip-row">
          ${state.areas.map(a=>`
            <button class="filter-chip ${breaksFilter.areaIds.includes(a.id)?'active':''}" data-toggle-area-filter="${a.id}" style="--chip-color:${a.color}">
              <span class="area-swatch" style="background:${a.color}"></span>${escapeHtml(a.name)}
            </button>`).join('')}
          ${breaksFilter.areaIds.length>0?'<button class="filter-chip-clear" id="btn-clear-area-filter">Clear</button>':''}
        </div>
      </div>
      <div class="breaks-filter-group">
        <div class="breaks-filter-label">Break time</div>
        <div class="filter-chip-row">
          ${breakLabels.length===0?'<span class="small-muted">No break times recorded yet</span>':breakLabels.map(label=>`
            <button class="filter-chip ${breaksFilter.breakLabels.includes(label)?'active':''}" data-toggle-break-filter="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join('')}
        </div>
      </div>
      <div class="breaks-filter-group">
        <div class="breaks-filter-label">Lunch time</div>
        <div class="filter-chip-row">
          ${lunchLabels.length===0?'<span class="small-muted">No lunch times recorded yet</span>':lunchLabels.map(label=>`
            <button class="filter-chip ${breaksFilter.lunchLabels.includes(label)?'active':''}" data-toggle-lunch-filter="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join('')}
          ${(breaksFilter.breakLabels.length>0||breaksFilter.lunchLabels.length>0)?'<button class="filter-chip-clear" id="btn-clear-time-filter">Clear</button>':''}
        </div>
      </div>
    </div>

    ${!hasFilter ? `
      <div class="breaks-empty-state">
        <div class="breaks-empty-icon">☕</div>
        <div class="breaks-empty-title">See who's on break</div>
        <div class="breaks-empty-sub">Select a break or lunch time above to see which staff are away and which areas need extra coverage.</div>
      </div>
    ` : `
      <div class="breaks-summary">
        ${results.length} ${results.length===1?'person':'people'} matching${breaksFilter.areaIds.length?' in selected areas':''}
        ${unparseableCount>0?` · <span style="color:var(--md-sys-color-error);">${unparseableCount} have unreadable break times (e.g. "See Supervisor") and aren't counted</span>`:''}
      </div>
      <div class="breaks-results">
        ${Object.keys(byArea).length===0 ? '<div class="breaks-empty-state"><div>No one matches these times in the selected areas.</div></div>' : ''}
        ${state.areas.filter(a=>byArea[a.id]).map(area=>{
          const group = byArea[area.id];
          const totalInArea = staffInArea(area.id).length;
          const remaining = totalInArea - group.length;
          const thin = remaining <= 1 && totalInArea > 1;
          return `
          <div class="breaks-area-card">
            <div class="breaks-area-head" style="border-color:${area.color}">
              <span class="area-swatch" style="background:${area.color}"></span>
              <span class="breaks-area-name">${escapeHtml(area.name)}</span>
              <span class="breaks-coverage-badge ${thin?'thin':''}">${remaining}/${totalInArea} still covering</span>
            </div>
            ${group.map(r=>`
              <div class="breaks-person-row">
                <span class="breaks-person-name">${r.staff.isTeamLead?'★ ':''}${escapeHtml(r.staff.name)}${r.staff.tdisNumber?` <span class="chip-tdis-tag" title="TDIS Number">${escapeHtml(r.staff.tdisNumber)}</span>`:''}${r.staff.isSubcontractor?' <span class="ags-badge-sm" title="AGS / Sub-contractor">AGS</span>':''}</span>
                <span class="breaks-person-times">
                  ${r.parsed.breakLabel && breaksFilter.breakLabels.includes(r.parsed.breakLabel)?`<span class="time-pill">break ${escapeHtml(r.parsed.breakLabel)}</span>`:''}
                  ${r.parsed.lunchLabel && breaksFilter.lunchLabels.includes(r.parsed.lunchLabel)?`<span class="time-pill">lunch ${escapeHtml(r.parsed.lunchLabel)}</span>`:''}
                </span>
              </div>`).join('')}
          </div>`;
        }).join('')}
        ${byArea['_unassigned'] ? `
          <div class="breaks-area-card">
            <div class="breaks-area-head" style="border-color:var(--md-sys-color-outline)">
              <span class="breaks-area-name">Unassigned</span>
            </div>
            ${byArea['_unassigned'].map(r=>`
              <div class="breaks-person-row">
                <span class="breaks-person-name">${escapeHtml(r.staff.name)}${r.staff.tdisNumber?` <span class="chip-tdis-tag" title="TDIS Number">${escapeHtml(r.staff.tdisNumber)}</span>`:''}${r.staff.isSubcontractor?' <span class="ags-badge-sm" title="AGS / Sub-contractor">AGS</span>':''}</span>
                <span class="breaks-person-times">
                  ${r.parsed.breakLabel?`<span class="time-pill">break ${escapeHtml(r.parsed.breakLabel)}</span>`:''}
                  ${r.parsed.lunchLabel?`<span class="time-pill">lunch ${escapeHtml(r.parsed.lunchLabel)}</span>`:''}
                </span>
              </div>`).join('')}
          </div>` : ''}
      </div>
    `}
  </div>`;
}

// --- staff experience stats (read-only: per-area history breakdown) ---
function renderStaffStatsModal(m){
  const s = getStaffById(m.staffId);
  if(!s) return '';
  const { rows, totalCompletedRotations, currentAreaId, bestFit } = staffExperienceBreakdown(s.id);
  const currentArea = currentAreaId ? getAreaById(currentAreaId) : null;
  const maxTimes = rows.length ? Math.max(...rows.map(r=>r.timesWorked)) : 0;
  return `
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2>${s.isTeamLead?'★ ':''}${s.needsAccommodations?'♿ ':''}${escapeHtml(s.name)}</h2>
        <p>${escapeHtml(s.department||'')}${s.tags?' · '+escapeHtml(s.tags):''}${s.needsAccommodations?' · <b>Needs accommodations</b>':''}</p>
        ${(()=>{
          const certs=[];
          if(s.counterCert) certs.push('<span class="cert-badge cert-counter">✅ Counter Acceptance Certified</span>');
          (s.languageCerts||[]).forEach(lid=>{const l=state.languages.find(x=>x.id===lid);if(l) certs.push('<span class="cert-badge cert-lang">🌐 '+l.name+'</span>');});
          if(s.isSubcontractor) certs.push('<span class="roster-card-ags" title="AGS / Sub-contractor">🏷 AGS</span>');
          return certs.length?'<div class="stats-cert-row">'+certs.join('')+'</div>':'';
        })()}
      </div>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      <div class="stats-current-row">
        <span class="small-muted">Currently in</span>
        ${currentArea ? `<span class="stats-current-area"><span class="area-swatch" style="background:${currentArea.color}"></span>${escapeHtml(currentArea.name)}</span>` : '<span class="small-muted"><em>Unassigned</em></span>'}
      </div>

      ${isTeamLeadRole() && currentAreaId && currentAreaId===authState.account.assigned_area_id ? `
      <div class="field" style="margin-top:14px;">
        <label>Lunch time</label>
        <select id="stats-lunch-input" data-staff-id="${s.id}"><option value="">— Select —</option>
          ${renderLunchOptions(s.breakTimes)}
        </select>
        <div class="field-hint" style="margin-top:4px;">You can change lunch time for people currently in your area. Shift hours are set by a supervisor or admin.</div>
      </div>
      ` : ''}

      ${totalCompletedRotations===0 ? `
        <div class="small-muted" style="line-height:1.6;margin-top:14px;">No rotations have been completed yet, so there's no history to show. Experience will build up here once you start using "Rotate now".</div>
      ` : `
        ${bestFit ? `
        <div class="stats-bestfit-banner">
          <span class="stats-bestfit-icon">🎯</span>
          <div>
            <div class="stats-bestfit-title">Best fit to cover <b>${escapeHtml(bestFit.area.name)}</b></div>
            <div class="stats-bestfit-sub">${bestFit.timesWorked}× experience${bestFit.periodsAgo===0?' · worked it last rotation':' · last there '+bestFit.periodsAgo+' rotation'+(bestFit.periodsAgo===1?'':'s')+' ago'}</div>
          </div>
        </div>` : `
        <div class="stats-bestfit-banner stats-bestfit-none">
          <span class="stats-bestfit-icon">🆕</span>
          <div>
            <div class="stats-bestfit-title">No prior experience in any other area yet</div>
            <div class="stats-bestfit-sub">Based on ${totalCompletedRotations} completed rotation${totalCompletedRotations===1?'':'s'} so far</div>
          </div>
        </div>`}

        <div class="small-muted" style="margin:16px 0 10px;font-weight:700;">
          Area history <span style="font-weight:400;">· based on ${totalCompletedRotations} completed rotation${totalCompletedRotations===1?'':'s'}</span>
        </div>
        <div class="stats-bar-list">
          ${rows.map(r=>{
            const rating = getAreaRating(s.id, r.areaId);
            const lvl = getProficiencyLevel(rating);
            const ratingHistory = getAreaRatingHistory(s.id, r.areaId);
            const lastRated = ratingHistory.length ? ratingHistory[ratingHistory.length-1] : null;
            return `
            <div class="stats-bar-row ${!r.hasExperience?'no-exp':''}">
              <div class="stats-bar-label">
                <span class="area-swatch" style="background:${r.area.color}"></span>
                <span>${escapeHtml(r.area.name)}</span>
                ${r.areaId===currentAreaId?'<span class="stats-current-tag">current</span>':''}
                ${bestFit && r.areaId===bestFit.areaId?'<span class="stats-bestfit-tag">best fit</span>':''}
                ${rating?`<span class="proficiency-mini-badge" style="background:${lvl.color};">${rating} ${lvl.label}</span>`:''}
              </div>
              <div class="stats-bar-track">
                <div class="stats-bar-fill" style="width:${r.hasExperience ? Math.max(8, Math.round(r.timesWorked/maxTimes*100)) : 0}%; background:${r.area.color};"></div>
              </div>
              <div class="stats-bar-count">
                ${r.hasExperience
                  ? `${r.timesWorked}× <span class="small-muted">· ${r.periodsAgo===0?'last rotation':r.periodsAgo+' rotation'+(r.periodsAgo===1?'':'s')+' since'}${lastRated?` · rated ${lastRated.period}`:''}</span>`
                  : `<span class="small-muted">never worked here</span>`}
              </div>
            </div>`;
          }).join('')}
        </div>
      `}
    </div>
    <div class="modal-foot">
      <button class="btn btn-light" id="modal-close-stats">Close</button>
      ${isTeamLeadRole() ? '' : '<button class="btn btn-primary" id="modal-edit-from-stats">Edit details</button>'}
    </div>
  </div>`;
}
